<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG-Organism - Agent Coordination Visualizer</title>
    <!-- Simple robot emoji favicon as data URI (URL-encoded for browser compatibility) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
    <!-- ENV_INJECTED -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #00ffff;
            overflow: hidden;
            height: 100vh;
        }

        /* Header */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
            border-bottom: 2px solid #00ffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 255, 255, 0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .home-btn {
            background: none;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .home-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #header h1 {
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #system-status {
            font-size: 14px;
            color: #ff00ff;
            font-family: 'Courier New', monospace;
        }

        /* Main Container */
        #container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
        }

        /* Canvas Container */
        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Agent Selection Panel */
        #agent-panel {
            position: fixed;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 320px;
            background: rgba(10, 14, 26, 0.95);
            border-right: 2px solid #00ffff;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s;
        }

        #agent-panel.collapsed {
            transform: translateX(-300px);
        }

        .panel-header {
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border-bottom: 1px solid #00ffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .panel-header h2 {
            font-size: 16px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .agent-selector {
            padding: 10px;
        }

        .agent-card {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(0, 255, 255, 0.05);
            border-left: 3px solid #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            position: relative;
        }

        .agent-card:hover {
            background: rgba(0, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .agent-card.selected {
            background: rgba(255, 0, 255, 0.2);
            border-left-color: #ff00ff;
        }

        .agent-card.working {
            border-left-color: #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .agent-icon {
            font-size: 24px;
            float: left;
            margin-right: 10px;
        }

        .agent-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #00ffff;
        }

        .agent-description {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            clear: both;
        }

        .agent-status {
            font-size: 10px;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .agent-status.idle {
            background: rgba(128, 128, 128, 0.2);
            color: #888;
        }

        .agent-status.working {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }

        .agent-status.completed {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
        }

        /* Prompt Input Panel */
        #prompt-panel {
            position: fixed;
            right: 0;
            top: 60px;
            width: 350px;
            background: rgba(10, 14, 26, 0.95);
            border-left: 2px solid #00ffff;
            z-index: 100;
            padding: 20px;
            transition: transform 0.3s;
        }

        #prompt-panel.collapsed {
            transform: translateX(330px);
        }

        .prompt-section {
            margin-bottom: 20px;
        }

        .prompt-section h3 {
            font-size: 14px;
            color: #ff00ff;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #prompt-input {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
        }

        #prompt-input::placeholder {
            color: #666;
        }

        .selected-agents-list {
            font-size: 11px;
            color: #888;
            margin-bottom: 10px;
        }

        .selected-agent-badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid #ff00ff;
            border-radius: 3px;
            margin-right: 5px;
            margin-bottom: 5px;
            color: #ff00ff;
        }

        .execute-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .execute-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            transform: scale(1.05);
        }

        .execute-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Activity Log */
        .activity-log {
            max-height: 300px;
            overflow-y: auto;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            border-radius: 4px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 2px solid #00ffff;
            padding-left: 8px;
        }

        .log-entry.agent {
            border-left-color: #ff00ff;
        }

        .log-entry.artifact {
            border-left-color: #00ff00;
        }

        .log-entry.error {
            border-left-color: #ff0000;
        }

        .log-timestamp {
            color: #666;
            margin-right: 8px;
        }

        .log-message {
            color: #00ffff;
        }

        /* Toggle Buttons */
        .toggle-sidebar {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 60px;
            background: rgba(10, 14, 26, 0.95);
            border: 1px solid #00ffff;
            color: #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 101;
            transition: all 0.3s;
        }

        .toggle-sidebar:hover {
            background: rgba(0, 255, 255, 0.2);
        }

        #toggle-agents {
            left: 320px;
            border-radius: 0 4px 4px 0;
        }

        #toggle-prompt {
            right: 350px;
            border-radius: 4px 0 0 4px;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 255, 0.8);
        }

        /* Control Panel */
        #control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 26, 0.95);
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);
        }

        .control-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.3s;
            font-family: inherit;
        }

        .control-btn:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .control-btn.active {
            background: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
            color: #ff00ff;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">INITIALIZING AG-ORGANISM...</div>
    </div>

    <!-- Header -->
    <div id="header">
        <div class="header-left">
            <a href="#" id="home-btn" class="home-btn">🏠 Home</a>
            <h1>🤖 AG-ORGANISM - AGENT COORDINATION</h1>
        </div>
        <div id="system-status">STATUS: IDLE</div>
    </div>

    <!-- Main Container -->
    <div id="container">
        <!-- Agent Selection Panel -->
        <div id="agent-panel">
            <div class="panel-header">
                <h2>Available Agents</h2>
                <p style="font-size: 11px; color: #888; margin-top: 5px;">Click to select agents for execution</p>
            </div>
            <div class="agent-selector" id="agent-list">
                <!-- Agents will be populated here -->
            </div>
        </div>

        <!-- Toggle Agents Button -->
        <button class="toggle-sidebar" id="toggle-agents">◀</button>

        <!-- Canvas Container -->
        <div id="canvas-container"></div>

        <!-- Toggle Prompt Button -->
        <button class="toggle-sidebar" id="toggle-prompt">▶</button>

        <!-- Prompt Input Panel -->
        <div id="prompt-panel">
            <div class="prompt-section">
                <h3>Selected Agents</h3>
                <div class="selected-agents-list" id="selected-agents-display">
                    <em style="color: #666;">No agents selected</em>
                </div>
            </div>

            <div class="prompt-section">
                <h3>Execution Prompt</h3>
                <textarea 
                    id="prompt-input" 
                    placeholder="Enter your prompt for the selected agents...&#10;&#10;Example: Research the latest trends in AI and create a blog post about them."></textarea>
            </div>

            <button class="execute-btn" id="execute-btn" disabled>Execute Pipeline</button>

            <div class="prompt-section">
                <h3>Activity Log</h3>
                <div class="activity-log" id="activity-log">
                    <div class="log-entry">
                        <span class="log-timestamp">[READY]</span>
                        <span class="log-message">System initialized. Select agents and enter a prompt to begin.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel">
        <button class="control-btn active" id="btn-reset-camera">Reset View</button>
        <button class="control-btn active" id="btn-toggle-bloom">Bloom: ON</button>
        <button class="control-btn active" id="btn-toggle-connections">Connections: ON</button>
    </div>

    <!-- Simple 2D Canvas - No Three.js dependencies -->
    <script type="module">

        // =============================================================================
        // Configuration
        // =============================================================================

        // AG-UI Backend API URL (use injected env var if available, otherwise fallback)
        // Note: Fallback URL is for static GitHub Pages deployment only
        // Cloud Run deployment uses window.ENV.AG_UI_FRONTEND_URL set by server
        const API_BASE_URL = window.ENV?.AG_UI_FRONTEND_URL 
            ? `${window.ENV.AG_UI_FRONTEND_URL}/api`
            : (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000/api'
                : 'https://chained-ag-ui-frontend-sguacxy5gq-uc.a.run.app/api');

        // =============================================================================
        // Error Logging Utilities
        // =============================================================================
        
        /**
         * Send error to backend for persistent logging in GCP Cloud Run
         */
        async function logErrorToBackend(error, type, context = {}) {
            const errorData = {
                type: type || 'generic',
                timestamp: new Date().toISOString(),
                error: {
                    name: error.name || 'Error',
                    message: error.message || String(error),
                    stack: error.stack || ''
                },
                url: window.location.href,
                userAgent: navigator.userAgent,
                context: context
            };
            
            // Always log to console
            console.error(`[${errorData.timestamp}] [Frontend Error] [${errorData.type}]`, errorData);
            
            // Send to backend for persistent logging
            try {
                await fetch('/api/log-error', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(errorData)
                });
            } catch (err) {
                console.warn('[Frontend Error] Failed to send error to backend:', err);
            }
        }
        
        /**
         * Setup global error handlers
         */
        function setupGlobalErrorHandlers() {
            // Catch unhandled promise rejections
            window.addEventListener('unhandledrejection', (event) => {
                logErrorToBackend(
                    event.reason || new Error('Unhandled promise rejection'),
                    'unhandled-promise-rejection',
                    { promise: String(event.promise) }
                );
            });
            
            // Catch global errors
            window.addEventListener('error', (event) => {
                logErrorToBackend(
                    event.error || new Error(event.message),
                    'global-error',
                    {
                        filename: event.filename,
                        lineno: event.lineno,
                        colno: event.colno
                    }
                );
            });
            
            // Log when Three.js fails to load
            if (typeof THREE === 'undefined') {
                logErrorToBackend(
                    new Error('Three.js failed to load from CDN or local source'),
                    'dependency-load-error',
                    { dependency: 'three.js' }
                );
            }
        }
        
        // Setup error handlers immediately
        setupGlobalErrorHandlers();

        // =============================================================================
        // Global State - 2D Canvas Version
        // =============================================================================

        let canvas, ctx;
        let agentNodes = []; // 2D agent representations
        let connectionLines = [];
        let artifactObjects = []; // For artifact visualization
        let showConnections = true;
        
        // Camera/View state for 2D pan and zoom
        let viewOffsetX = 0;
        let viewOffsetY = 0;
        let viewScale = 1.0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // Agent state tracking
        const availableAgents = [];
        const selectedAgents = new Set();
        const agentStates = new Map(); // agentId -> status

        // Pipeline execution state
        let activePipeline = null;
        let pipelineInterval = null;

        // =============================================================================
        // 2D Canvas Scene Setup
        // =============================================================================

        function initScene() {
            // Create canvas element
            canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60; // Account for header
            canvas.style.display = 'block';
            canvas.style.background = '#0a0e1a';
            
            document.getElementById('canvas-container').appendChild(canvas);
            
            ctx = canvas.getContext('2d');
            
            // Setup mouse event handlers for pan
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseUp);
            canvas.addEventListener('wheel', onMouseWheel);
            
            // Touch support for mobile
            canvas.addEventListener('touchstart', onTouchStart);
            canvas.addEventListener('touchmove', onTouchMove);
            canvas.addEventListener('touchend', onTouchEnd);
            
            // Window resize handler
            window.addEventListener('resize', onWindowResize, false);
        }
        
        // Mouse event handlers for 2D pan/zoom
        function onMouseDown(e) {
            isDragging = true;
            dragStartX = e.clientX - viewOffsetX;
            dragStartY = e.clientY - viewOffsetY;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        }
        
        function onMouseMove(e) {
            if (isDragging) {
                viewOffsetX = e.clientX - dragStartX;
                viewOffsetY = e.clientY - dragStartY;
            }
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        }
        
        function onMouseUp(e) {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }
        
        function onMouseWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            viewScale *= delta;
            viewScale = Math.max(0.3, Math.min(3.0, viewScale)); // Clamp scale
        }
        
        // Touch support
        let touchStartDistance = 0;
        function onTouchStart(e) {
            if (e.touches.length === 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX - viewOffsetX;
                dragStartY = e.touches[0].clientY - viewOffsetY;
            } else if (e.touches.length === 2) {
                // Pinch to zoom
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }
        
        function onTouchMove(e) {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                viewOffsetX = e.touches[0].clientX - dragStartX;
                viewOffsetY = e.touches[0].clientY - dragStartY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const delta = distance / touchStartDistance;
                viewScale *= delta;
                viewScale = Math.max(0.3, Math.min(3.0, viewScale));
                touchStartDistance = distance;
            }
        }
        
        function onTouchEnd(e) {
            isDragging = false;
        }

        // =============================================================================
        // 2D Agent Visualization (Simple Circles)
        // =============================================================================

        function drawCircle(x, y, radius, color, glow = false) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            if (glow) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        function drawAgent(agent, x, y, state) {
            ctx.save();
            
            // Apply view transformations
            ctx.translate(viewOffsetX, viewOffsetY);
            ctx.scale(viewScale, viewScale);
            
            const baseRadius = 30;
            const color = getAgentColorHex(agent.id);
            
            // Outer glow ring for active agents
            if (state === 'processing') {
                const pulseRadius = baseRadius + 5 + Math.sin(Date.now() * 0.005) * 5;
                drawCircle(x, y, pulseRadius, color, true);
            }
            
            // Main agent circle
            drawCircle(x, y, baseRadius, color, false);
            
            // Status indicator
            let statusColor = '#888888';
            if (state === 'processing') statusColor = '#ffff00';
            if (state === 'completed') statusColor = '#00ff00';
            if (state === 'failed') statusColor = '#ff0000';
            
            drawCircle(x, y + baseRadius - 10, 8, statusColor, false);
            
            // Agent icon/emoji
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(agent.icon || '🤖', x, y);
            
            // Agent name label
            ctx.font = '12px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(agent.displayName, x, y + baseRadius + 20);
            
            ctx.restore();
        }
        
        function getAgentColorHex(agentId) {
            const colors = {
                'academic-research': '#00ffff',
                'google-trends': '#ff00ff',
                'blog-writer': '#00ff00',
                'code-reviewer': '#ffaa00',
                'data-analyst': '#9900ff',
                'image-generator': '#ff0099',
            };
            return colors[agentId] || '#00ffff';
        }

        // =============================================================================
        // Agent Management - 2D Version
        // =============================================================================

        async function loadAvailableAgents() {
            try {
                const response = await fetch(`${API_BASE_URL}/registry`);
                if (!response.ok) {
                    throw new Error(`Failed to load agents: ${response.statusText}`);
                }
                
                const data = await response.json();
                const agents = data.agents || [];
                
                // Populate available agents
                availableAgents.length = 0;
                availableAgents.push(...agents);
                
                // Display agents in panel
                const agentList = document.getElementById('agent-list');
                agentList.innerHTML = '';
                
                agents.forEach(agent => {
                    const card = document.createElement('div');
                    card.className = 'agent-card';
                    card.dataset.agentId = agent.id;
                    card.innerHTML = `
                        <div class="agent-icon">${agent.icon || '🤖'}</div>
                        <div class="agent-name">${agent.displayName}</div>
                        <div class="agent-description">${agent.description}</div>
                        <span class="agent-status idle">Idle</span>
                    `;
                    
                    card.addEventListener('click', () => toggleAgentSelection(agent.id));
                    agentList.appendChild(card);
                    
                    // Initialize agent state
                    agentStates.set(agent.id, 'idle');
                });
                
                // Create 2D agent positions
                createAgentNodes();
                
                logActivity('system', `Loaded ${agents.length} available agents`);
            } catch (error) {
                console.error('Failed to load agents:', error);
                logActivity('error', `Failed to load agents: ${error.message}`);
                
                // Send detailed error to backend for persistent logging
                logErrorToBackend(error, 'agent-load-error', {
                    api_url: API_BASE_URL,
                    endpoint: '/registry'
                });
            }
        }

        function toggleAgentSelection(agentId) {
            const card = document.querySelector(`[data-agent-id="${agentId}"]`);
            if (!card) return;
            
            if (selectedAgents.has(agentId)) {
                selectedAgents.delete(agentId);
                card.classList.remove('selected');
            } else {
                selectedAgents.add(agentId);
                card.classList.add('selected');
            }
            
            updateSelectedAgentsDisplay();
            updateExecuteButton();
            updateConnectionLines();
        }

        function updateSelectedAgentsDisplay() {
            const display = document.getElementById('selected-agents-display');
            
            if (selectedAgents.size === 0) {
                display.innerHTML = '<em style="color: #666;">No agents selected</em>';
                return;
            }
            
            display.innerHTML = '';
            selectedAgents.forEach(agentId => {
                const agent = availableAgents.find(a => a.id === agentId);
                if (agent) {
                    const badge = document.createElement('span');
                    badge.className = 'selected-agent-badge';
                    badge.textContent = `${agent.icon} ${agent.displayName}`;
                    display.appendChild(badge);
                }
            });
        }

        function updateExecuteButton() {
            const btn = document.getElementById('execute-btn');
            const prompt = document.getElementById('prompt-input').value.trim();
            
            btn.disabled = selectedAgents.size === 0 || prompt === '' || activePipeline !== null;
        }

        // =============================================================================
        // 2D Visualization Layout
        // =============================================================================

        function createAgentNodes() {
            // Clear existing nodes
            agentNodes = [];
            
            // Center position in canvas
            const centerX = canvas.width / 2;
            const centerY = (canvas.height) / 2;
            
            // Arrange agents in a circle
            const radius = 200;
            availableAgents.forEach((agent, index) => {
                const angle = (index / availableAgents.length) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                agentNodes.push({
                    agent: agent,
                    x: x,
                    y: y,
                    floatOffset: Math.random() * Math.PI * 2
                });
            });
            
            // Create initial connection lines
            updateConnectionLines();
        }

        function updateConnectionLines() {
            // Clear existing lines
            connectionLines = [];
            
            // Create lines between selected agents
            const selected = Array.from(selectedAgents);
            for (let i = 0; i < selected.length - 1; i++) {
                const node1 = agentNodes.find(n => n.agent.id === selected[i]);
                const node2 = agentNodes.find(n => n.agent.id === selected[i + 1]);
                
                if (node1 && node2) {
                    connectionLines.push({
                        x1: node1.x,
                        y1: node1.y,
                        x2: node2.x,
                        y2: node2.y,
                        color: '#ff00ff'
                    });
                }
            }
        }
        
        function drawConnectionLines() {
            if (!showConnections) return;
            
            ctx.save();
            ctx.translate(viewOffsetX, viewOffsetY);
            ctx.scale(viewScale, viewScale);
            
            connectionLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x1, line.y1);
                ctx.lineTo(line.x2, line.y2);
                ctx.strokeStyle = line.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.6;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            });
            
            ctx.restore();
        }

        // =============================================================================
        // Pipeline Execution
        // =============================================================================

        async function executePipeline() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (selectedAgents.size === 0 || !prompt) return;
            
            // Update UI
            document.getElementById('execute-btn').disabled = true;
            document.getElementById('system-status').textContent = 'STATUS: EXECUTING';
            logActivity('system', `Starting pipeline with ${selectedAgents.size} agents`);
            
            // Reset connection lines
            createConnectionLines();
            
            try {
                // Call the pipeline API
                const response = await fetch(`${API_BASE_URL}/pipeline`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic: prompt,
                        agents: Array.from(selectedAgents)
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Pipeline failed: ${response.statusText}`);
                }
                
                const data = await response.json();
                activePipeline = data.pipeline;
                
                logActivity('system', `Pipeline created: ${activePipeline.id}`);
                
                // Start polling for updates
                startPipelinePolling(activePipeline.id);
                
            } catch (error) {
                console.error('Pipeline execution failed:', error);
                logActivity('error', `Pipeline failed: ${error.message}`);
                document.getElementById('system-status').textContent = 'STATUS: ERROR';
                document.getElementById('execute-btn').disabled = false;
            }
        }

        function startPipelinePolling(pipelineId) {
            if (pipelineInterval) clearInterval(pipelineInterval);
            
            pipelineInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/pipeline?id=${pipelineId}`);
                    if (!response.ok) return;
                    
                    const data = await response.json();
                    updatePipelineVisualization(data.pipeline);
                    
                    // Check if pipeline is complete
                    if (data.pipeline.status === 'completed' || data.pipeline.status === 'failed') {
                        stopPipelinePolling();
                        document.getElementById('system-status').textContent = `STATUS: ${data.pipeline.status.toUpperCase()}`;
                        document.getElementById('execute-btn').disabled = false;
                        activePipeline = null;
                    }
                } catch (error) {
                    console.error('Pipeline polling failed:', error);
                }
            }, 2000); // Poll every 2 seconds
        }

        function stopPipelinePolling() {
            if (pipelineInterval) {
                clearInterval(pipelineInterval);
                pipelineInterval = null;
            }
        }

        function updatePipelineVisualization(pipeline) {
            if (!pipeline || !pipeline.a2aSteps) return;
            
            pipeline.a2aSteps.forEach((step, index) => {
                const agentId = step.agentName;
                const status = step.status?.state || 'pending';
                
                // Update agent state
                agentStates.set(agentId, status);
                
                // Update UI card
                const card = document.querySelector(`[data-agent-id="${agentId}"]`);
                if (card) {
                    const statusEl = card.querySelector('.agent-status');
                    statusEl.className = `agent-status ${status}`;
                    statusEl.textContent = status;
                    card.className = `agent-card ${status === 'completed' ? 'completed' : status === 'failed' ? 'error' : 'working'}`;
                }
                
                // Log artifacts
                if (step.artifacts && step.artifacts.length > 0) {
                    step.artifacts.forEach(artifact => {
                        logActivity('artifact', `${step.agentName} created: ${artifact.name} (${artifact.type})`);
                        
                        // Create artifact visualization
                        const node = agentNodes.find(n => n.agent.id === agentId);
                        if (node) {
                            visualizeArtifact(artifact, node);
                        }
                    });
                }
                
                // Log messages
                if (step.status?.message) {
                    const messageText = step.status.message.parts?.[0]?.text || '';
                    if (messageText) {
                        logActivity('agent', `${step.agentName}: ${messageText.substring(0, 100)}...`);
                    }
                }
            });
        }

        function visualizeArtifact(artifact, node) {
            if (!node) return;
            
            // Create a floating artifact object
            const color = artifact.type === 'text' ? '#00ffff' :
                         artifact.type === 'json' ? '#ff00ff' :
                         '#00ff00';
            
            const offset = {
                x: (Math.random() - 0.5) * 80,
                y: (Math.random() - 0.5) * 80
            };
            
            artifactObjects.push({
                x: node.x + offset.x,
                y: node.y + offset.y,
                radius: 8,
                color: color,
                createdAt: Date.now(),
                rotationSpeed: Math.random() * 0.02 + 0.01,
                rotation: 0,
                alpha: 1.0
            });
            
            // Remove after 10 seconds
            setTimeout(() => {
                artifactObjects = artifactObjects.filter(a => a.createdAt !== Date.now());
            }, 10000);
        }

        // =============================================================================
        // Activity Log
        // =============================================================================

        function logActivity(type, message) {
            const log = document.getElementById('activity-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="log-message">${message}</span>
            `;
            
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 50 entries
            while (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }
        }

        // =============================================================================
        // 2D Animation Loop
        // =============================================================================

        function animate() {
            requestAnimationFrame(animate);
            
            // Clear canvas
            ctx.fillStyle = '#0a0e1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw connection lines first (behind agents)
            drawConnectionLines();
            
            // Update and draw agent nodes
            agentNodes.forEach(node => {
                // Animate floating
                node.floatOffset += 0.02;
                const floatY = Math.sin(node.floatOffset) * 10;
                
                // Get current state
                const state = agentStates.get(node.agent.id) || 'idle';
                
                // Draw agent
                drawAgent(node.agent, node.x, node.y + floatY, state);
            });
            
            // Draw artifacts
            ctx.save();
            ctx.translate(viewOffsetX, viewOffsetY);
            ctx.scale(viewScale, viewScale);
            
            artifactObjects.forEach(artifact => {
                // Rotate
                artifact.rotation += artifact.rotationSpeed;
                
                // Fade out over time
                const age = Date.now() - artifact.createdAt;
                artifact.alpha = Math.max(0, 1.0 - age / 10000);
                
                // Draw diamond shape
                ctx.save();
                ctx.translate(artifact.x, artifact.y);
                ctx.rotate(artifact.rotation);
                ctx.globalAlpha = artifact.alpha;
                
                ctx.beginPath();
                ctx.moveTo(0, -artifact.radius);
                ctx.lineTo(artifact.radius, 0);
                ctx.lineTo(0, artifact.radius);
                ctx.lineTo(-artifact.radius, 0);
                ctx.closePath();
                
                ctx.fillStyle = artifact.color;
                ctx.fill();
                ctx.strokeStyle = artifact.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = artifact.color;
                ctx.fill();
                
                ctx.restore();
            });
            
            ctx.restore();
        }

        // =============================================================================
        // Event Handlers - 2D Version
        // =============================================================================

        function onWindowResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60; // Account for header
            
            // Recalculate agent positions
            createAgentNodes();
        }

        function setupEventListeners() {
            // Home button - link to AG-UI frontend
            const homeBtn = document.getElementById('home-btn');
            if (homeBtn) {
                if (window.ENV?.AG_UI_FRONTEND_URL) {
                    homeBtn.href = window.ENV.AG_UI_FRONTEND_URL;
                } else {
                    // Fallback: disable button and show tooltip if no URL configured
                    homeBtn.style.opacity = '0.5';
                    homeBtn.style.cursor = 'not-allowed';
                    homeBtn.title = 'Home URL not configured';
                    homeBtn.addEventListener('click', (e) => e.preventDefault());
                    console.warn('[AG-Organism] AG_UI_FRONTEND_URL not configured - home button disabled');
                }
            }
            
            // Execute button
            document.getElementById('execute-btn').addEventListener('click', executePipeline);
            
            // Prompt input
            document.getElementById('prompt-input').addEventListener('input', updateExecuteButton);
            
            // Toggle buttons
            document.getElementById('toggle-agents').addEventListener('click', () => {
                const panel = document.getElementById('agent-panel');
                panel.classList.toggle('collapsed');
                const btn = document.getElementById('toggle-agents');
                btn.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
                btn.style.left = panel.classList.contains('collapsed') ? '20px' : '320px';
            });

            document.getElementById('toggle-prompt').addEventListener('click', () => {
                const panel = document.getElementById('prompt-panel');
                panel.classList.toggle('collapsed');
                const btn = document.getElementById('toggle-prompt');
                btn.textContent = panel.classList.contains('collapsed') ? '◀' : '▶';
                btn.style.right = panel.classList.contains('collapsed') ? '20px' : '350px';
            });

            // Control buttons
            document.getElementById('btn-reset-camera').addEventListener('click', () => {
                // Reset 2D view
                viewOffsetX = 0;
                viewOffsetY = 0;
                viewScale = 1.0;
            });

            document.getElementById('btn-toggle-bloom').addEventListener('click', (e) => {
                // Bloom not applicable to 2D canvas, but keep button for UI consistency
                e.target.textContent = 'Bloom: N/A';
                e.target.disabled = true;
                e.target.style.opacity = '0.5';
            });

            document.getElementById('btn-toggle-connections').addEventListener('click', (e) => {
                showConnections = !showConnections;
                e.target.textContent = `Connections: ${showConnections ? 'ON' : 'OFF'}`;
                e.target.classList.toggle('active');
            });
            
            // Set cursor style
            canvas.style.cursor = 'grab';
        }

        // =============================================================================
        // Initialization
        // =============================================================================

        async function init() {
            initScene();
            await loadAvailableAgents();
            setupEventListeners();
            animate();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1000);
        }

        // Start the application
        init();
    </script>
</body>

name: Git Operations
description: 'Common Git operations: commit, tag, branch, status checks with proper error handling'
branding:
  icon: 'git-branch'
  color: 'red'

inputs:
  operation:
    description: 'Operation: commit, tag, branch, status, diff, clean, fetch'
    required: true
  commit-message:
    description: 'Commit message (for commit operation)'
    required: false
  tag-name:
    description: 'Tag name (for tag operation)'
    required: false
  branch-name:
    description: 'Branch name (for branch operation)'
    required: false
  files:
    description: 'Files to add/commit (default: all changes)'
    required: false
    default: '.'
  push:
    description: 'Push changes after commit/tag'
    required: false
    default: 'false'
  force:
    description: 'Use force for operations (with care!)'
    required: false
    default: 'false'
  user-name:
    description: 'Git user name for commits'
    required: false
    default: 'github-actions[bot]'
  user-email:
    description: 'Git user email for commits'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'

outputs:
  result:
    description: 'Operation result'
    value: ${{ steps.git-op.outputs.result }}
  has-changes:
    description: 'Whether there are uncommitted changes (for status)'
    value: ${{ steps.git-op.outputs.has-changes }}
  current-branch:
    description: 'Current branch name'
    value: ${{ steps.git-op.outputs.current-branch }}
  commit-sha:
    description: 'Commit SHA (for commit operation)'
    value: ${{ steps.git-op.outputs.commit-sha }}

runs:
  using: composite
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "${{ inputs.user-name }}"
        git config user.email "${{ inputs.user-email }}"
    
    - name: Execute Git Operation
      id: git-op
      shell: bash
      run: |
        set -e
        
        # Get current branch
        CURRENT_BRANCH=$(git branch --show-current)
        echo "current-branch=$CURRENT_BRANCH" >> $GITHUB_OUTPUT
        
        RESULT=""
        HAS_CHANGES="false"
        COMMIT_SHA=""
        
        case "${{ inputs.operation }}" in
          commit)
            if [ -z "${{ inputs.commit-message }}" ]; then
              echo "Error: commit-message is required for commit operation"
              exit 1
            fi
            
            # Add files (properly quoted)
            git add "${{ inputs.files }}"
            
            # Check if there are changes
            if git diff --staged --quiet; then
              echo "ℹ️  No changes to commit"
              RESULT="No changes"
            else
              # Commit
              git commit -m "${{ inputs.commit-message }}"
              COMMIT_SHA=$(git rev-parse HEAD)
              echo "commit-sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
              
              RESULT="Committed $COMMIT_SHA"
              echo "✅ Created commit: $COMMIT_SHA"
              
              # Push if requested
              if [ "${{ inputs.push }}" = "true" ]; then
                PUSH_OPTS=""
                [ "${{ inputs.force }}" = "true" ] && PUSH_OPTS="--force"
                git push $PUSH_OPTS origin "$CURRENT_BRANCH"
                echo "✅ Pushed to $CURRENT_BRANCH"
              fi
            fi
            ;;
            
          tag)
            if [ -z "${{ inputs.tag-name }}" ]; then
              echo "Error: tag-name is required for tag operation"
              exit 1
            fi
            
            TAG_OPTS=""
            [ "${{ inputs.force }}" = "true" ] && TAG_OPTS="-f"
            
            git tag $TAG_OPTS "${{ inputs.tag-name }}"
            RESULT="Tagged as ${{ inputs.tag-name }}"
            echo "✅ Created tag: ${{ inputs.tag-name }}"
            
            if [ "${{ inputs.push }}" = "true" ]; then
              PUSH_OPTS=""
              [ "${{ inputs.force }}" = "true" ] && PUSH_OPTS="--force"
              git push $PUSH_OPTS origin "${{ inputs.tag-name }}"
              echo "✅ Pushed tag"
            fi
            ;;
            
          branch)
            if [ -z "${{ inputs.branch-name }}" ]; then
              echo "Error: branch-name is required for branch operation"
              exit 1
            fi
            
            git checkout -b "${{ inputs.branch-name }}"
            RESULT="Created and switched to branch ${{ inputs.branch-name }}"
            echo "✅ Created branch: ${{ inputs.branch-name }}"
            
            if [ "${{ inputs.push }}" = "true" ]; then
              git push -u origin "${{ inputs.branch-name }}"
              echo "✅ Pushed branch"
            fi
            ;;
            
          status)
            # Check for changes
            if ! git diff --quiet || ! git diff --staged --quiet; then
              HAS_CHANGES="true"
              RESULT=$(git status --short)
              echo "📝 Uncommitted changes found:"
              git status --short
            else
              HAS_CHANGES="false"
              RESULT="Working tree clean"
              echo "✅ Working tree is clean"
            fi
            echo "has-changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
            ;;
            
          diff)
            RESULT=$(git diff)
            if [ -z "$RESULT" ]; then
              RESULT="No differences"
              echo "ℹ️  No differences found"
            else
              echo "📋 Differences:"
              echo "$RESULT"
            fi
            ;;
            
          clean)
            # Clean untracked files
            RESULT=$(git clean -n -d)
            if [ -z "$RESULT" ]; then
              echo "✅ No untracked files to clean"
            else
              echo "🧹 Untracked files to clean:"
              echo "$RESULT"
              
              if [ "${{ inputs.force }}" = "true" ]; then
                git clean -f -d
                echo "✅ Cleaned untracked files"
              else
                echo "ℹ️  Set force=true to actually clean files"
              fi
            fi
            ;;
            
          fetch)
            git fetch origin
            RESULT="Fetched from origin"
            echo "✅ Fetched from origin"
            ;;
            
          *)
            echo "Error: Unknown operation: ${{ inputs.operation }}"
            echo "Valid operations: commit, tag, branch, status, diff, clean, fetch"
            exit 1
            ;;
        esac
        
        # Set result output
        echo "result<<EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

name: JSON Operations
description: 'Powerful JSON processing operations: query, validate, merge, transform'
branding:
  icon: 'code'
  color: 'purple'

inputs:
  operation:
    description: 'Operation to perform: query, validate, merge, transform, prettify'
    required: true
  input-file:
    description: 'Path to input JSON file'
    required: false
  input-json:
    description: 'JSON string to process (alternative to input-file)'
    required: false
  query:
    description: 'JQ query for query operation (e.g., ".data.items[]")'
    required: false
  output-file:
    description: 'Path to save output (default: stdout)'
    required: false
  merge-files:
    description: 'Comma-separated list of JSON files to merge'
    required: false
  transform-script:
    description: 'Python expression for transform operation'
    required: false
  fail-on-error:
    description: 'Exit with error on validation failure'
    required: false
    default: 'true'

outputs:
  result:
    description: 'Operation result or transformed JSON'
    value: ${{ steps.process.outputs.result }}
  valid:
    description: 'Whether JSON is valid (for validate operation)'
    value: ${{ steps.process.outputs.valid }}
  error:
    description: 'Error message if operation failed'
    value: ${{ steps.process.outputs.error }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.input-file }}" ] && [ -z "${{ inputs.input-json }}" ] && [ "${{ inputs.operation }}" != "merge" ]; then
          echo "Error: Either input-file or input-json must be provided"
          exit 1
        fi
    
    - name: Install jq if needed
      shell: bash
      run: |
        if ! command -v jq &> /dev/null; then
          echo "📦 Installing jq..."
          sudo apt-get update -qq
          sudo apt-get install -y jq
        fi
    
    - name: Process JSON
      id: process
      shell: bash
      run: |
        set -e
        
        # Initialize output variables
        RESULT=""
        VALID="false"
        ERROR=""
        
        # Get input JSON
        if [ -n "${{ inputs.input-file }}" ]; then
          if [ ! -f "${{ inputs.input-file }}" ]; then
            ERROR="Input file not found: ${{ inputs.input-file }}"
            echo "error=$ERROR" >> $GITHUB_OUTPUT
            if [ "${{ inputs.fail-on-error }}" = "true" ]; then
              echo "❌ $ERROR"
              exit 1
            fi
            exit 0
          fi
          INPUT_JSON=$(cat "${{ inputs.input-file }}")
        else
          INPUT_JSON='${{ inputs.input-json }}'
        fi
        
        # Perform operation
        case "${{ inputs.operation }}" in
          query)
            if [ -z "${{ inputs.query }}" ]; then
              ERROR="Query is required for query operation"
              echo "error=$ERROR" >> $GITHUB_OUTPUT
              exit 1
            fi
            RESULT=$(echo "$INPUT_JSON" | jq -r '${{ inputs.query }}')
            ;;
            
          validate)
            if echo "$INPUT_JSON" | jq empty 2>/dev/null; then
              VALID="true"
              RESULT="Valid JSON"
              echo "✅ JSON is valid"
            else
              VALID="false"
              ERROR="Invalid JSON"
              echo "error=$ERROR" >> $GITHUB_OUTPUT
              if [ "${{ inputs.fail-on-error }}" = "true" ]; then
                echo "❌ Invalid JSON"
                exit 1
              fi
            fi
            ;;
            
          merge)
            if [ -z "${{ inputs.merge-files }}" ]; then
              ERROR="merge-files is required for merge operation"
              echo "error=$ERROR" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            # Split comma-separated files and merge
            IFS=',' read -ra FILES <<< "${{ inputs.merge-files }}"
            RESULT="{}"
            for file in "${FILES[@]}"; do
              file=$(echo "$file" | xargs)  # trim whitespace
              if [ ! -f "$file" ]; then
                ERROR="File not found: $file"
                echo "error=$ERROR" >> $GITHUB_OUTPUT
                exit 1
              fi
              RESULT=$(echo "$RESULT" | jq -s '.[0] * .[1]' - "$file")
            done
            echo "✅ Merged ${#FILES[@]} JSON files"
            ;;
            
          transform)
            if [ -z "${{ inputs.transform-script }}" ]; then
              ERROR="transform-script is required for transform operation"
              echo "error=$ERROR" >> $GITHUB_OUTPUT
              exit 1
            fi
            RESULT=$(echo "$INPUT_JSON" | jq '${{ inputs.transform-script }}')
            ;;
            
          prettify)
            RESULT=$(echo "$INPUT_JSON" | jq '.')
            echo "✅ Prettified JSON"
            ;;
            
          *)
            ERROR="Unknown operation: ${{ inputs.operation }}"
            echo "error=$ERROR" >> $GITHUB_OUTPUT
            echo "❌ $ERROR"
            echo "Valid operations: query, validate, merge, transform, prettify"
            exit 1
            ;;
        esac
        
        # Save result
        if [ -n "${{ inputs.output-file }}" ]; then
          echo "$RESULT" > "${{ inputs.output-file }}"
          echo "💾 Saved output to: ${{ inputs.output-file }}"
        else
          echo "$RESULT"
        fi
        
        # Set outputs
        echo "result<<EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "valid=$VALID" >> $GITHUB_OUTPUT

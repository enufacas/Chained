name: JavaScript/TypeScript Automation
description: Automated JS/TS building, testing, and quality checks
inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '20'
  package-manager:
    description: Package manager (npm, yarn, pnpm)
    required: false
    default: npm
  run-build:
    description: Whether to run build
    required: false
    default: 'true'
  run-tests:
    description: Whether to run tests
    required: false
    default: 'true'
runs:
  using: composite
  steps:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ inputs.node-version }}
  - name: Install dependencies
    shell: bash
    run: "\ncase \"${{ inputs.package-manager }}\" in\n  npm)\n    npm ci\n    ;;\n\
      \  yarn)\n    yarn install --frozen-lockfile\n    ;;\n  pnpm)\n    pnpm install\
      \ --frozen-lockfile\n    ;;\nesac\n"
  - name: Run build
    if: inputs.run-build == 'true'
    shell: bash
    run: ${{ inputs.package-manager }} run build
  - name: Run tests
    if: inputs.run-tests == 'true'
    shell: bash
    run: ${{ inputs.package-manager }} test

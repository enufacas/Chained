name: JavaScript/TypeScript Automation
description: Automated JS/TS building, testing, and quality checks
inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '20'
  package-manager:
    description: Package manager (npm, yarn, pnpm)
    required: false
    default: 'npm'
  run-build:
    description: Whether to run build
    required: false
    default: 'true'
  run-tests:
    description: Whether to run tests
    required: false
    default: 'true'
runs:
  using: composite
  steps:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ inputs.node-version }}
  - name: Install dependencies
    shell: bash
    run: |
      case "${{ inputs.package-manager }}" in
        npm)
          npm ci
          ;;
        yarn)
          yarn install --frozen-lockfile
          ;;
        pnpm)
          pnpm install --frozen-lockfile
          ;;
        *)
          echo "Error: Unknown package manager '${{ inputs.package-manager }}'"
          exit 1
          ;;
      esac
  - name: Run build
    if: inputs.run-build == 'true'
    shell: bash
    run: |
      case "${{ inputs.package-manager }}" in
        npm|yarn|pnpm)
          ${{ inputs.package-manager }} run build
          ;;
      esac
  - name: Run tests
    if: inputs.run-tests == 'true'
    shell: bash
    run: |
      case "${{ inputs.package-manager }}" in
        npm|yarn)
          ${{ inputs.package-manager }} test
          ;;
        pnpm)
          pnpm run test
          ;;
      esac

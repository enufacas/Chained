name: HTTP Request Operations
description: 'Make HTTP requests with proper handling: GET, POST, PUT, DELETE with auth and retries'
branding:
  icon: 'globe'
  color: 'green'

inputs:
  method:
    description: 'HTTP method: GET, POST, PUT, DELETE, PATCH'
    required: false
    default: 'GET'
  url:
    description: 'URL to request'
    required: true
  headers:
    description: 'HTTP headers as JSON object (e.g., {"Authorization": "Bearer token"})'
    required: false
  body:
    description: 'Request body (for POST, PUT, PATCH)'
    required: false
  body-file:
    description: 'Path to file containing request body'
    required: false
  output-file:
    description: 'Save response to file'
    required: false
  timeout:
    description: 'Request timeout in seconds'
    required: false
    default: '30'
  retry-count:
    description: 'Number of retries on failure'
    required: false
    default: '3'
  retry-delay:
    description: 'Delay between retries in seconds'
    required: false
    default: '5'
  follow-redirects:
    description: 'Follow HTTP redirects'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Exit with error on HTTP error status'
    required: false
    default: 'true'
  auth-token:
    description: 'Bearer token for Authorization header'
    required: false
  basic-auth:
    description: 'Basic auth credentials (username:password)'
    required: false

outputs:
  response:
    description: 'Response body'
    value: ${{ steps.request.outputs.response }}
  status:
    description: 'HTTP status code'
    value: ${{ steps.request.outputs.status }}
  headers:
    description: 'Response headers'
    value: ${{ steps.request.outputs.headers }}
  success:
    description: 'Whether request succeeded (2xx status)'
    value: ${{ steps.request.outputs.success }}

runs:
  using: composite
  steps:
    - name: Make HTTP Request
      id: request
      shell: bash
      run: |
        set +e  # Don't exit on curl errors
        
        # Build curl command
        CURL_CMD="curl -s -w '\n%{http_code}\n%{redirect_url}' --max-time ${{ inputs.timeout }}"
        
        # Add method
        CURL_CMD="$CURL_CMD -X ${{ inputs.method }}"
        
        # Add redirects
        if [ "${{ inputs.follow-redirects }}" = "true" ]; then
          CURL_CMD="$CURL_CMD -L"
        fi
        
        # Add auth
        if [ -n "${{ inputs.auth-token }}" ]; then
          CURL_CMD="$CURL_CMD -H 'Authorization: Bearer ${{ inputs.auth-token }}'"
        fi
        if [ -n "${{ inputs.basic-auth }}" ]; then
          CURL_CMD="$CURL_CMD -u '${{ inputs.basic-auth }}'"
        fi
        
        # Add custom headers
        HEADER_ARGS=""
        if [ -n "${{ inputs.headers }}" ]; then
          while IFS= read -r header; do
            [ -n "$header" ] && HEADER_ARGS="$HEADER_ARGS $header"
          done < <(echo '${{ inputs.headers }}' | jq -r 'to_entries[] | "-H \"" + .key + ": " + .value + "\""')
        fi
        
        # Add body
        if [ -n "${{ inputs.body-file }}" ]; then
          if [ ! -f "${{ inputs.body-file }}" ]; then
            echo "Error: Body file not found: ${{ inputs.body-file }}"
            exit 1
          fi
          CURL_CMD="$CURL_CMD --data-binary @${{ inputs.body-file }}"
        elif [ -n "${{ inputs.body }}" ]; then
          CURL_CMD="$CURL_CMD -d '${{ inputs.body }}'"
        fi
        
        # Retry logic
        RETRY=0
        MAX_RETRIES=${{ inputs.retry-count }}
        SUCCESS="false"
        
        while [ $RETRY -le $MAX_RETRIES ]; do
          if [ $RETRY -gt 0 ]; then
            echo "🔄 Retry $RETRY/$MAX_RETRIES (waiting ${{ inputs.retry-delay }}s...)"
            sleep ${{ inputs.retry-delay }}
          fi
          
          # Execute request and capture output
          TEMP_FILE=$(mktemp)
          TEMP_HEADERS=$(mktemp)
          TEMP_STATUS=$(mktemp)
          
          # Use separate file for status code
          CURL_EXIT=0
          eval "$CURL_CMD $HEADER_ARGS -w '%{http_code}' -o '$TEMP_FILE' '${{ inputs.url }}' 2>&1 | tee '$TEMP_STATUS'" > /dev/null || CURL_EXIT=$?
          
          # Extract status code from status file or use 000 on failure
          STATUS=$(cat "$TEMP_STATUS" 2>/dev/null | grep -E -o '[0-9]{3}' | tail -1)
          [ -z "$STATUS" ] && STATUS="000"
          
          # Extract response
          RESPONSE=$(cat "$TEMP_FILE" 2>/dev/null || echo "")
          
          # Check if successful
          if [ $CURL_EXIT -eq 0 ] && [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            SUCCESS="true"
            echo "✅ Request successful (HTTP $STATUS)"
            break
          else
            echo "⚠️  Request failed (exit: $CURL_EXIT, status: $STATUS)"
            RETRY=$((RETRY + 1))
          fi
        done
        
        # Check final result
        if [ "$SUCCESS" = "false" ] && [ "${{ inputs.fail-on-error }}" = "true" ]; then
          echo "❌ Request failed after $MAX_RETRIES retries"
          rm -f "$TEMP_FILE" "$TEMP_HEADERS" "$TEMP_STATUS"
          exit 1
        fi
        
        # Save to file if requested
        if [ -n "${{ inputs.output-file }}" ]; then
          echo "$RESPONSE" > "${{ inputs.output-file }}"
          echo "💾 Response saved to: ${{ inputs.output-file }}"
        fi
        
        # Output response
        echo "$RESPONSE"
        
        # Set outputs
        echo "response<<EOF" >> $GITHUB_OUTPUT
        echo "$RESPONSE" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "status=$STATUS" >> $GITHUB_OUTPUT
        echo "success=$SUCCESS" >> $GITHUB_OUTPUT
        
        # Clean up
        rm -f "$TEMP_FILE" "$TEMP_HEADERS" "$TEMP_STATUS"

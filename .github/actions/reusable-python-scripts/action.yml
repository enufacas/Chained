name: Python Script Executor
description: 'Execute Python scripts with proper environment setup, dependencies, and error handling'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  script:
    description: 'Python script to execute (path or inline code)'
    required: true
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  requirements:
    description: 'Requirements to install (comma-separated or file path)'
    required: false
  args:
    description: 'Arguments to pass to script'
    required: false
  working-directory:
    description: 'Working directory for script execution'
    required: false
    default: '.'
  inline:
    description: 'Whether script input is inline code vs file path'
    required: false
    default: 'false'
  output-file:
    description: 'Capture stdout to file'
    required: false
  env-vars:
    description: 'Environment variables as JSON object'
    required: false
  timeout:
    description: 'Script timeout in seconds'
    required: false
    default: '300'
  fail-on-error:
    description: 'Exit with error if script fails'
    required: false
    default: 'true'

outputs:
  stdout:
    description: 'Script standard output'
    value: ${{ steps.execute.outputs.stdout }}
  stderr:
    description: 'Script standard error'
    value: ${{ steps.execute.outputs.stderr }}
  exit-code:
    description: 'Script exit code'
    value: ${{ steps.execute.outputs.exit-code }}
  success:
    description: 'Whether script executed successfully'
    value: ${{ steps.execute.outputs.success }}

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install Dependencies
      if: inputs.requirements != ''
      shell: bash
      run: |
        echo "📦 Installing dependencies..."
        
        # Check if requirements is a file path
        if [ -f "${{ inputs.requirements }}" ]; then
          pip install -r "${{ inputs.requirements }}"
        else
          # Treat as comma-separated list
          IFS=',' read -ra DEPS <<< "${{ inputs.requirements }}"
          for dep in "${DEPS[@]}"; do
            dep=$(echo "$dep" | xargs)  # trim whitespace
            pip install "$dep"
          done
        fi
        
        echo "✅ Dependencies installed"
    
    - name: Execute Python Script
      id: execute
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e  # Don't exit on script errors
        
        # Set environment variables if provided
        if [ -n "${{ inputs.env-vars }}" ]; then
          echo '${{ inputs.env-vars }}' | jq -r 'to_entries[] | "export " + .key + "=\"" + .value + "\""' | while read -r line; do
            eval "$line"
          done
        fi
        
        # Prepare script execution
        TEMP_STDOUT=$(mktemp)
        TEMP_STDERR=$(mktemp)
        
        if [ "${{ inputs.inline }}" = "true" ]; then
          # Execute inline code
          echo '🐍 Executing inline Python code...'
          timeout ${{ inputs.timeout }} python3 -c '${{ inputs.script }}' ${{ inputs.args }} > "$TEMP_STDOUT" 2> "$TEMP_STDERR"
          EXIT_CODE=$?
        else
          # Execute script file
          if [ ! -f "${{ inputs.script }}" ]; then
            echo "Error: Script file not found: ${{ inputs.script }}"
            echo "exit-code=1" >> $GITHUB_OUTPUT
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "🐍 Executing Python script: ${{ inputs.script }}"
          timeout ${{ inputs.timeout }} python3 "${{ inputs.script }}" ${{ inputs.args }} > "$TEMP_STDOUT" 2> "$TEMP_STDERR"
          EXIT_CODE=$?
        fi
        
        # Capture outputs
        STDOUT=$(cat "$TEMP_STDOUT")
        STDERR=$(cat "$TEMP_STDERR")
        
        # Display output
        if [ -n "$STDOUT" ]; then
          echo "📤 Output:"
          echo "$STDOUT"
        fi
        
        if [ -n "$STDERR" ]; then
          echo "⚠️  Errors/Warnings:"
          echo "$STDERR"
        fi
        
        # Save to file if requested
        if [ -n "${{ inputs.output-file }}" ]; then
          echo "$STDOUT" > "${{ inputs.output-file }}"
          echo "💾 Output saved to: ${{ inputs.output-file }}"
        fi
        
        # Determine success
        SUCCESS="false"
        if [ $EXIT_CODE -eq 0 ]; then
          SUCCESS="true"
          echo "✅ Script executed successfully"
        elif [ $EXIT_CODE -eq 124 ]; then
          echo "⏱️  Script timed out after ${{ inputs.timeout }} seconds"
        else
          echo "❌ Script failed with exit code: $EXIT_CODE"
        fi
        
        # Set outputs
        echo "stdout<<EOF" >> $GITHUB_OUTPUT
        echo "$STDOUT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "stderr<<EOF" >> $GITHUB_OUTPUT
        echo "$STDERR" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT
        echo "success=$SUCCESS" >> $GITHUB_OUTPUT
        
        # Clean up
        rm -f "$TEMP_STDOUT" "$TEMP_STDERR"
        
        # Exit with error if requested
        if [ "${{ inputs.fail-on-error }}" = "true" ] && [ "$SUCCESS" = "false" ]; then
          exit $EXIT_CODE
        fi

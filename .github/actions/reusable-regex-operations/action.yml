name: Regex Operations
description: 'Powerful regex operations: match, replace, extract, validate patterns'
branding:
  icon: 'search'
  color: 'orange'

inputs:
  operation:
    description: 'Operation: match, replace, extract, validate, split'
    required: true
  pattern:
    description: 'Regex pattern to use'
    required: true
  input-file:
    description: 'Path to input file'
    required: false
  input-text:
    description: 'Text to process (alternative to input-file)'
    required: false
  replacement:
    description: 'Replacement string for replace operation'
    required: false
  output-file:
    description: 'Path to save output'
    required: false
  flags:
    description: 'Regex flags: i (ignore case), m (multiline), g (global)'
    required: false
    default: ''
  format:
    description: 'Output format: text, json, lines'
    required: false
    default: 'text'

outputs:
  result:
    description: 'Operation result'
    value: ${{ steps.process.outputs.result }}
  matches:
    description: 'Number of matches found'
    value: ${{ steps.process.outputs.matches }}
  success:
    description: 'Whether operation succeeded'
    value: ${{ steps.process.outputs.success }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.input-file }}" ] && [ -z "${{ inputs.input-text }}" ]; then
          echo "Error: Either input-file or input-text must be provided"
          exit 1
        fi
    
    - name: Process with Regex
      id: process
      shell: bash
      run: |
        set -e
        
        # Get input text
        if [ -n "${{ inputs.input-file }}" ]; then
          if [ ! -f "${{ inputs.input-file }}" ]; then
            echo "Error: File not found: ${{ inputs.input-file }}"
            exit 1
          fi
          INPUT_TEXT=$(cat "${{ inputs.input-file }}")
        else
          INPUT_TEXT='${{ inputs.input-text }}'
        fi
        
        # Build grep/sed flags
        GREP_FLAGS=""
        SED_FLAGS=""
        [ "${{ inputs.flags }}" =~ "i" ] && GREP_FLAGS="${GREP_FLAGS} -i" && SED_FLAGS="${SED_FLAGS}I"
        [ "${{ inputs.flags }}" =~ "m" ] && GREP_FLAGS="${GREP_FLAGS} -z"
        
        RESULT=""
        MATCHES=0
        SUCCESS="true"
        
        # Perform operation
        case "${{ inputs.operation }}" in
          match)
            if echo "$INPUT_TEXT" | grep -E $GREP_FLAGS '${{ inputs.pattern }}' > /dev/null; then
              MATCHES=$(echo "$INPUT_TEXT" | grep -E $GREP_FLAGS '${{ inputs.pattern }}' | wc -l)
              RESULT=$(echo "$INPUT_TEXT" | grep -E $GREP_FLAGS '${{ inputs.pattern }}')
              echo "✅ Found $MATCHES matches"
            else
              echo "ℹ️  No matches found"
            fi
            ;;
            
          replace)
            if [ -z "${{ inputs.replacement }}" ]; then
              echo "Error: replacement is required for replace operation"
              exit 1
            fi
            RESULT=$(echo "$INPUT_TEXT" | sed -E "s/${{ inputs.pattern }}/${{ inputs.replacement }}/g${SED_FLAGS}")
            MATCHES=$(echo "$INPUT_TEXT" | grep -o -E '${{ inputs.pattern }}' | wc -l)
            echo "✅ Replaced $MATCHES occurrences"
            ;;
            
          extract)
            RESULT=$(echo "$INPUT_TEXT" | grep -o -E $GREP_FLAGS '${{ inputs.pattern }}')
            MATCHES=$(echo "$RESULT" | wc -l)
            echo "✅ Extracted $MATCHES matches"
            ;;
            
          validate)
            if echo "$INPUT_TEXT" | grep -E $GREP_FLAGS '${{ inputs.pattern }}' > /dev/null; then
              SUCCESS="true"
              RESULT="Pattern matches"
              echo "✅ Pattern found in input"
            else
              SUCCESS="false"
              RESULT="Pattern not found"
              echo "❌ Pattern not found in input"
            fi
            ;;
            
          split)
            RESULT=$(echo "$INPUT_TEXT" | sed -E "s/${{ inputs.pattern }}/\n/g")
            MATCHES=$(echo "$RESULT" | wc -l)
            echo "✅ Split into $MATCHES parts"
            ;;
            
          *)
            echo "Error: Unknown operation: ${{ inputs.operation }}"
            echo "Valid operations: match, replace, extract, validate, split"
            exit 1
            ;;
        esac
        
        # Format output
        if [ "${{ inputs.format }}" = "json" ]; then
          RESULT=$(echo "$RESULT" | jq -R -s 'split("\n") | map(select(length > 0))')
        fi
        
        # Save output
        if [ -n "${{ inputs.output-file }}" ]; then
          echo "$RESULT" > "${{ inputs.output-file }}"
          echo "💾 Saved to: ${{ inputs.output-file }}"
        else
          echo "$RESULT"
        fi
        
        # Set outputs
        echo "result<<EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "matches=$MATCHES" >> $GITHUB_OUTPUT
        echo "success=$SUCCESS" >> $GITHUB_OUTPUT

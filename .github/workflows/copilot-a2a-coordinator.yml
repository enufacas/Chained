name: "A2A: 🔗 Copilot Coordinator (Branch-Based)"

# Phase 3A Implementation: Multi-agent task decomposition via branch-based communication
# This workflow coordinates multiple Copilot custom agents using Git branches as message bus

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process for A2A orchestration'
        required: true
        type: number

  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  check_trigger:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    outputs:
      should_run: '${{ steps.check.outputs.should_run }}'
      issue_number: '${{ steps.check.outputs.issue_number }}'
    steps:
      - name: 'Check if workflow should run'
        id: 'check'
        run: |
          # Check if this is a workflow_dispatch or @copilot-a2a-coordinator command
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "issue_number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            comment_body="${{ github.event.comment.body }}"
            if [[ "$comment_body" =~ ^@copilot-a2a-coordinator ]]; then
              # Check user permissions
              author_association="${{ github.event.comment.author_association }}"
              if [[ "$author_association" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
                echo "should_run=true" >> $GITHUB_OUTPUT
                echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
              else
                echo "should_run=false" >> $GITHUB_OUTPUT
                echo "⚠️ User does not have permission to trigger A2A coordinator"
              fi
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  coordinator:
    needs: 'check_trigger'
    if: needs.check_trigger.outputs.should_run == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    permissions:
      contents: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0  # Full history for branch management

      - name: 'Set up Python'
        uses: 'actions/setup-python@v5'
        with:
          python-version: '3.11'

      - name: 'Install dependencies'
        run: |
          pip install requests PyGithub

      - name: 'Configure Git'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 'Acknowledge coordination request'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🔗 **Copilot A2A Coordinator Activated**

I'm analyzing this task and will coordinate multiple Copilot custom agents via branch-based communication.

**Communication Method**: Git branches as message bus
**Progress**: [Track in workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

Please wait while I orchestrate the custom agent collaboration..."

      - name: 'Analyze task and create agent assignments'
        id: 'analyze'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          python3 tools/a2a/copilot_task_analyzer.py

      - name: 'Create sub-issues and assign custom agents'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
          AGENT_ASSIGNMENTS: '${{ steps.analyze.outputs.agent_assignments }}'
        run: |
          python3 tools/a2a/copilot_agent_assigner.py

      - name: 'Set up branch-based message bus'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          python3 tools/a2a/branch_message_bus_setup.py

      - name: 'Poll for agent completion'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
          POLLING_TIMEOUT_MINUTES: '30'
          POLLING_INTERVAL_SECONDS: '30'
        run: |
          python3 tools/a2a/branch_polling_monitor.py

      - name: 'Aggregate results from branches'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          python3 tools/a2a/branch_result_aggregator.py

      - name: 'Cleanup A2A branches'
        if: always()
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          python3 tools/a2a/branch_cleanup.py

      - name: 'Post coordination summary'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          python3 tools/a2a/copilot_coordination_summary.py

      - name: 'Handle errors'
        if: failure()
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ needs.check_trigger.outputs.issue_number }}'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ **Copilot A2A Coordination Failed**

The multi-agent orchestration encountered an error. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

**Troubleshooting**:
- Verify custom agents exist for the task type
- Check if GraphQL agent assignment is working
- Verify branch creation/push permissions

You can retry by commenting \`@copilot-a2a-coordinator\` or use workflow_dispatch."

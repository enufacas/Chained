name: "A2A: Parallel Agent Orchestration"

# ==============================================================================
# A2A PROTOCOL IMPLEMENTATION - PARALLEL AGENTS (MULTI-PROVIDER)
# ==============================================================================
# This workflow implements the Agent2Agent (A2A) Protocol with TRUE parallel
# agent execution. Each agent runs as a separate job with its own bounded
# AI API call, properly modeling the A2A protocol.
#
# MULTI-PROVIDER SUPPORT (Nov 2024):
#   - Gemini: Uses google-github-actions/run-gemini-cli
#   - GitHub Models: Uses GitHub Models API (models.github.ai)
#
# Architecture:
#   setup      →  [agent-1/gemini]     →  aggregate  →  implement
#                 [agent-2/github]
#                 [agent-3/gemini]
#
# This maps A2A concepts to GitHub Actions:
#   - A2A Task → GitHub Job (bounded execution context)
#   - A2A Artifact → GitHub Artifact (actions/upload-artifact)
#   - contextId → run_id + issue_number
#   - referenceTaskIds → Artifact names from agent jobs
#
# Provider Distribution:
#   - 'balanced': Alternates between providers (default)
#   - 'gemini_only': All agents use Gemini
#   - 'github_only': All agents use GitHub Models API
#
# Spec Reference: https://a2a-protocol.org/latest/specification/
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze and fix'
        required: true
        type: number
      agent_count:
        description: 'Number of parallel agent jobs (1-5)'
        required: false
        default: 3
        type: number
      agents:
        description: 'Optional: Specific agents (comma-separated)'
        required: false
        default: ''
        type: string
      provider:
        description: 'AI provider distribution strategy'
        required: false
        default: 'balanced'
        type: choice
        options:
          - balanced
          - gemini_only
          - github_only
      auto_execute:
        description: 'Automatically implement and create PR'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  # ==========================================================================
  # JOB 1: SETUP
  # ==========================================================================
  # Prepares the agent selection, generates AgentCards, assigns providers,
  # and posts initial notification. Outputs the agent-provider matrix.
  # ==========================================================================
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.select.outputs.agents }}
      agent_count: ${{ steps.select.outputs.count }}
      agent_matrix: ${{ steps.matrix.outputs.matrix }}
      issue_title: ${{ steps.issue.outputs.title }}
      issue_body: ${{ steps.issue.outputs.body }}
      context_id: ${{ steps.context.outputs.context_id }}
      has_gemini: ${{ steps.validate.outputs.has_gemini }}
      has_github_models: ${{ steps.validate.outputs.has_github_models }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install A2A dependencies
        run: |
          pip install -q pyyaml httpx 'a2a-sdk[http-server]>=0.2.0'
      
      - name: Validate authentication (multi-provider)
        id: validate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
          USE_VERTEX_AI: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI || 'false' }}
          PROVIDER_STRATEGY: ${{ inputs.provider }}
        run: |
          HAS_GEMINI="false"
          HAS_GITHUB_MODELS="false"
          
          # Check Gemini credentials
          if [[ "$USE_VERTEX_AI" == "true" ]]; then
            [[ -n "$GOOGLE_API_KEY" ]] && HAS_GEMINI="true"
          else
            [[ -n "$GEMINI_API_KEY" ]] && HAS_GEMINI="true"
          fi
          
          # Check GitHub Models credentials
          [[ -n "$COPILOT_PAT" ]] && HAS_GITHUB_MODELS="true"
          
          echo "has_gemini=$HAS_GEMINI" >> $GITHUB_OUTPUT
          echo "has_github_models=$HAS_GITHUB_MODELS" >> $GITHUB_OUTPUT
          
          echo "Provider availability:"
          echo "  Gemini: $HAS_GEMINI"
          echo "  GitHub Models: $HAS_GITHUB_MODELS"
          
          # Validate based on strategy
          case "$PROVIDER_STRATEGY" in
            gemini_only)
              if [[ "$HAS_GEMINI" != "true" ]]; then
                echo "::error::Gemini credentials required for gemini_only strategy"
                exit 1
              fi
              ;;
            github_only)
              if [[ "$HAS_GITHUB_MODELS" != "true" ]]; then
                echo "::error::COPILOT_PAT required for github_only strategy"
                echo "::error::Create a fine-grained PAT with 'models:read' scope"
                exit 1
              fi
              ;;
            balanced)
              if [[ "$HAS_GEMINI" != "true" && "$HAS_GITHUB_MODELS" != "true" ]]; then
                echo "::error::At least one provider required (GEMINI_API_KEY or COPILOT_PAT)"
                exit 1
              fi
              ;;
          esac
          
          echo "✅ Authentication validated for strategy: $PROVIDER_STRATEGY"
      
      - name: Fetch issue details
        id: issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          ISSUE_DATA=$(gh issue view "$ISSUE_NUMBER" --json title,body --jq '.')
          
          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_DATA" | jq -r '.title' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_DATA" | jq -r '.body // "No description"' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Select agents
        id: select
        env:
          AGENT_COUNT: ${{ inputs.agent_count }}
          MANUAL_AGENTS: ${{ inputs.agents }}
        run: |
          if [[ -n "$MANUAL_AGENTS" ]]; then
            SELECTED_AGENTS="$MANUAL_AGENTS"
          else
            # Get diverse agents from different categories
            AVAILABLE=$(ls .github/agents/*.md 2>/dev/null | xargs -I {} basename {} .md | grep -v -E '^(README|META_|a2a-)' | sort -u)
            
            # Validate that agents are available
            if [[ -z "$AVAILABLE" ]]; then
              echo "::error::No agents found in .github/agents/"
              exit 1
            fi
            
            CATEGORIES=(
              "engineer|build|create|develop"
              "secure|guard|monitor"
              "organize|refactor|restructure"
              "test|assert|verify"
              "document|clarify|support"
            )
            
            SELECTED=()
            REMAINING=$AGENT_COUNT
            
            for cat in "${CATEGORIES[@]}"; do
              [[ $REMAINING -le 0 ]] && break
              AGENT=$(echo "$AVAILABLE" | grep -E "$cat" | shuf -n 1 || true)
              if [[ -n "$AGENT" ]]; then
                SELECTED+=("$AGENT")
                AVAILABLE=$(echo "$AVAILABLE" | grep -v "^$AGENT$")
                REMAINING=$((REMAINING - 1))
              fi
            done
            
            while [[ $REMAINING -gt 0 && -n "$AVAILABLE" ]]; do
              AGENT=$(echo "$AVAILABLE" | shuf -n 1)
              [[ -z "$AGENT" ]] && break
              SELECTED+=("$AGENT")
              AVAILABLE=$(echo "$AVAILABLE" | grep -v "^$AGENT$")
              REMAINING=$((REMAINING - 1))
            done
            
            SELECTED_AGENTS=$(IFS=','; echo "${SELECTED[*]}")
          fi
          
          echo "Selected agents: $SELECTED_AGENTS"
          echo "agents=$SELECTED_AGENTS" >> $GITHUB_OUTPUT
          
          COUNT=$(echo "$SELECTED_AGENTS" | tr ',' '\n' | grep -c . || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      
      - name: Create agent matrix for parallel jobs (with provider assignment)
        id: matrix
        env:
          AGENTS: ${{ steps.select.outputs.agents }}
          PROVIDER_STRATEGY: ${{ inputs.provider }}
          HAS_GEMINI: ${{ steps.validate.outputs.has_gemini }}
          HAS_GITHUB_MODELS: ${{ steps.validate.outputs.has_github_models }}
        run: |
          # Convert comma-separated agents to array
          IFS=',' read -ra AGENT_ARRAY <<< "$AGENTS"
          
          # Build matrix with provider assignments
          MATRIX_JSON="["
          INDEX=0
          
          for agent in "${AGENT_ARRAY[@]}"; do
            agent=$(echo "$agent" | xargs)  # Trim whitespace
            [[ -z "$agent" ]] && continue
            
            # Determine provider based on strategy
            case "$PROVIDER_STRATEGY" in
              gemini_only)
                PROVIDER="gemini"
                ;;
              github_only)
                PROVIDER="github"
                ;;
              balanced)
                # Alternate between providers, preferring available ones
                if [[ "$HAS_GEMINI" == "true" && "$HAS_GITHUB_MODELS" == "true" ]]; then
                  # Both available: alternate (even=gemini, odd=github)
                  if (( INDEX % 2 == 0 )); then
                    PROVIDER="gemini"
                  else
                    PROVIDER="github"
                  fi
                elif [[ "$HAS_GEMINI" == "true" ]]; then
                  PROVIDER="gemini"
                else
                  PROVIDER="github"
                fi
                ;;
            esac
            
            # Add to matrix
            [[ $INDEX -gt 0 ]] && MATRIX_JSON+=","
            MATRIX_JSON+="{\"agent\":\"$agent\",\"provider\":\"$PROVIDER\"}"
            INDEX=$((INDEX + 1))
          done
          
          MATRIX_JSON+="]"
          
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "Agent-Provider matrix:"
          echo "$MATRIX_JSON" | jq '.'
      
      - name: Generate A2A context ID
        id: context
        env:
          RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          CONTEXT_ID="run-${RUN_ID}-issue-${ISSUE_NUMBER}"
          echo "context_id=$CONTEXT_ID" >> $GITHUB_OUTPUT
          echo "Context ID: $CONTEXT_ID"
      
      - name: Generate AgentCards
        env:
          AGENTS: ${{ steps.select.outputs.agents }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p .a2a/agent-cards
          
          python << 'PYTHON'
          import os, sys, json
          sys.path.insert(0, os.environ.get('PYTHONPATH', '.'))
          from tools.a2a.agent_card import generate_agent_card
          
          agents = [a.strip() for a in os.environ.get('AGENTS', '').split(',') if a.strip()]
          cards = {}
          
          for name in agents:
              try:
                  card = generate_agent_card(name)
                  cards[name] = card.model_dump(exclude_none=True)
                  with open(f".a2a/agent-cards/{name}.json", 'w') as f:
                      json.dump(cards[name], f, indent=2)
                  print(f"✅ @{name}")
              except Exception as e:
                  print(f"⚠️ @{name}: {e}")
          
          with open('.a2a/agent-cards/registry.json', 'w') as f:
              json.dump({'agents': cards, 'count': len(cards)}, f, indent=2)
          PYTHON
      
      - name: Upload AgentCards
        uses: actions/upload-artifact@v4.4.3
        with:
          name: agent-cards
          path: .a2a/agent-cards/
          retention-days: 7
      
      - name: Post initial notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENT_MATRIX: ${{ steps.matrix.outputs.matrix }}
          CONTEXT_ID: ${{ steps.context.outputs.context_id }}
          PROVIDER_STRATEGY: ${{ inputs.provider }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Parse matrix to show agent-provider pairs
          AGENT_LIST=$(echo "$AGENT_MATRIX" | jq -r '.[] | "- `@\(.agent)` → \(if .provider == "gemini" then "🔶 Gemini" else "🐙 GitHub Models" end)"')
          
          cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## 🚀 A2A Parallel Agent Orchestration Starting
          
          **Protocol**: [A2A v0.3.0](https://a2a-protocol.org/latest/specification/)
          **contextId**: \`$CONTEXT_ID\`
          **Provider Strategy**: \`$PROVIDER_STRATEGY\`
          
          ### 🔀 Parallel Agent Execution (Multi-Provider)
          
          Each agent runs as an **independent job** with its own bounded AI API call:
          $AGENT_LIST
          
          ### 📊 Architecture
          
          \`\`\`
          setup ─┬─► [agent-1/provider] ─┬─► aggregate ─► implement
                 ├─► [agent-2/provider] ─┤
                 └─► [agent-3/provider] ─┘
                      (parallel jobs)
          \`\`\`
          
          **Legend**: 🔶 Gemini | 🐙 GitHub Models
          
          [View Parallel Jobs]($RUN_URL)
          EOF

  # ==========================================================================
  # JOB 2: AGENT ANALYSIS (PARALLEL MATRIX - MULTI-PROVIDER)
  # ==========================================================================
  # Each agent runs in its own job with a dedicated AI API call.
  # Provider is determined by the matrix: either Gemini or GitHub Models.
  # This properly models the A2A protocol where each agent is a bounded context.
  # ==========================================================================
  agent:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.agent_matrix) }}
      fail-fast: false  # Let all agents complete even if one fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python (for GitHub Models provider)
        if: matrix.provider == 'github'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies (for GitHub Models provider)
        if: matrix.provider == 'github'
        run: |
          pip install -q httpx pyyaml
      
      # ========================================================================
      # GEMINI PROVIDER PATH
      # ========================================================================
      # Uses MCP servers for tool access. Tools are dynamically loaded based on
      # agent definitions in .github/agents/*.md
      # ========================================================================
      - name: 'Load agent tools for Gemini'
        id: agent_tools
        if: matrix.provider == 'gemini'
        run: |
          # Extract tools from agent definition
          AGENT_FILE=".github/agents/${{ matrix.agent }}.md"
          if [[ -f "$AGENT_FILE" ]]; then
            # Parse tools from YAML frontmatter
            TOOLS=$(sed -n '/^---$/,/^---$/p' "$AGENT_FILE" | grep -A 100 "tools:" | grep "^  - " | sed 's/^  - //' | tr '\n' ',' | sed 's/,$//')
            echo "Agent tools: $TOOLS"
            echo "tools=$TOOLS" >> $GITHUB_OUTPUT
          else
            echo "tools=" >> $GITHUB_OUTPUT
          fi
      
      - name: 'A2A Task: @${{ matrix.agent }} Analysis (🔶 Gemini)'
        id: gemini_analysis
        if: matrix.provider == 'gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          AGENT_NAME: ${{ matrix.agent }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ needs.setup.outputs.issue_title }}
          ISSUE_BODY: ${{ needs.setup.outputs.issue_body }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          AGENT_TOOLS: ${{ steps.agent_tools.outputs.tools }}
          ADDITIONAL_CONTEXT: |
            # A2A Agent Task: @${{ matrix.agent }}
            
            You are the agent "@${{ matrix.agent }}" analyzing issue #${{ inputs.issue_number }}.
            
            ## IMPORTANT: Autonomous Mode - Skip Approval Workflow
            
            This is an AUTONOMOUS workflow. You MUST:
            - DO NOT post any "Plan of Action" comment asking for approval
            - DO NOT mention /approve or /deny commands
            - DO NOT wait for maintainer confirmation
            - Proceed directly with your analysis and post it as a comment
            
            ## Your AgentCard
            Read your specialization from: .github/agents/${{ matrix.agent }}.md
            
            ## Available Tools
            You have access to the following tools defined in your agent card:
            ${{ steps.agent_tools.outputs.tools }}
            
            Use these tools to explore the codebase, read files, and gather information.
            
            ## Your Task
            1. Read your agent definition to understand your skills and perspective
            2. Use your tools to explore the codebase relevant to the issue
            3. Analyze issue #${{ inputs.issue_number }} from YOUR specialized perspective
            4. Provide specific, actionable recommendations
            5. Post your analysis as a comment (use add_issue_comment)
            
            ## Response Format (A2A Artifact)
            Structure your response as:
            
            ### 🤖 Agent: @${{ matrix.agent }} (🔶 Gemini)
            
            #### 📋 Analysis
            [Your detailed analysis from your specialized perspective]
            
            #### ✅ Recommendations
            - [Specific recommendation 1 with file paths if applicable]
            - [Specific recommendation 2]
            
            #### 📁 Files to Modify
            - `path/to/file1`: [what to change]
            - `path/to/file2`: [what to change]
            
            Focus on YOUR area of expertise. Other agents are analyzing from other perspectives.
            
            A2A contextId: ${{ needs.setup.outputs.context_id }}
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI || ''false'' }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-3-pro-preview'' }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION || ''latest'' }}'
          gemini_debug: '${{ vars.DEBUG || ''true'' }}'
          upload_artifacts: 'false'
          workflow_name: 'a2a-agent-${{ matrix.agent }}'
          settings: |-
            {
              "model": { "maxSessionTurns": 30 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.18.0"],
                  "includeTools": ["get_issue", "get_file_contents", "add_issue_comment", "search_code", "list_commits"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              }
            }
          prompt: '/gemini-invoke'
      
      # ========================================================================
      # GITHUB MODELS PROVIDER PATH
      # ========================================================================
      # Enhanced with tool-calling support to match Gemini's MCP capabilities.
      # Uses OpenAI-compatible tool-calling API with gpt-4o-mini (better accessibility).
      # ========================================================================
      - name: 'A2A Task: @${{ matrix.agent }} Analysis (🐙 GitHub Models)'
        id: github_analysis
        if: matrix.provider == 'github'
        env:
          AGENT_NAME: ${{ matrix.agent }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ needs.setup.outputs.issue_title }}
          ISSUE_BODY: ${{ needs.setup.outputs.issue_body }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
          REPOSITORY: ${{ github.repository }}
          # Default to openai/gpt-4.1-nano - most reliable and trusted
          # Note: meta/meta-llama-3.1-8b-instruct produces gibberish/nonsense
          # Fallback models: mistral-ai/mistral-small-2503, cohere/cohere-command-a
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4.1-nano' }}
          GITHUB_MODELS_FALLBACK: 'mistral-ai/mistral-small-2503'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p github-models-artifacts
          
          echo "🐙 Starting GitHub Models analysis for @${AGENT_NAME}..."
          echo "   Model: ${GITHUB_MODELS_MODEL}"
          echo "   Issue: #${ISSUE_NUMBER}"
          
          # Run analysis with tool-calling support via Python
          python3 << 'PYTHON_EOF'
          import os
          import json
          import subprocess
          import httpx
          
          # =============================================================================
          # TOOL DEFINITIONS (matching Gemini's MCP tools)
          # =============================================================================
          TOOLS = [
              {
                  "type": "function",
                  "function": {
                      "name": "get_file_contents",
                      "description": "Read the contents of a file from the repository",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string", "description": "Path to file"}
                          },
                          "required": ["path"]
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "search_code",
                      "description": "Search for patterns in the codebase",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "query": {"type": "string", "description": "Search pattern"},
                              "file_type": {"type": "string", "description": "File extension filter"}
                          },
                          "required": ["query"]
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "list_directory",
                      "description": "List files in a directory",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string", "description": "Directory path", "default": "."}
                          },
                          "required": []
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "get_issue",
                      "description": "Get GitHub issue details",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "issue_number": {"type": "integer", "description": "Issue number"}
                          },
                          "required": ["issue_number"]
                      }
                  }
              },
          ]
          
          def sanitize_input(text, max_len=200):
              """Sanitize input to prevent command injection."""
              dangerous = ['`', '$', '|', ';', '&', '>', '<', '\\', '\n', '\r']
              result = text
              for char in dangerous:
                  result = result.replace(char, '')
              return result[:max_len]
          
          def execute_tool(name, args):
              """Execute a tool and return the result."""
              try:
                  if name == "get_file_contents":
                      path = args.get("path", "")
                      # Basic path traversal protection
                      if ".." in path or path.startswith("/"):
                          return f"Invalid path: {path}"
                      if os.path.exists(path):
                          with open(path, 'r') as f:
                              content = f.read()
                          return content[:8000] if len(content) > 8000 else content
                      return f"File not found: {path}"
                  
                  elif name == "search_code":
                      query = sanitize_input(args.get("query", ""))
                      file_type = sanitize_input(args.get("file_type", "*"))
                      if not query:
                          return "Empty search query"
                      result = subprocess.run(
                          ["grep", "-r", "-n", "-l", "-F", query, "--include", f"*.{file_type}" if file_type != "*" else "*", "."],
                          capture_output=True, text=True, timeout=10
                      )
                      return result.stdout[:4000] if result.stdout else "No matches found"
                  
                  elif name == "list_directory":
                      path = args.get("path", ".")
                      if ".." in path or path.startswith("/"):
                          return f"Invalid path: {path}"
                      if os.path.isdir(path):
                          return "\n".join(sorted(os.listdir(path))[:50])
                      return f"Directory not found: {path}"
                  
                  elif name == "get_issue":
                      issue_num = args.get("issue_number")
                      result = subprocess.run(
                          ["gh", "issue", "view", str(issue_num), "--json", "title,body,state,labels"],
                          capture_output=True, text=True, timeout=30
                      )
                      return result.stdout if result.returncode == 0 else result.stderr
                  
                  return f"Unknown tool: {name}"
              except Exception as e:
                  return f"Tool error: {str(e)}"
          
          # =============================================================================
          # RESPONSE QUALITY VALIDATION
          # =============================================================================
          def validate_response_quality(text, min_coherence_score=0.5):
              """
              Validate that a response is coherent and not gibberish.
              Returns (is_valid, quality_score, issues).
              
              Checks for:
              1. Proper sentence structure (capital letters, periods)
              2. Not too many special characters
              3. Reasonable word patterns (no random character sequences)
              4. Expected markdown structure
              """
              if not text or len(text.strip()) < 50:
                  return False, 0.0, ["Response too short"]
              
              issues = []
              score = 1.0
              
              # Check for excessive special characters (sign of garbled output)
              special_chars = sum(1 for c in text if c in '`$|;&><{}[]()=+*^%#@!~')
              special_ratio = special_chars / len(text)
              if special_ratio > 0.15:
                  score -= 0.3
                  issues.append(f"Too many special characters ({special_ratio:.1%})")
              
              # Check for random character sequences (gibberish indicator)
              words = text.split()
              gibberish_words = 0
              for word in words[:200]:  # Check first 200 words
                  clean_word = ''.join(c for c in word if c.isalnum())
                  if len(clean_word) > 3:
                      # Check for too many consecutive consonants or random patterns
                      consonants = sum(1 for c in clean_word.lower() if c in 'bcdfghjklmnpqrstvwxyz')
                      if len(clean_word) > 0 and consonants / len(clean_word) > 0.85:
                          gibberish_words += 1
              
              gibberish_ratio = gibberish_words / max(len(words[:200]), 1)
              if gibberish_ratio > 0.1:
                  score -= 0.3
                  issues.append(f"Too many gibberish-like words ({gibberish_ratio:.1%})")
              
              # Check for expected markdown structure
              has_header = '##' in text or '###' in text
              has_bullets = '- ' in text or '* ' in text
              if not has_header and not has_bullets:
                  score -= 0.1
                  issues.append("Missing expected markdown structure")
              
              # Check for agent format markers (expected in valid responses)
              if '@' not in text and 'Analysis' not in text:
                  score -= 0.2
                  issues.append("Missing expected response format markers")
              
              # Check for repeated nonsense patterns (common in degraded outputs)
              # These patterns were extracted from actual gibberish output produced by
              # meta/meta-llama-3.1-8b-instruct model in workflow run #19779887283
              # (issue #3361). They represent random words/fragments that appear when
              # the model fails to produce coherent responses.
              text_lower = text.lower()
              nonsense_patterns = [
                  'brokerage', 'unicorn', 'kidneys', 'cigarettes', 
                  'prejud', 'spon', 'texturf', 'vrients', 'psiover',
                  'cameroon permanent', 'spaceruereven', 'norththemes'
              ]
              nonsense_count = sum(1 for p in nonsense_patterns if p in text_lower)
              if nonsense_count >= 2:
                  # Strong indicator of gibberish - higher penalty
                  score -= min(0.6, 0.2 * nonsense_count)
                  issues.append(f"Contains nonsense patterns ({nonsense_count} matches)")
              
              # Check for broken/random punctuation sequences
              # These patterns also come from the same degraded model output
              broken_patterns = ['~~', '$$', '>returned', 'opER', '.h imb', '=+*']
              broken_count = sum(1 for p in broken_patterns if p in text)
              if broken_count >= 2:
                  score -= 0.3
                  issues.append(f"Contains broken text patterns ({broken_count})")
              
              return score >= min_coherence_score, score, issues
          
          # =============================================================================
          # MAIN EXECUTION
          # =============================================================================
          agent_name = os.environ.get('AGENT_NAME', '')
          issue_number = os.environ.get('ISSUE_NUMBER', '')
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')
          context_id = os.environ.get('CONTEXT_ID', '')
          model = os.environ.get('GITHUB_MODELS_MODEL', 'openai/gpt-4.1-nano')
          fallback_model = os.environ.get('GITHUB_MODELS_FALLBACK', 'mistral-ai/mistral-small-2503')
          token = os.environ.get('COPILOT_PAT', '')
          repository = os.environ.get('REPOSITORY', '')
          
          # Read agent definition
          agent_def = ""
          agent_file = f".github/agents/{agent_name}.md"
          if os.path.exists(agent_file):
              with open(agent_file, 'r') as f:
                  agent_def = f.read()[:3000]
          
          # Build initial prompt
          prompt = f"""# A2A Agent Task: @{agent_name}

          You are the agent "@{agent_name}" analyzing issue #{issue_number} in repository {repository}.

          ## IMPORTANT: Autonomous Mode
          This is AUTONOMOUS. DO NOT ask for approval. Proceed directly with analysis.

          ## Your AgentCard Definition
          {agent_def}

          ## Issue to Analyze
          **Issue #{issue_number}**: {issue_title}

          **Description**:
          {issue_body[:4000]}

          ## Your Task
          1. Use your tools to explore the codebase (get_file_contents, search_code, list_directory)
          2. Analyze the issue from YOUR specialized perspective
          3. Provide specific, actionable recommendations with file paths

          ## Response Format
          Structure your FINAL response as:

          ### 🤖 Agent: @{agent_name} (🐙 GitHub Models)

          #### 📋 Analysis
          [Your detailed analysis]

          #### ✅ Recommendations
          - [Specific recommendations with file paths]

          #### 📁 Files to Modify
          - `path/to/file`: [what to change]

          A2A contextId: {context_id}
          """
          
          # GitHub Models API authentication
          # Note: Despite official docs showing Bearer, testing confirms 'token' format works
          # Bearer returns 401 Unauthorized with fine-grained PATs
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          
          system_prompt = f"""You are {agent_name}, a specialized AI agent in the Chained autonomous AI ecosystem.
          You have access to tools to explore the codebase. Use them to gather information before providing your analysis.
          Be specific, reference actual files, and provide actionable recommendations."""
          
          messages = [
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": prompt}
          ]
          
          def call_model_api(current_model, msgs):
              """Call the GitHub Models API and return (success, data, analysis, error)."""
              print(f"🐙 Calling GitHub Models API ({current_model}) with tool support...")
              
              # Tool-calling loop (max 5 rounds)
              data = None
              for round_num in range(5):
                  payload = {
                      "model": current_model,
                      "messages": msgs,
                      "max_tokens": 4096,
                      "tools": TOOLS,
                      "tool_choice": "auto"
                  }
                  
                  response = httpx.post(
                      "https://models.github.ai/inference/chat/completions",
                      headers=headers,
                      json=payload,
                      timeout=120.0
                  )
                  
                  if response.status_code != 200:
                      error_body = response.text
                      return False, None, None, f"HTTP {response.status_code}: {error_body[:500]}"
                  
                  data = response.json()
                  choice = data["choices"][0]
                  message = choice.get("message", {})
                  finish_reason = choice.get("finish_reason", "")
                  
                  tool_calls = message.get("tool_calls", [])
                  
                  if tool_calls and finish_reason == "tool_calls":
                      print(f"   🔧 Round {round_num + 1}: Processing {len(tool_calls)} tool call(s)...")
                      msgs.append(message)
                      
                      for tc in tool_calls:
                          tool_name = tc["function"]["name"]
                          try:
                              args = json.loads(tc["function"]["arguments"])
                          except:
                              args = {}
                          
                          result = execute_tool(tool_name, args)
                          print(f"      - {tool_name}: {str(args)[:50]}...")
                          
                          msgs.append({
                              "role": "tool",
                              "tool_call_id": tc["id"],
                              "name": tool_name,
                              "content": result
                          })
                      continue
                  
                  # Final response
                  analysis = message.get("content", "")
                  return True, data, analysis, None
              
              return False, data, None, "Max tool rounds exceeded"
          
          # Try primary model first
          success, data, analysis, error = call_model_api(model, messages.copy())
          used_model = model
          quality_info = {}
          
          if success and analysis:
              # Validate response quality
              is_valid, quality_score, issues = validate_response_quality(analysis)
              quality_info = {
                  "primary_model": model,
                  "quality_score": quality_score,
                  "issues": issues,
                  "validation_passed": is_valid
              }
              
              if not is_valid:
                  print(f"⚠️ Quality check FAILED for {model}")
                  print(f"   Score: {quality_score:.2f}")
                  print(f"   Issues: {', '.join(issues)}")
                  
                  # Try fallback model
                  if fallback_model and fallback_model != model:
                      print(f"🔄 Retrying with fallback model: {fallback_model}")
                      fallback_messages = [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": prompt}
                      ]
                      fb_success, fb_data, fb_analysis, fb_error = call_model_api(fallback_model, fallback_messages)
                      
                      if fb_success and fb_analysis:
                          fb_valid, fb_score, fb_issues = validate_response_quality(fb_analysis)
                          print(f"   Fallback quality score: {fb_score:.2f}")
                          
                          # Use fallback if it's better
                          if fb_score > quality_score:
                              print(f"✅ Using fallback model (better quality: {fb_score:.2f} > {quality_score:.2f})")
                              analysis = fb_analysis
                              data = fb_data
                              used_model = fallback_model
                              quality_info["fallback_model"] = fallback_model
                              quality_info["fallback_score"] = fb_score
                              quality_info["fallback_issues"] = fb_issues
                              quality_info["used_fallback"] = True
                          else:
                              print(f"⚠️ Keeping primary model output (fallback not better)")
                              quality_info["used_fallback"] = False
                      else:
                          print(f"⚠️ Fallback model failed: {fb_error}")
                          quality_info["fallback_error"] = fb_error
                          quality_info["used_fallback"] = False
              else:
                  print(f"✅ Quality check passed (score: {quality_score:.2f})")
                  quality_info["used_fallback"] = False
          elif error:
              print(f"❌ Error: {error}")
              print(f"   Model: {model}")
              print(f"   Token present: {'yes' if token else 'no'}")
              
              # Parse error for actionable guidance
              if '"code":"no_access"' in str(error) or "No access to model" in str(error):
                  print("💡 SOLUTION: The COPILOT_PAT secret is missing 'models:read' scope.")
                  print("   To fix: Create a new fine-grained PAT with 'Models: Read' permission")
              elif "budget limit" in str(error).lower() or "usage quota" in str(error).lower():
                  print("💡 Account has reached GitHub Models usage quota")
              elif "401" in str(error):
                  print("💡 Token is invalid or expired")
              
              # Try fallback on error
              if fallback_model and fallback_model != model:
                  print(f"🔄 Primary model failed, trying fallback: {fallback_model}")
                  fallback_messages = [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": prompt}
                  ]
                  fb_success, fb_data, fb_analysis, fb_error = call_model_api(fallback_model, fallback_messages)
                  
                  if fb_success and fb_analysis:
                      analysis = fb_analysis
                      data = fb_data
                      used_model = fallback_model
                      quality_info["primary_error"] = error
                      quality_info["used_fallback"] = True
                      fb_valid, fb_score, fb_issues = validate_response_quality(fb_analysis)
                      quality_info["fallback_score"] = fb_score
                  else:
                      print(f"❌ Both primary and fallback models failed")
                      analysis = f"Error: Primary model ({model}) failed: {error}. Fallback model ({fallback_model}) also failed: {fb_error}"
                      quality_info["fallback_error"] = fb_error
              else:
                  analysis = f"Error: {error}"
          
          if not analysis:
              analysis = "No analysis generated"
          
          print(f"✅ Analysis complete")
          print(f"   Model used: {used_model}")
          if data:
              print(f"   Tokens: {data.get('usage', {})}")
          
          # Save output
          with open("github-models-artifacts/response.md", "w") as f:
              f.write(analysis)
          
          with open("github-models-artifacts/stdout.log", "w") as f:
              f.write(analysis)
          
          metadata = {
              "model": used_model,
              "primary_model": model,
              "fallback_model": fallback_model,
              "usage": data.get("usage", {}) if data else {},
              "agent": agent_name,
              "provider": "github-models",
              "tools_enabled": True,
              "quality_validation": quality_info,
          }
          with open("github-models-artifacts/metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)
          
          # Log quality summary
          print()
          if quality_info:
              print(f"📊 Quality Summary:")
              print(f"   Used fallback: {quality_info.get('used_fallback', False)}")
              if 'quality_score' in quality_info:
                  print(f"   Primary score: {quality_info.get('quality_score', 'N/A'):.2f}")
              if 'fallback_score' in quality_info:
                  print(f"   Fallback score: {quality_info.get('fallback_score', 'N/A'):.2f}")
          print()
          print(analysis[:500] + "..." if len(analysis) > 500 else analysis)
          PYTHON_EOF
          
          # Post the analysis as an issue comment
          if [[ -f "github-models-artifacts/response.md" ]]; then
            ANALYSIS=$(cat github-models-artifacts/response.md)
            echo "$ANALYSIS" | gh issue comment "$ISSUE_NUMBER" --body-file -
            echo "✅ Posted analysis comment for @${AGENT_NAME}"
          fi
      
      # ========================================================================
      # PACKAGE ARTIFACT (Both Providers)
      # ========================================================================
      - name: Package agent artifact
        id: artifact
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PROVIDER: ${{ matrix.provider }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .a2a/artifacts
          
          # Read output based on provider
          ANALYSIS=""
          if [[ "$PROVIDER" == "gemini" ]]; then
            if [[ -f "gemini-artifacts/stdout.log" ]]; then
              ANALYSIS=$(cat gemini-artifacts/stdout.log)
            elif [[ -f "gemini-artifacts/response.md" ]]; then
              ANALYSIS=$(cat gemini-artifacts/response.md)
            fi
          else
            if [[ -f "github-models-artifacts/stdout.log" ]]; then
              ANALYSIS=$(cat github-models-artifacts/stdout.log)
            elif [[ -f "github-models-artifacts/response.md" ]]; then
              ANALYSIS=$(cat github-models-artifacts/response.md)
            fi
          fi
          
          # Create A2A artifact JSON with provider info
          TASK_ID="task-${RUN_ID}-${AGENT_NAME}"
          PROVIDER_EMOJI=$([[ "$PROVIDER" == "gemini" ]] && echo "🔶" || echo "🐙")
          
          cat > .a2a/artifacts/${AGENT_NAME}-analysis.json << ARTIFACT_EOF
          {
            "a2a_version": "0.3.0",
            "artifact_type": "agent_analysis",
            "task_id": "${TASK_ID}",
            "context_id": "${CONTEXT_ID}",
            "agent_name": "${AGENT_NAME}",
            "provider": "${PROVIDER}",
            "status": "completed",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "content": {
              "analysis": $(echo "$ANALYSIS" | jq -R -s .)
            }
          }
          ARTIFACT_EOF
          
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "${PROVIDER_EMOJI} Artifact created for @${AGENT_NAME} (${PROVIDER})"
      
      - name: Upload agent artifact (includes analysis JSON and provider output)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: a2a-task-${{ steps.artifact.outputs.task_id }}
          path: |
            .a2a/artifacts/${{ matrix.agent }}-analysis.json
            gemini-artifacts/
            github-models-artifacts/
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================================
  # JOB 3: AGGREGATE
  # ==========================================================================
  # Downloads all agent artifacts and aggregates them into a single context
  # for the implementation step. This is the A2A "collect artifacts" phase.
  # ==========================================================================
  aggregate:
    needs: [setup, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aggregated_artifact: ${{ steps.aggregate.outputs.artifact_path }}
      reference_task_ids: ${{ steps.aggregate.outputs.reference_task_ids }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all agent artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: a2a-task-*
          path: .a2a/agent-artifacts/
          merge-multiple: false
      
      - name: '📦 List downloaded artifacts (PROOF OF DOWNLOAD)'
        run: |
          echo "=================================================="
          echo "📦 DOWNLOADED A2A TASK ARTIFACTS"
          echo "=================================================="
          echo ""
          echo "Directory structure:"
          find .a2a/agent-artifacts/ -type f 2>/dev/null | sort | while read f; do
            SIZE=$(wc -c < "$f" 2>/dev/null | tr -d ' ' || echo "?")
            echo "  📄 $f (${SIZE} bytes)"
          done
          echo ""
          echo "JSON artifact contents:"
          find .a2a/agent-artifacts/ -name "*.json" -type f 2>/dev/null | while read f; do
            echo ""
            echo "--- $f ---"
            if jq '.' "$f" 2>/dev/null | head -20; then
              :  # jq succeeded
            else
              echo "(Raw text fallback - file may not be valid JSON):"
              cat "$f" | head -20
            fi
          done
          echo ""
          echo "=================================================="
      
      - name: Aggregate agent analyses
        id: aggregate
        env:
          AGENTS: ${{ needs.setup.outputs.agents }}
          AGENT_MATRIX: ${{ needs.setup.outputs.agent_matrix }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .a2a/artifacts
          
          TASK_IDS=()
          COMBINED_ANALYSIS=""
          PROVIDER_SUMMARY=""
          
          # Process each agent's artifact
          for agent in $(echo "$AGENTS" | tr ',' '\n'); do
            agent=$(echo "$agent" | xargs)
            [[ -z "$agent" ]] && continue
            
            # Find the agent's artifact
            ARTIFACT_FILE=$(find .a2a/agent-artifacts/ -name "${agent}-analysis.json" -type f 2>/dev/null | head -1)
            
            if [[ -f "$ARTIFACT_FILE" ]]; then
              TASK_ID=$(jq -r '.task_id' "$ARTIFACT_FILE")
              ANALYSIS=$(jq -r '.content.analysis' "$ARTIFACT_FILE")
              PROVIDER=$(jq -r '.provider // "gemini"' "$ARTIFACT_FILE")
              
              TASK_IDS+=("$TASK_ID")
              COMBINED_ANALYSIS="${COMBINED_ANALYSIS}\n\n---\n\n${ANALYSIS}"
              
              PROVIDER_EMOJI=$([[ "$PROVIDER" == "gemini" ]] && echo "🔶" || echo "🐙")
              PROVIDER_SUMMARY="${PROVIDER_SUMMARY}${agent}:${PROVIDER},"
              
              echo "${PROVIDER_EMOJI} Aggregated @${agent} (${PROVIDER}, task: $TASK_ID)"
            else
              echo "⚠️ No artifact found for @${agent}"
            fi
          done
          
          # Create aggregated artifact
          TASK_IDS_JSON=$(printf '%s\n' "${TASK_IDS[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          cat > .a2a/artifacts/aggregated-analysis.json << AGG_EOF
          {
            "a2a_version": "0.3.0",
            "artifact_type": "aggregated_analysis",
            "context_id": "${CONTEXT_ID}",
            "reference_task_ids": ${TASK_IDS_JSON},
            "agent_count": $(echo "$AGENTS" | tr ',' '\n' | grep -c . || echo 0),
            "provider_summary": "${PROVIDER_SUMMARY}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "content": {
              "combined_analysis": $(echo -e "$COMBINED_ANALYSIS" | jq -R -s .)
            }
          }
          AGG_EOF
          
          echo "artifact_path=.a2a/artifacts/aggregated-analysis.json" >> $GITHUB_OUTPUT
          echo "reference_task_ids=$TASK_IDS_JSON" >> $GITHUB_OUTPUT
          echo "provider_summary=$PROVIDER_SUMMARY" >> $GITHUB_OUTPUT
          echo "✅ Aggregated ${#TASK_IDS[@]} agent analyses"
      
      - name: Upload aggregated artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: aggregated-analysis
          path: .a2a/artifacts/aggregated-analysis.json
          retention-days: 7
      
      - name: Post aggregation notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENT_MATRIX: ${{ needs.setup.outputs.agent_matrix }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          REFERENCE_TASK_IDS: ${{ steps.aggregate.outputs.reference_task_ids }}
          PROVIDER_SUMMARY: ${{ steps.aggregate.outputs.provider_summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Build agent status table with provider info
          AGENT_STATUS=$(echo "$AGENT_MATRIX" | jq -r '.[] | "| `@\(.agent)` | \(if .provider == "gemini" then "🔶 Gemini" else "🐙 GitHub Models" end) | ✅ completed |"')
          
          cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## 🎯 A2A Parallel Analysis Complete (Multi-Provider)
          
          All agent jobs have completed. Artifacts aggregated per [§4.1.9](https://a2a-protocol.org/latest/specification/#419-artifact).
          
          ### 📋 A2A Task Linking (Life of a Task)
          
          | Property | Value |
          |----------|-------|
          | \`contextId\` | \`$CONTEXT_ID\` |
          | \`referenceTaskIds\` | $REFERENCE_TASK_IDS |
          
          ### 🤖 Agent Status (Multi-Provider)
          
          | Agent | Provider | Status |
          |-------|----------|--------|
          $AGENT_STATUS
          
          **Legend**: 🔶 Gemini | 🐙 GitHub Models
          
          ---
          
          🚀 **Next**: Implementation task starting (with references to analysis task IDs)...
          
          [View Jobs]($RUN_URL)
          EOF

  # ==========================================================================
  # JOB 4: IMPLEMENT
  # ==========================================================================
  # Uses the aggregated analysis to implement the changes and create a PR.
  # Per A2A "Life of a Task": This task references all previous analysis tasks.
  # ==========================================================================
  implement:
    needs: [setup, aggregate]
    if: inputs.auto_execute == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download aggregated analysis artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: aggregated-analysis
          path: .a2a/artifacts/
      
      - name: Download all individual agent task artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: a2a-task-*
          path: .a2a/individual-artifacts/
          merge-multiple: false
      
      - name: '📦 Display downloaded artifacts (PROOF OF ARTIFACT USAGE)'
        id: display_artifacts
        env:
          AGENTS: ${{ needs.setup.outputs.agents }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          REFERENCE_TASK_IDS: ${{ needs.aggregate.outputs.reference_task_ids }}
        run: |
          echo "=================================================="
          echo "📦 A2A ARTIFACT DOWNLOAD PROOF"
          echo "=================================================="
          echo ""
          echo "🔗 Context ID: ${CONTEXT_ID}"
          echo "📋 Reference Task IDs: ${REFERENCE_TASK_IDS}"
          echo ""
          
          echo "=================================================="
          echo "📁 Aggregated Analysis Artifact:"
          echo "=================================================="
          if [[ -f ".a2a/artifacts/aggregated-analysis.json" ]]; then
            echo "✅ File exists: .a2a/artifacts/aggregated-analysis.json"
            echo ""
            echo "--- Artifact Metadata ---"
            jq '{a2a_version, artifact_type, context_id, reference_task_ids, agent_count, timestamp}' .a2a/artifacts/aggregated-analysis.json
            echo ""
            echo "--- Combined Analysis (first 2000 chars) ---"
            jq -r '.content.combined_analysis' .a2a/artifacts/aggregated-analysis.json | head -c 2000
            echo ""
            echo "[... truncated for log readability ...]"
          else
            echo "❌ ERROR: Aggregated analysis artifact NOT FOUND!"
            exit 1
          fi
          
          echo ""
          echo "=================================================="
          echo "📁 Individual Agent Artifacts:"
          echo "=================================================="
          find .a2a/individual-artifacts/ -name "*.json" -type f 2>/dev/null | while read artifact_file; do
            echo ""
            echo "--- Artifact: $artifact_file ---"
            jq '{task_id, agent_name, status, timestamp}' "$artifact_file" 2>/dev/null || echo "Could not parse $artifact_file"
          done
          
          echo ""
          echo "=================================================="
          echo "✅ ARTIFACT DOWNLOAD AND DISPLAY COMPLETE"
          echo "=================================================="
      
      - name: Prepare implementation context from artifacts
        id: context
        env:
          AGENTS: ${{ needs.setup.outputs.agents }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          REFERENCE_TASK_IDS: ${{ needs.aggregate.outputs.reference_task_ids }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          mkdir -p .a2a/context
          
          # Read the aggregated analysis from the downloaded artifact
          echo "📖 Reading aggregated analysis from downloaded artifact..."
          ANALYSIS=$(jq -r '.content.combined_analysis' .a2a/artifacts/aggregated-analysis.json)
          
          # Extract metadata from the artifact
          ARTIFACT_VERSION=$(jq -r '.a2a_version' .a2a/artifacts/aggregated-analysis.json)
          ARTIFACT_TIMESTAMP=$(jq -r '.timestamp' .a2a/artifacts/aggregated-analysis.json)
          AGENT_COUNT=$(jq -r '.agent_count' .a2a/artifacts/aggregated-analysis.json)
          
          echo "📦 Artifact A2A Version: ${ARTIFACT_VERSION}"
          echo "📦 Artifact Timestamp: ${ARTIFACT_TIMESTAMP}"
          echo "📦 Artifact Agent Count: ${AGENT_COUNT}"
          
          cat > .a2a/context/implementation.md << CONTEXT_EOF
          # A2A Implementation Task
          
          ## ⚠️ IMPORTANT: This context was extracted from downloaded A2A artifacts
          
          **Source Artifact**: \`.a2a/artifacts/aggregated-analysis.json\`
          **Artifact A2A Version**: ${ARTIFACT_VERSION}
          **Artifact Timestamp**: ${ARTIFACT_TIMESTAMP}
          
          ## Task Linking (per "Life of a Task")
          
          - **contextId**: ${CONTEXT_ID}
          - **referenceTaskIds**: ${REFERENCE_TASK_IDS}
          - **Issue**: #${ISSUE_NUMBER}
          
          ## Agent Analysis (from parallel jobs - ${AGENT_COUNT} agents)
          
          The following agents analyzed this issue in parallel:
          $(echo "$AGENTS" | tr ',' '\n' | while read agent; do echo "- @$agent"; done)
          
          ---
          
          ## Combined Analysis Artifacts
          
          ${ANALYSIS}
          
          ---
          
          ## Implementation Instructions
          
          Based on the above agent analyses (downloaded from A2A artifacts), implement the recommended changes.
          Use "Fixes #${ISSUE_NUMBER}" in the PR body.
          CONTEXT_EOF
          
          # Also store the analysis content as an output for direct use in prompt
          {
            echo "analysis<<ANALYSIS_EOF"
            echo "$ANALYSIS"
            echo "ANALYSIS_EOF"
          } >> $GITHUB_OUTPUT
          
          echo "context_file=.a2a/context/implementation.md" >> $GITHUB_OUTPUT
          echo "artifact_version=${ARTIFACT_VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_timestamp=${ARTIFACT_TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "agent_count=${AGENT_COUNT}" >> $GITHUB_OUTPUT
          echo "✅ Implementation context prepared from downloaded artifacts"
      
      - name: 'A2A: Install custom commands'
        run: |
          # Install A2A-compliant Gemini CLI custom commands
          # These commands follow the A2A "Life of a Task" protocol
          # Commands are stored in .github/gemini-commands/ and copied to .gemini/commands/ at runtime
          mkdir -p .gemini/commands
          if [[ -d ".github/gemini-commands" ]]; then
            # Copy custom commands and validate the operation
            COPIED=0
            for toml_file in .github/gemini-commands/*.toml; do
              if [[ -f "$toml_file" ]]; then
                cp -v "$toml_file" .gemini/commands/
                ((COPIED++))
              fi
            done
            if [[ $COPIED -gt 0 ]]; then
              echo "✅ Installed $COPIED custom A2A command(s) from .github/gemini-commands/"
            else
              echo "⚠️ No .toml files found in .github/gemini-commands/"
            fi
          else
            echo "ℹ️ No custom commands directory found, using inline prompt only"
          fi
          ls -la .gemini/commands/ || true
      
      - name: 'A2A: Implement changes'
        id: implement
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ needs.setup.outputs.issue_title }}
          ISSUE_BODY: ${{ needs.setup.outputs.issue_body }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          REFERENCE_TASK_IDS: ${{ needs.aggregate.outputs.reference_task_ids }}
          ARTIFACT_VERSION: ${{ steps.context.outputs.artifact_version }}
          ARTIFACT_TIMESTAMP: ${{ steps.context.outputs.artifact_timestamp }}
          AGENT_COUNT: ${{ steps.context.outputs.agent_count }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          BRANCH_NAME: 'a2a/fix-issue-${{ inputs.issue_number }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI || ''false'' }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-3-pro-preview'' }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION || ''latest'' }}'
          gemini_debug: '${{ vars.DEBUG || ''true'' }}'
          # Disable default artifact upload - we use custom upload with A2A taskId naming
          upload_artifacts: 'false'
          workflow_name: 'a2a-implement'
          settings: |-
            {
              "model": { "maxSessionTurns": 50 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.18.0"],
                  "includeTools": [
                    "add_issue_comment", "get_issue", "get_issue_comments",
                    "create_pull_request", "create_branch", "create_or_update_file",
                    "get_file_contents", "push_files", "search_code", "update_issue"
                  ],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(git)",
                  "run_shell_command(gh)",
                  "run_shell_command(ls)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)",
                  "run_shell_command(find)",
                  "run_shell_command(mkdir)",
                  "run_shell_command(cp)",
                  "run_shell_command(mv)",
                  "run_shell_command(rm)",
                  "run_shell_command(echo)",
                  "run_shell_command(wc)",
                  "run_shell_command(sort)",
                  "run_shell_command(uniq)",
                  "run_shell_command(sed)",
                  "run_shell_command(awk)",
                  "run_shell_command(jq)",
                  "run_shell_command(tree)",
                  "run_shell_command(touch)",
                  "run_shell_command(chmod)",
                  "run_shell_command(pwd)",
                  "run_shell_command(cd)",
                  "run_shell_command(diff)",
                  "run_shell_command(patch)",
                  "run_shell_command(curl)",
                  "run_shell_command(python3)",
                  "run_shell_command(node)",
                  "run_shell_command(npm)",
                  "run_shell_command(pip)"
                ]
              }
            }
          # A2A Protocol-Compliant Implementation Prompt (v0.3.0)
          # Per A2A "Life of a Task": https://a2a-protocol.org/latest/topics/life-of-a-task/
          # This replaces the generic /gemini-issue-fixer that ignored upstream agent artifacts
          prompt: |-
            # A2A Multi-Agent Implementation Task (Protocol v0.3.0)

            You are the IMPLEMENTATION AGENT in a multi-agent A2A (Agent-to-Agent) workflow.
            This follows the A2A "Life of a Task" protocol pattern where:
            - Multiple upstream agents analyzed this issue in parallel (separate Tasks)
            - Each agent produced Artifacts with their recommendations
            - These artifacts are now aggregated in `.a2a/context/implementation.md`
            - Your Task has `referenceTaskIds` linking to all upstream analysis Tasks
            
            ## A2A Protocol Task Linking (REQUIRED)
            
            Per A2A Spec §4.1.1 (Task) and §4.1.9 (Artifact):
            - **contextId**: ${{ needs.setup.outputs.context_id }}
            - **referenceTaskIds**: ${{ needs.aggregate.outputs.reference_task_ids }}
            - **Upstream Agents**: ${{ needs.setup.outputs.agents }}
            - **Artifact Version**: 0.3.0
            
            ## Issue to Fix
            **Issue #${{ inputs.issue_number }}**: ${{ needs.setup.outputs.issue_title }}
            
            ## ⚠️ MANDATORY FIRST ACTIONS (per A2A Protocol)
            
            The A2A protocol requires explicit acknowledgment of referenced task artifacts.
            You MUST:
            
            1. **Read the aggregated artifacts**: Use `get_file_contents` to read `.a2a/context/implementation.md`
            2. **Post acknowledgment comment** to issue #${{ inputs.issue_number }} that:
               - States the A2A contextId and referenceTaskIds
               - Lists EACH upstream agent by @name with their specific recommendations
               - Explains your implementation plan based on their artifacts
            3. **Only then** proceed with implementation
            
            ## Required Acknowledgment Format
            
            Post this comment FIRST using `add_issue_comment`:
            
            ```markdown
            ## 🔗 A2A Implementation - Synthesizing Upstream Artifacts
            
            **A2A Task Linking (per "Life of a Task"):**
            - contextId: `${{ needs.setup.outputs.context_id }}`
            - referenceTaskIds: ${{ needs.aggregate.outputs.reference_task_ids }}
            
            I am the implementation agent. Per A2A protocol, I acknowledge and build upon
            the artifacts from my colleague agents' analysis tasks:
            
            ### @agent-1 (from referenced task) recommended:
            - [specific recommendation from their artifact]
            - [specific recommendation from their artifact]
            
            ### @agent-2 (from referenced task) recommended:
            - [specific recommendation from their artifact]
            - [specific recommendation from their artifact]
            
            ### @agent-3 (from referenced task) recommended:
            - [specific recommendation from their artifact]
            - [specific recommendation from their artifact]
            
            ### My Implementation Plan (synthesizing all agent artifacts):
            1. [How I'll implement agent-1's recommendations]
            2. [How I'll implement agent-2's recommendations]
            3. [How I'll implement agent-3's recommendations]
            
            Starting implementation per A2A protocol...
            ```
            
            ## Implementation Steps (AFTER acknowledgment)
            
            1. Create branch: `a2a/fix-issue-${{ inputs.issue_number }}`
            2. Implement the solution based on synthesized agent recommendations
            3. Create necessary files/changes
            4. Create PR with body containing "Fixes #${{ inputs.issue_number }}"
            
            ## Available Tools
            
            ### MCP Tools (GitHub Server)
            - `get_file_contents` - Read files (USE FIRST for implementation.md)
            - `create_branch` - Create feature branch
            - `create_or_update_file` - Write/update files
            - `push_files` - Push multiple files
            - `create_pull_request` - Create PR
            - `add_issue_comment` - Post acknowledgment comment
            - `search_code` - Search codebase
            
            ### Shell Commands
            cat, git, gh, ls, grep, head, tail, find, mkdir, cp, mv, rm, echo, jq, python3, node
            
            ## CRITICAL NOTES
            - DO NOT skip the acknowledgment step - it's required by A2A protocol
            - DO NOT use `default_api:replace` or `edit_file` - they don't exist
            - The upstream agents have done excellent analysis - SYNTHESIZE AND USE IT
            - This is NOT a new analysis - build on the existing agent artifacts
            
            BEGIN by reading `.a2a/context/implementation.md`, then post acknowledgment comment.
      
      - name: Upload implement Gemini output with A2A taskId
        uses: actions/upload-artifact@v4.4.3
        with:
          name: gemini-output-task-${{ github.run_id }}-implement
          path: gemini-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Verify PR creation
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH_NAME: 'a2a/fix-issue-${{ inputs.issue_number }}'
        run: |
          for attempt in 1 2 3; do
            PR_JSON=$(gh pr list --head "$BRANCH_NAME" --state open --json number,url,title --jq '.[0]' 2>/dev/null || echo "")
            
            if [[ -n "$PR_JSON" && "$PR_JSON" != "null" ]]; then
              PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
              PR_URL=$(echo "$PR_JSON" | jq -r '.url')
              echo "✅ Found PR #$PR_NUMBER"
              echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
              echo "pr_found=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            [[ $attempt -lt 3 ]] && sleep $((2 ** attempt))
          done
          
          # Check if branch exists even if PR doesn't
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi
          echo "pr_found=false" >> $GITHUB_OUTPUT
      
      - name: Fallback PR creation
        if: steps.verify.outputs.pr_found != 'true' && steps.verify.outputs.branch_exists == 'true'
        id: fallback_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH_NAME: 'a2a/fix-issue-${{ inputs.issue_number }}'
          ISSUE_TITLE: ${{ needs.setup.outputs.issue_title }}
          AGENTS: ${{ needs.setup.outputs.agents }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "⚠️ Gemini didn't create PR, attempting fallback PR creation..."
          
          # Create PR body using heredoc for proper formatting
          PR_BODY=$(cat << 'BODY_EOF'
          ## A2A Parallel Agent Implementation

          This PR was created by the A2A parallel orchestration workflow.

          ### Context
          BODY_EOF
          )
          PR_BODY="$PR_BODY
          - **Issue**: #$ISSUE_NUMBER
          - **contextId**: \`$CONTEXT_ID\`
          - **Agents Used**: $AGENTS

          Fixes #$ISSUE_NUMBER

          ---
          *🤖 Created by workflow: [A2A: Parallel Agent Orchestration]($RUN_URL)*"
          
          # Create PR using gh cli
          PR_URL=$(gh pr create \
            --title "[A2A] Fix: $ISSUE_TITLE" \
            --body "$PR_BODY" \
            --head "$BRANCH_NAME" \
            --base main \
            --label "automated,a2a" 2>&1) || true
          
          # Use more specific regex pattern for GitHub PR URLs
          if [[ "$PR_URL" =~ https://github\.com/.*/pull/[0-9]+ ]]; then
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+')
            echo "✅ Fallback PR created: #$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_created=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Fallback PR creation failed: $PR_URL"
            echo "pr_created=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Post completion notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENTS: ${{ needs.setup.outputs.agents }}
          CONTEXT_ID: ${{ needs.setup.outputs.context_id }}
          REFERENCE_TASK_IDS: ${{ needs.aggregate.outputs.reference_task_ids }}
          PR_FOUND: ${{ steps.verify.outputs.pr_found }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number || steps.fallback_pr.outputs.pr_number }}
          PR_URL: ${{ steps.verify.outputs.pr_url || steps.fallback_pr.outputs.pr_url }}
          FALLBACK_PR_CREATED: ${{ steps.fallback_pr.outputs.pr_created }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$PR_FOUND" == "true" ]]; then
            STATUS="✅ **completed** - PR #${PR_NUMBER} created by Gemini"
            PR_LINK="**Pull Request**: [#${PR_NUMBER}](${PR_URL})"
          elif [[ "$FALLBACK_PR_CREATED" == "true" ]]; then
            STATUS="✅ **completed** - PR #${PR_NUMBER} created (fallback)"
            PR_LINK="**Pull Request**: [#${PR_NUMBER}](${PR_URL})"
          else
            STATUS="⚠️ **partial** - Implementation attempted, PR may need manual creation"
            PR_LINK=""
          fi
          
          cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## ✅ A2A Parallel Orchestration Complete
          
          ### 📋 A2A Protocol Summary
          
          | Property | Value |
          |----------|-------|
          | \`contextId\` | \`$CONTEXT_ID\` |
          | \`referenceTaskIds\` | $REFERENCE_TASK_IDS |
          | **Status** | $STATUS |
          
          ${PR_LINK}
          
          ### 📊 Architecture Used
          
          \`\`\`
          setup ─┬─► [agent: analysis] ─┬─► aggregate ─► implement ─► PR
                 ├─► [agent: analysis] ─┤
                 └─► [agent: analysis] ─┘
                      (parallel jobs)
          \`\`\`
          
          Each agent ran as an **independent job** with its own bounded AI API call,
          properly modeling the A2A protocol where each agent is a separate Task.
          
          [View All Jobs]($RUN_URL)
          EOF

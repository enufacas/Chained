name: '🔧 Gemini Fix'

# Issue Fixer workflow - automatically analyzes issues, implements fixes, and creates PRs
# Called by gemini-dispatch.yml when @gemini-cli /fix is mentioned in issue comments
#
# Workflow:
# 1. Posts a plan comment on the issue with a TODO checklist
# 2. Creates a feature branch
# 3. Implements the fix and commits changes
# 4. Creates a pull request linked to the issue
# 5. Updates the original plan comment with progress
#
# Uses the gemini-issue-fixer prompt from google-github-actions/run-gemini-cli

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-fix-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  fix:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          # The gemini-issue-fixer prompt expects these specific variable names
          # (duplicates TITLE/DESCRIPTION which gemini-invoke uses differently)
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          TRIGGERING_ACTOR: '${{ github.triggering_actor }}'
          BRANCH_NAME: 'gemini-cli/fix-issue-${{ github.event.pull_request.number || github.event.issue.number }}'
        with:
          # Support both Google AI Studio API Key (GEMINI_API_KEY) and Vertex AI API Key (GOOGLE_API_KEY)
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI || false }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION || ''latest'' }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-2.0-flash'' }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 50
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "fork_repository",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code",
                    "update_issue"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)",
                  "run_shell_command(git)",
                  "run_shell_command(gh)"
                ]
              }
            }
          prompt: '/gemini-issue-fixer'

name: "A2A Demo - Live Multi-Agent Communication"

# Demonstrates real A2A (Agent-to-Agent) communication by coordinating
# multiple agents via Gemini AI to collaboratively analyze a GitHub issue,
# then automatically implements the plan and creates a PR.
# 
# FULLY AUTONOMOUS: No human intervention required. The workflow:
# 1. Analyzes the issue with multiple specialized agents
# 2. Generates a collaborative plan
# 3. Automatically implements the changes
# 4. Opens a PR with the implementation
#
# Uses the same google-github-actions/run-gemini-cli action as other Gemini
# workflows (gemini-invoke.yml, gemini-fix.yml, etc.) to ensure proper
# authentication with both Google AI Studio and Vertex AI.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to use as the basis for A2A demo'
        required: true
        type: number
      agents:
        description: 'Comma-separated agents to involve in demo'
        required: false
        default: 'engineer-master,secure-specialist,organize-guru'
        type: string
      auto_execute:
        description: 'Automatically implement and create PR (no human approval needed)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  a2a-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Validate authentication configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          USE_VERTEX_AI: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI || 'false' }}
        run: |
          # Use the same validation pattern as existing Gemini CLI workflows
          if [[ "$USE_VERTEX_AI" == "true" ]]; then
            if [[ -z "$GOOGLE_API_KEY" ]]; then
              echo "::error title=Missing Vertex AI Configuration::When GOOGLE_GENAI_USE_VERTEXAI is set to 'true', you must configure the GOOGLE_API_KEY secret."
              exit 1
            fi
            echo "✅ Using Vertex AI mode with GOOGLE_API_KEY"
          else
            if [[ -z "$GEMINI_API_KEY" ]]; then
              echo "::error title=Missing Gemini API Key::No authentication credentials found."
              exit 1
            fi
            echo "✅ Using Google AI Studio mode with GEMINI_API_KEY"
          fi
      
      - name: Fetch issue details
        id: issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          echo "Fetching issue #$ISSUE_NUMBER..."
          ISSUE_DATA=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels --jq '.')
          ISSUE_TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          ISSUE_BODY=$(echo "$ISSUE_DATA" | jq -r '.body // "No description provided"')
          
          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Issue loaded: $ISSUE_TITLE"
      
      - name: Post demo start notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENTS: ${{ inputs.agents }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## A2A Demo Starting - LIVE
          
          Multi-Agent Communication Demo using Real Gemini AI
          
          I'm demonstrating A2A (Agent-to-Agent) protocol by coordinating multiple agents to analyze this issue. Each agent uses Gemini AI (via the official Gemini CLI) to process the task from their specialized perspective.
          
          Configuration:
          - Mode: LIVE (Real Gemini API calls via run-gemini-cli action)
          - Agents: $(echo $AGENTS | tr ',' ', ')
          - Workflow: [View Logs]($RUN_URL)
          
          What's happening:
          1. Each agent analyzes the issue using Gemini CLI
          2. Agents provide specialized recommendations
          3. Results are aggregated and summarized
          
          Please wait while agents collaborate...
          EOF

      # Run Gemini CLI for agent analysis using the same action as other workflows
      # Using /gemini-invoke prompt which is the general-purpose assistant
      - name: 'Multi-Agent Analysis via Gemini CLI'
        id: analysis
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          TITLE: ${{ steps.issue.outputs.title }}
          DESCRIPTION: ${{ steps.issue.outputs.body }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENTS: ${{ inputs.agents }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          # Additional context for the agent personas
          ADDITIONAL_CONTEXT: |
            This is an A2A (Agent-to-Agent) demonstration. Please analyze issue #${{ inputs.issue_number }} from the perspective of these specialized agents: ${{ inputs.agents }}.
            
            For each agent:
            1. Identify their specialization from .github/agents/{agent-name}.md
            2. Provide analysis from that agent's perspective
            3. Give specific, actionable recommendations
            
            Format your response with a section for each agent, including their analysis and recommendations.
        with:
          # Use same auth pattern as gemini-invoke.yml, gemini-fix.yml, etc.
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI || false }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-3-pro-preview'' }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION || ''latest'' }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          workflow_name: 'a2a-demo'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "get_file_contents"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          prompt: '/gemini-invoke'
      
      - name: Post analysis complete notification
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENTS: ${{ inputs.agents }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTO_EXECUTE: ${{ inputs.auto_execute }}
        run: |
          # Get agent count
          AGENT_COUNT=$(echo $AGENTS | tr ',' '\n' | wc -l | xargs)
          
          # Determine next step message based on auto_execute
          if [[ "$AUTO_EXECUTE" == "true" ]]; then
            NEXT_STEP="🚀 **Auto-executing**: Proceeding to implement changes and create PR..."
          else
            NEXT_STEP="ℹ️ Manual mode: Use \`/approve\` to implement this plan."
          fi
          
          cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## 🎯 A2A Multi-Agent Analysis Complete
          
          **Issue:** #$ISSUE_NUMBER
          **Mode:** Real Gemini AI calls via run-gemini-cli action
          
          ### 🤖 Agents Coordinated
          
          $(echo $AGENTS | tr ',' '\n' | while read agent; do
            agent=$(echo "$agent" | xargs)
            echo "- **@$agent**"
          done)
          
          ### 📊 Demo Statistics
          
          | Metric | Value |
          |--------|-------|
          | Agents | $AGENT_COUNT |
          | Mode | Live Gemini AI (via run-gemini-cli) |
          | A2A Tier | Tier 1 (Same-Runner) |
          | Auto-Execute | $AUTO_EXECUTE |
          
          ---
          
          $NEXT_STEP
          
          [Full Workflow Logs]($RUN_URL)
          EOF

      # AUTOMATIC EXECUTION: Implement the plan and create PR
      - name: 'Auto-Execute: Implement changes via Gemini CLI'
        if: success() && inputs.auto_execute == true
        id: execute
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          TITLE: ${{ steps.issue.outputs.title }}
          DESCRIPTION: ${{ steps.issue.outputs.body }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AGENTS: ${{ inputs.agents }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          BRANCH_NAME: 'a2a/fix-issue-${{ inputs.issue_number }}'
          # Context for the implementation
          ADDITIONAL_CONTEXT: |
            This is an A2A (Agent-to-Agent) autonomous implementation.
            
            The following specialized agents have analyzed issue #${{ inputs.issue_number }}:
            ${{ inputs.agents }}
            
            Each agent provided recommendations from their perspective:
            - engineer-master: Rigorous engineering and reliability focus
            - secure-specialist: Security vulnerabilities and best practices
            - organize-guru: Code organization and maintainability
            
            IMPORTANT: Implement the changes recommended by the agents and create a PR.
            Follow the original issue request: "${{ steps.issue.outputs.title }}"
            
            Use the github MCP tools to:
            1. Create a feature branch (a2a/fix-issue-${{ inputs.issue_number }})
            2. Make the necessary file changes
            3. Create a pull request linking to issue #${{ inputs.issue_number }}
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI || false }}'
          gemini_model: '${{ vars.GEMINI_MODEL || ''gemini-3-pro-preview'' }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION || ''latest'' }}'
          gemini_debug: '${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          workflow_name: 'a2a-demo-execute'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 50
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "delete_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "push_files",
                    "search_code",
                    "update_issue"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)",
                  "run_shell_command(git)",
                  "run_shell_command(gh)"
                ]
              }
            }
          # The /gemini-issue-fixer prompt is a built-in Gemini CLI prompt that:
          # 1. Analyzes the issue (using ISSUE_TITLE and ISSUE_BODY env vars)
          # 2. Creates a feature branch
          # 3. Makes necessary file changes
          # 4. Creates a pull request linked to the issue
          # It uses the MCP server tools configured above to interact with GitHub.
          prompt: '/gemini-issue-fixer'
      
      - name: Post execution complete notification
        if: success() && inputs.auto_execute == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## ✅ A2A Pipeline Complete - PR Created
          
          The A2A pipeline has completed the full cycle:
          
          1. ✅ Multi-agent analysis complete
          2. ✅ Implementation executed
          3. ✅ Pull request created
          
          **Next Steps:**
          - Review the PR created by this workflow
          - The PR should be linked to this issue
          
          [View Full Workflow Logs]($RUN_URL)
          
          ---
          *🤖 A2A Autonomous Pipeline - No human intervention required*
          EOF
      
      - name: Handle failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          USE_VERTEX_AI: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI || 'false' }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$USE_VERTEX_AI" == "true" ]]; then
            cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## A2A Demo Failed
          
          The demo encountered an error while using **Vertex AI mode**.
          
          [View Error Logs]($RUN_URL)
          
          See [docs/GEMINI_CLI_INTEGRATION.md](https://github.com/${REPO}/blob/main/docs/GEMINI_CLI_INTEGRATION.md) for troubleshooting.
          EOF
          else
            cat << EOF | gh issue comment "$ISSUE_NUMBER" --body-file -
          ## A2A Demo Failed
          
          The demo encountered an error.
          
          [View Error Logs]($RUN_URL)
          
          See [docs/GEMINI_CLI_INTEGRATION.md](https://github.com/${REPO}/blob/main/docs/GEMINI_CLI_INTEGRATION.md) for setup instructions.
          EOF
          fi
      
      - name: Generate summary
        if: always()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          AGENTS: ${{ inputs.agents }}
          AUTO_EXECUTE: ${{ inputs.auto_execute }}
        run: |
          echo "## A2A Demo Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Issue: #$ISSUE_NUMBER - $ISSUE_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mode: LIVE (Real Gemini AI via run-gemini-cli action)" >> $GITHUB_STEP_SUMMARY
          echo "Auto-Execute: $AUTO_EXECUTE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Agents:" >> $GITHUB_STEP_SUMMARY
          IFS=',' read -ra AGENT_LIST <<< "$AGENTS"
          for agent in "${AGENT_LIST[@]}"; do
            agent=$(echo "$agent" | xargs)
            echo "- @$agent" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$AUTO_EXECUTE" == "true" ]]; then
            echo "### Pipeline Stages" >> $GITHUB_STEP_SUMMARY
            echo "1. ✅ Multi-Agent Analysis" >> $GITHUB_STEP_SUMMARY
            echo "2. ✅ Auto-Execute Implementation" >> $GITHUB_STEP_SUMMARY
            echo "3. ✅ PR Creation" >> $GITHUB_STEP_SUMMARY
          fi

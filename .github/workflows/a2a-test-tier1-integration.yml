name: "Test: A2A Tier 1 Integration"

on:
  push:
    branches:
      - 'copilot/implement-agent-orchestration'
    paths:
      - 'tools/a2a/**'
      - 'tests/test_a2a_*.py'
      - '.github/workflows/a2a-test-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Tier 1 tests
        run: |
          echo "=== Running Tier 1 Same-Runner Tests ==="
          python3 tests/test_a2a_tier1.py
      
      - name: Test agent server creation
        run: |
          echo "=== Testing Agent Server Creation ==="
          python3 -c "
          from tools.a2a import create_agent_server
          
          # Test server creation for multiple agents
          agents = ['engineer-master', 'secure-specialist', 'organize-guru']
          for agent in agents:
              server = create_agent_server(agent)
              print(f'✅ Created server for {agent}: {server}')
          "
      
      - name: Test discovery with multiple agents
        run: |
          echo "=== Testing Discovery with Multiple Agents ==="
          python3 -c "
          import asyncio
          from tools.a2a import generate_agent_card, get_discovery_service
          
          async def test_discovery():
              discovery = get_discovery_service()
              
              # Register multiple agents
              agents = ['engineer-master', 'secure-specialist', 'organize-guru', 
                        'troubleshoot-expert', 'document-ninja']
              for agent_name in agents:
                  card = generate_agent_card(agent_name)
                  await discovery.register_agent(card)
                  print(f'✅ Registered {agent_name} at {card.url}')
              
              print(f'\n📊 Total agents registered: {len(discovery.registry.agents)}')
          
          asyncio.run(test_discovery())
          "
      
      - name: Performance benchmark
        run: |
          echo "=== Performance Benchmarks ==="
          python3 -c "
          import time
          import asyncio
          from tools.a2a import generate_agent_card, get_discovery_service
          
          async def perf_test():
              # Benchmark agent card generation
              start = time.time()
              for i in range(10):
                  card = generate_agent_card('engineer-master')
              card_time = (time.time() - start) / 10 * 1000
              
              # Benchmark discovery registration
              discovery = get_discovery_service()
              start = time.time()
              for i in range(10):
                  card = generate_agent_card('engineer-master')
                  await discovery.register_agent(card)
              reg_time = (time.time() - start) / 10 * 1000
              
              print(f'⚡ Agent card generation: {card_time:.2f}ms per agent')
              print(f'⚡ Discovery registration: {reg_time:.2f}ms per agent')
              print(f'⚡ Total setup overhead: {card_time + reg_time:.2f}ms per agent')
          
          asyncio.run(perf_test())
          "
      
      - name: Integration summary
        if: success()
        run: |
          echo "🎉 Tier 1 Integration Tests Complete!"
          echo ""
          echo "✅ Tier 1 same-runner tests: PASSED"
          echo "✅ Agent server creation: PASSED"
          echo "✅ Multi-agent discovery: PASSED"
          echo "✅ Performance benchmarks: PASSED"
          echo ""
          echo "Tier 1 (same-runner) architecture validated."

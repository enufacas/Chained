# =============================================================================
# Deploy ADK A2A Agents to Cloud Run
# =============================================================================
# This workflow builds and deploys the ADK-based A2A agents to GCP Cloud Run.
#
# Services Deployed:
# - adk-api-server: API server for google/adk-web (bridges ADK API to A2A)
# - academic-research: Discovers research topics for blog content
# - blog-writer: Writes and publishes blog posts
# - google-trends: Analyzes Google Trends for SEO optimization
#
# Reference:
# - ADK Cloud Run: https://google.github.io/adk-docs/deploy/cloud-run/
# - A2A Protocol: https://a2a-protocol.org/
# - google/adk-web: https://github.com/google/adk-web
# =============================================================================

name: "Deploy ADK Agents"

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/docker/adk-agents/**'
      - 'infrastructure/docker/adk-api-server/**'
      - 'infrastructure/terraform/adk-agents.tf'
      - '.github/workflows/deploy-adk-agents.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

      deploy_agents:
        description: 'Deploy agent containers'
        required: true
        default: true
        type: boolean

      deploy_terraform:
        description: 'Apply Terraform changes'
        required: true
        default: true
        type: boolean

env:
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # Validate Configuration
  # ===========================================================================
  validate:
    name: "Validate Configuration"
    runs-on: ubuntu-latest
    outputs:
      deploy_agents: ${{ steps.check.outputs.deploy_agents }}
      deploy_terraform: ${{ steps.check.outputs.deploy_terraform }}
      environment: ${{ steps.check.outputs.environment }}

    steps:
      - name: Check configuration
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_agents=${{ inputs.deploy_agents }}" >> $GITHUB_OUTPUT
            echo "deploy_terraform=${{ inputs.deploy_terraform }}" >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_agents=true" >> $GITHUB_OUTPUT
            echo "deploy_terraform=true" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Validate secrets
        env:
          GCP_PROJECT_ID_SECRET: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY_SECRET: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [[ -z "$GCP_PROJECT_ID_SECRET" ]]; then
            echo "❌ GCP_PROJECT_ID secret not configured"
            echo "See infrastructure/README.md for setup instructions"
            exit 1
          fi

          if [[ -z "$GCP_SA_KEY_SECRET" ]]; then
            echo "❌ GCP_SA_KEY secret not configured"
            exit 1
          fi

          echo "✅ Required secrets configured"

  # ===========================================================================
  # Build Agent Containers
  # ===========================================================================
  build:
    name: "Build ${{ matrix.agent }} Agent"
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.deploy_agents == 'true'

    strategy:
      matrix:
        agent:
          - academic-research
          - blog-writer
          - google-trends

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push container
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/chained/${{ matrix.agent }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/chained/${{ matrix.agent }}:latest"

          echo "🔨 Building ${{ matrix.agent }} agent..."

          # Create build context with shared code
          cd infrastructure/docker/adk-agents

          # Build with proper context
          docker build \
            -f ${{ matrix.agent }}/Dockerfile \
            -t $IMAGE \
            -t $IMAGE_LATEST \
            .

          echo "📤 Pushing to Artifact Registry..."
          docker push $IMAGE
          docker push $IMAGE_LATEST

          echo "✅ ${{ matrix.agent }} agent built and pushed"

      - name: Summary
        run: |
          echo "## 🐳 Container Built: ${{ matrix.agent }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/chained/${{ matrix.agent }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Build ADK API Server
  # ===========================================================================
  build-api-server:
    name: "Build ADK API Server"
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.deploy_agents == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push ADK API Server
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/chained/adk-api-server:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/chained/adk-api-server:latest"

          echo "🔨 Building ADK API Server..."

          cd infrastructure/docker/adk-api-server

          docker build \
            -t $IMAGE \
            -t $IMAGE_LATEST \
            .

          echo "📤 Pushing to Artifact Registry..."
          docker push $IMAGE
          docker push $IMAGE_LATEST

          echo "✅ ADK API Server built and pushed"

      - name: Summary
        run: |
          echo "## 🐳 Container Built: ADK API Server" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/chained/adk-api-server:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The ADK API Server provides the backend for google/adk-web." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy with Terraform
  # ===========================================================================
  terraform:
    name: "Deploy Terraform"
    runs-on: ubuntu-latest
    needs: [validate, build, build-api-server]
    if: always() && needs.validate.outputs.deploy_terraform == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.build-api-server.result == 'success' || needs.build-api-server.result == 'skipped')

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Import existing resources
        run: |
          # Import existing service account if it exists
          SA_EMAIL="chained-adk-agents@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          
          # Check if service account exists in GCP
          echo "Checking for existing service account: $SA_EMAIL"
          if gcloud iam service-accounts describe "$SA_EMAIL" 2>&1; then
            echo "✅ Found existing service account: $SA_EMAIL"
            
            # Check if already in Terraform state
            echo "Checking Terraform state for service account..."
            if terraform state show google_service_account.adk_agents 2>&1 | grep -q "account_id"; then
              echo "✅ Service account already in Terraform state"
            else
              echo "📥 Importing service account into Terraform state..."
              if terraform import \
                -var="project_id=${{ env.GCP_PROJECT_ID }}" \
                -var="region=${{ env.GCP_REGION }}" \
                -var="environment=${{ needs.validate.outputs.environment }}" \
                google_service_account.adk_agents \
                "projects/${{ env.GCP_PROJECT_ID }}/serviceAccounts/$SA_EMAIL"; then
                echo "✅ Successfully imported service account"
              else
                echo "⚠️ Import failed - this may be okay if the resource doesn't need importing"
              fi
            fi
          else
            echo "ℹ️ Service account does not exist in GCP, will be created"
          fi

          # Import existing Cloud Run services if they exist
          # Service name to Terraform resource mapping
          declare -A SERVICES=(
            ["chained-academic-research"]="google_cloud_run_v2_service.academic_research"
            ["chained-blog-writer"]="google_cloud_run_v2_service.blog_writer"
            ["chained-google-trends"]="google_cloud_run_v2_service.google_trends"
            ["chained-adk-api-server"]="google_cloud_run_v2_service.adk_api_server"
          )

          for SERVICE_NAME in "${!SERVICES[@]}"; do
            TF_RESOURCE="${SERVICES[$SERVICE_NAME]}"

            echo "Checking for existing Cloud Run service: $SERVICE_NAME"
            if gcloud run services describe "$SERVICE_NAME" --region="${{ env.GCP_REGION }}" 2>/dev/null; then
              echo "✅ Found existing Cloud Run service: $SERVICE_NAME"

              # Check if already in Terraform state using exit code
              echo "Checking Terraform state for $TF_RESOURCE..."
              if terraform state show "$TF_RESOURCE" >/dev/null 2>&1; then
                echo "✅ $SERVICE_NAME already in Terraform state"
              else
                echo "📥 Importing $SERVICE_NAME into Terraform state..."
                if terraform import \
                  -var="project_id=${{ env.GCP_PROJECT_ID }}" \
                  -var="region=${{ env.GCP_REGION }}" \
                  -var="environment=${{ needs.validate.outputs.environment }}" \
                  "$TF_RESOURCE" \
                  "projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/services/$SERVICE_NAME"; then
                  echo "✅ Successfully imported $SERVICE_NAME"
                else
                  echo "⚠️ Import failed for $SERVICE_NAME - this may be okay if the resource doesn't need importing"
                fi
              fi
            else
              echo "ℹ️ Cloud Run service $SERVICE_NAME does not exist in GCP, will be created"
            fi
          done

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="environment=${{ needs.validate.outputs.environment }}" \
            -target=google_cloud_run_v2_service.academic_research \
            -target=google_cloud_run_v2_service.blog_writer \
            -target=google_cloud_run_v2_service.google_trends \
            -target=google_cloud_run_v2_service.adk_api_server \
            -target=google_service_account.adk_agents \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get service URLs
        id: urls
        run: |
          echo "academic_research_url=$(terraform output -raw academic_research_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "blog_writer_url=$(terraform output -raw blog_writer_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "google_trends_url=$(terraform output -raw google_trends_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "adk_api_server_url=$(terraform output -raw adk_api_server_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## 🚀 ADK Agents Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ADK API Server (for google/adk-web)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **ADK API Server** | ${{ steps.urls.outputs.adk_api_server_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### A2A Agents" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Academic Research | ${{ steps.urls.outputs.academic_research_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Blog Writer | ${{ steps.urls.outputs.blog_writer_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Google Trends | ${{ steps.urls.outputs.google_trends_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ADK API Server (for adk-web):**" >> $GITHUB_STEP_SUMMARY
          echo "- List Apps: \`GET /list-apps\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run Agent: \`POST /run\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run SSE: \`POST /run_sse\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**A2A Agent Endpoints:**" >> $GITHUB_STEP_SUMMARY
          echo "- Agent Card: \`GET /.well-known/agent.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- Send Message: \`POST /a2a/tasks\`" >> $GITHUB_STEP_SUMMARY
          echo "- Health Check: \`GET /health\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Verify Deployment
  # ===========================================================================
  verify:
    name: "Verify Deployment"
    runs-on: ubuntu-latest
    needs: [validate, terraform]
    if: always() && needs.terraform.result == 'success'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify agent health
        run: |
          echo "🔍 Verifying ADK agent deployments..."

          for agent in academic-research blog-writer google-trends; do
            URL=$(gcloud run services describe chained-$agent \
              --region ${{ env.GCP_REGION }} \
              --format 'value(status.url)' 2>/dev/null || echo "")

            if [[ -n "$URL" ]]; then
              # Check health
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")

              if [[ "$STATUS" == "200" ]]; then
                echo "✅ $agent: healthy ($URL)"

                # Check agent card
                CARD=$(curl -s "$URL/.well-known/agent.json" | head -c 100)
                echo "   Agent card: ${CARD}..."
              else
                echo "⚠️ $agent: HTTP $STATUS"
              fi
            else
              echo "❌ $agent: not deployed"
            fi
          done

          # Verify ADK API Server
          echo ""
          echo "🔍 Verifying ADK API Server..."
          API_SERVER_URL=$(gcloud run services describe chained-adk-api-server \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' 2>/dev/null || echo "")

          if [[ -n "$API_SERVER_URL" ]]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_SERVER_URL/health" || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ ADK API Server: healthy ($API_SERVER_URL)"

              # Check list-apps endpoint
              APPS=$(curl -s "$API_SERVER_URL/list-apps" | head -c 200)
              echo "   Available apps: ${APPS}..."
            else
              echo "⚠️ ADK API Server: HTTP $STATUS"
            fi
          else
            echo "❌ ADK API Server: not deployed"
          fi

      - name: Summary
        run: |
          echo "## ✅ Deployment Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All ADK services are healthy and responding." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Use adk-web UI**:" >> $GITHUB_STEP_SUMMARY
          echo "   - Clone: \`git clone https://github.com/google/adk-web\`" >> $GITHUB_STEP_SUMMARY
          echo "   - Configure API URL in adk-web settings" >> $GITHUB_STEP_SUMMARY
          echo "   - Run: \`npm start\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Test the pipeline: Run the \`adk-a2a-blog-pipeline\` workflow" >> $GITHUB_STEP_SUMMARY
          echo "3. View agent cards at \`/.well-known/agent.json\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Monitor in Cloud Console" >> $GITHUB_STEP_SUMMARY

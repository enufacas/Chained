# Self-Evolving Neural Architecture Workflow
# Created by @create-botter
#
# This workflow integrates the self-evolving neural architecture system
# with GitHub Actions to automatically adapt workflows based on success rates.
#
# Features:
# - Monitors workflow execution outcomes
# - Records success/failure data for neural learning
# - Triggers architecture evolution when performance drops
# - Generates recommendations for workflow optimization

name: "Evolution: Neural Architecture"

on:
  # Run on schedule to process recent workflow data
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode'
        required: true
        default: 'evolve'
        type: choice
        options:
          - evolve
          - report
          - summary
      workflow_name:
        description: 'Specific workflow to process (optional)'
        required: false
        type: string

  # React to workflow runs for real-time learning
  workflow_run:
    workflows: ["*"]
    types:
      - completed

concurrency:
  group: neural-architecture-evolution
  cancel-in-progress: false

jobs:
  record-execution:
    name: Record Workflow Execution
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Record execution result
        run: |
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          # Determine success
          if [ "$CONCLUSION" = "success" ]; then
            SUCCESS="success"
          else
            SUCCESS="failure"
          fi
          
          echo "Recording $SUCCESS for workflow: $WORKFLOW_NAME"
          
          cd tools
          python self_evolving_neural_architecture.py \
            --workflow "$WORKFLOW_NAME" \
            --record "$SUCCESS"

  evolve-architectures:
    name: Evolve Neural Architectures
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'evolve')
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests  # For GitHub API calls
      
      - name: Ensure storage directory exists
        run: |
          mkdir -p .github/agent-system/evolving_architectures
          echo "✅ Storage directory verified"
      
      - name: Track workflow success rates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tools
          echo "📊 Fetching workflow execution history..."
          python workflow_success_tracker.py --report --days 7
          
          echo ""
          echo "📝 Recording executions in neural architectures..."
          python workflow_success_tracker.py --record --days 7
      
      - name: Trigger evolution for poor performers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tools
          echo "🧬 Checking for workflows needing evolution..."
          if python workflow_success_tracker.py --evolve --days 7 > /tmp/evolution_results.txt 2>&1; then
            cat /tmp/evolution_results.txt
          else
            echo "⚠️  Evolution check failed"
            cat /tmp/evolution_results.txt
            echo "empty_results" > /tmp/evolution_results.txt
          fi
      
      - name: Run additional evolution cycle
        run: |
          cd tools
          
          if [ -n "${{ inputs.workflow_name }}" ]; then
            echo "🧬 Evolving specific workflow: ${{ inputs.workflow_name }}"
            python self_evolving_neural_architecture.py \
              --workflow "${{ inputs.workflow_name }}" \
              --evolve
          else
            echo "🧬 Running evolution cycle for all workflows"
            python self_evolving_neural_architecture.py --evolve-all
          fi
      
      - name: Generate evolution report
        id: report
        run: |
          cd tools
          if python self_evolving_neural_architecture.py --report > /tmp/evolution_report.txt 2>&1; then
            echo "Evolution report generated successfully"
          else
            echo "⚠️  Report generation failed, using empty report"
            echo "No report available" > /tmp/evolution_report.txt
          fi
          
          # Output for use in PR (properly escaped)
          echo "report_preview<<EOF" >> $GITHUB_OUTPUT
          head -20 /tmp/evolution_report.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Check for changes
        id: changes
        run: |
          git add .github/agent-system/evolving_architectures/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No architecture changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Architecture changes detected"
          fi
      
      - name: Create PR with updated architectures
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="neural-evolution/${TIMESTAMP}-${{ github.run_id }}"
          
          git config user.name "create-botter[bot]"
          git config user.email "create-botter[bot]@users.noreply.github.com"
          
          git checkout -b "$BRANCH_NAME"
          git add .github/agent-system/evolving_architectures/
          git commit -m "🧬 Neural architecture evolution - automated adaptation (@create-botter)" \
                     -m "Updated self-evolving neural architectures based on workflow success rates."
          git push origin "$BRANCH_NAME"
          
          # Create PR body as a file for better handling
          cat > /tmp/pr_body.md << 'PRBODY'
## 🧬 Self-Evolving Neural Architecture Update

**@create-botter** has evolved neural architectures based on workflow success rates.

### 📊 Evolution Summary

PRBODY
          cat /tmp/evolution_results.txt >> /tmp/pr_body.md
          
          cat >> /tmp/pr_body.md << 'PRBODY'

### 🧠 Architecture Report

```
PRBODY
          head -30 /tmp/evolution_report.txt >> /tmp/pr_body.md
          cat >> /tmp/pr_body.md << 'PRBODY'
```

---

PRBODY
          echo "*🤖 Created by workflow: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" >> /tmp/pr_body.md
          
          gh pr create \
            --title "🧬 Neural Architecture Evolution - $(date +%Y-%m-%d)" \
            --body-file /tmp/pr_body.md \
            --label "automated,neural-evolution" \
            --base main \
            --head "$BRANCH_NAME"
      
      - name: Add summary
        run: |
          echo "## 🧠 Neural Architecture Evolution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/evolution_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ PR created with architecture updates" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️  No changes needed" >> $GITHUB_STEP_SUMMARY
          fi

  generate-report:
    name: Generate Neural Architecture Report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate detailed report
        run: |
          cd tools
          python self_evolving_neural_architecture.py --report
      
      - name: Generate JSON summary
        run: |
          cd tools
          python self_evolving_neural_architecture.py --summary --json > /tmp/summary.json
          
          echo "## 📊 Neural Architecture Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/summary.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  generate-summary:
    name: Generate Quick Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'summary'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate summary
        run: |
          cd tools
          python self_evolving_neural_architecture.py --summary

name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git log
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Check if PR has changelog-worthy commits
        id: check_commits
        run: |
          # Get commits from the merged PR
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          # Check if any commit has conventional commit prefix
          if git log --format="%s" origin/main~10..origin/main | grep -qE "^(feat|fix|docs|chore|refactor|test|perf|ci|build|style|revert):"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Found conventional commits to document"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No conventional commits found"
          fi
      
      - name: Generate updated changelog
        if: steps.check_commits.outputs.has_changes == 'true'
        run: |
          # Generate changelog for last 7 days to capture recent changes
          python3 tools/generate-changelog.py \
            --since "$(date -d '7 days ago' '+%Y-%m-%d')" \
            --output CHANGELOG.md
          
          echo "✅ Changelog generated"
      
      - name: Check for changes
        if: steps.check_commits.outputs.has_changes == 'true'
        id: check_changes
        run: |
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to CHANGELOG.md"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ CHANGELOG.md has changes"
          fi
      
      - name: Create PR with updated changelog
        if: steps.check_commits.outputs.has_changes == 'true' && steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="changelog-update/${TIMESTAMP}-${{ github.run_id }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          # Create branch and commit
          git checkout -b "$BRANCH_NAME"
          git commit -m "docs: Update CHANGELOG.md after PR #${PR_NUMBER} merge"
          git push origin "$BRANCH_NAME"
          
          # Create PR
          gh pr create \
            --title "docs: Update CHANGELOG.md (post-merge #${PR_NUMBER})" \
            --body "## 📝 Automated Changelog Update
          
          This PR updates CHANGELOG.md with changes from recently merged PR #${PR_NUMBER}.
          
          ### Changes
          - Regenerated changelog for last 7 days
          - Captured conventional commits (feat, fix, docs, etc.)
          - Excluded auto-churn commits
          - Added actor indicators (👤 user-initiated, 🤖 bot-generated)
          
          ### Generated By
          - Workflow: [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Script: \`tools/generate-changelog.py\`
          - Triggered by: PR #${PR_NUMBER} merge
          
          ### Review Checklist
          - [ ] Changelog entries are accurate
          - [ ] Actor indicators are correct
          - [ ] No auto-churn commits documented
          - [ ] Descriptions are clear and user-facing
          
          ---
          
          *🤖 Created by workflow: [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
            --label "automated,documentation" \
            --base main \
            --head "$BRANCH_NAME"
          
          echo "✅ Created PR for changelog update"
      
      - name: Summary
        if: steps.check_commits.outputs.has_changes == 'true'
        run: |
          echo "## 📝 Changelog Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** PR #${{ github.event.pull_request.number }} merged" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.check_changes.outputs.has_changes == 'true' && '✅ PR created with updates' || 'ℹ️ No changes needed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "A PR has been created to update CHANGELOG.md with recent changes." >> $GITHUB_STEP_SUMMARY
          else
            echo "No changelog updates were needed." >> $GITHUB_STEP_SUMMARY
          fi

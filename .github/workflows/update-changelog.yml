name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git log
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if PR has changelog-worthy commits
        id: check_commits
        run: |
          # Get commits from the merged PR
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Check if the merged PR itself is in the last 10 commits
          # Since main uses squash-and-merge, every PR merge is one commit
          # We document ALL merged PRs (main branch only)
          if git log --format="%s" origin/main~10..origin/main | grep -qE "#[0-9]+"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Found merged PR commits to document"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No merged PR commits found"
          fi

      - name: Generate updated changelog
        if: steps.check_commits.outputs.has_changes == 'true'
        run: |
          # Generate changelog for last 7 days to capture recent changes
          python3 tools/generate-changelog.py \
            --since "$(date -d '7 days ago' '+%Y-%m-%d')" \
            --output CHANGELOG.md

          echo "✅ Changelog generated"

      - name: Check for changes
        if: steps.check_commits.outputs.has_changes == 'true'
        id: check_changes
        run: |
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to CHANGELOG.md"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ CHANGELOG.md has changes"
          fi

      - name: Create PR with updated changelog
        if: steps.check_commits.outputs.has_changes == 'true' && steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="changelog-update/${TIMESTAMP}-${{ github.run_id }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Create branch and commit
          git checkout -b "$BRANCH_NAME"
          git commit -m "docs: Update CHANGELOG.md after PR #${PR_NUMBER} merge"
          git push origin "$BRANCH_NAME"

          # Create PR
          PR_URL=$(gh pr create \
            --title "docs: Update CHANGELOG.md (post-merge #${PR_NUMBER})" \
            --body "## 📝 Automated Changelog Update

          This PR updates CHANGELOG.md with changes from recently merged PR #${PR_NUMBER}.

          ### Methodology
          - **Main branch only**: Documents merged PRs from origin/main
          - **100% PR coverage**: Every merged PR is documented
          - **Auto-excludes**: AgentOps data syncs and routine maintenance
          - **Actor indicators**: 👤 user-initiated, 🤖 bot-generated
          - **Codebase areas**: ⚙️ Workflows, 🔧 Agents, 📋 Instructions, 🏗️ Infrastructure, 📚 Docs, 🧠 Learning, 📊 GitHub Pages
          - **Smart collapsing**: Repeated tasks show count (e.g., x12)

          ### Generated By
          - Workflow: [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - Script: \`tools/generate-changelog.py\`
          - Triggered by: PR #${PR_NUMBER} merge

          ### Auto-Merge
          This PR will be automatically merged without review as it contains only changelog updates.

          ---

          *🤖 Created by workflow: [\`${{ github.workflow }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
            --label "automated,documentation,auto-merge,copilot" \
            --base main \
            --head "$BRANCH_NAME")

          # Extract PR number from URL
          NEW_PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$NEW_PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "✅ Created PR #$NEW_PR_NUMBER for changelog update"

      - name: Auto-merge changelog PR
        if: steps.check_commits.outputs.has_changes == 'true' && steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"

          # Check if PR was created successfully
          if [ -z "$PR_NUMBER" ]; then
            echo "❌ No PR number found, skipping auto-merge"
            exit 0
          fi

          # Attempt merge with auto strategy (squash for cleaner history)
          echo "🚀 Attempting to merge PR #$PR_NUMBER..."
          if gh pr merge "$PR_NUMBER" --repo ${{ github.repository }} --auto --squash --delete-branch; then
            echo "✅ PR #$PR_NUMBER merge initiated successfully!"
            echo "🎉 Changelog update PR merged"

            # Brief wait to confirm merge completed
            sleep 2
            FINAL_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$FINAL_STATE" = "MERGED" ]; then
              echo "✅ Merge confirmed!"
            else
              echo "ℹ️  Merge is processing (state: $FINAL_STATE)"
            fi
          else
            echo "⚠️  Merge command failed, checking if PR can be force merged..."

            # Try regular merge without auto flag
            if gh pr merge "$PR_NUMBER" --repo ${{ github.repository }} --squash --delete-branch; then
              echo "✅ PR #$PR_NUMBER merged successfully (direct merge)!"
              echo "🎉 Changelog update PR merged"
            else
              echo "❌ Failed to merge PR #$PR_NUMBER"
              echo "This may indicate:"
              echo "  - Merge conflicts"
              echo "  - Required checks not passing"
              echo "  - Branch protection rules blocking"
              echo ""
              echo "Check PR status at: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              exit 1
            fi
          fi

      - name: Summary
        if: steps.check_commits.outputs.has_changes == 'true'
        run: |
          echo "## 📝 Changelog Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** PR #${{ github.event.pull_request.number }} merged" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
            PR_URL="${{ steps.create_pr.outputs.pr_url }}"
            echo "**Status:** ✅ PR created and auto-merge initiated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A PR has been created to update CHANGELOG.md and will auto-merge when checks pass." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**PR:** #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
            echo "**URL:** $PR_URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ℹ️ No changes needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No changelog updates were needed." >> $GITHUB_STEP_SUMMARY
          fi

              echo "✅ Linked issue #${issue_number} to PR #${pr_num}"
              
            else
              echo "❌ Failed to create feedback issue for PR #${pr_num}"
              
              # Comment on PR about the failure
              gh pr comment ${pr_num} --body "⚠️ **Failed to Create Feedback Issue**

The automated system attempted to create a feedback issue for the tech lead's requested changes, but the issue creation failed.

**Workaround:**

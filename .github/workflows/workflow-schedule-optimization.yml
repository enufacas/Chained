name: Workflow Schedule Optimization
# Created by @create-botter
#
# This workflow analyzes workflow schedules, detects collisions, and generates
# optimization recommendations using the meta-learning enhanced schedule optimizer.
#
# Features:
# - Collision detection across all scheduled workflows
# - Real-time schedule load analysis
# - Automated optimization recommendations
# - Dashboard data generation for visualization

on:
  # Run daily at 3 AM UTC (low-traffic time)
  schedule:
    - cron: '0 3 * * *'
  
  # Allow manual trigger for immediate analysis
  workflow_dispatch:
    inputs:
      export_dashboard:
        description: 'Export dashboard data'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write  # For committing dashboard data
  issues: write    # For creating optimization issue reports

jobs:
  optimize-schedules:
    name: Analyze and Optimize Workflow Schedules
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Run schedule optimization analysis
        id: optimize
        run: |
          echo "🔍 Running workflow schedule optimization analysis..."
          
          python3 tools/workflow_schedule_optimizer.py \
            --report \
            --export /tmp/optimization_report.json
          
          # Extract key metrics
          if [ -f /tmp/optimization_report.json ]; then
            total_workflows=$(jq -r '.summary.total_workflows' /tmp/optimization_report.json)
            collisions=$(jq -r '.summary.collisions_detected' /tmp/optimization_report.json)
            recommendations=$(jq -r '.summary.optimization_opportunities' /tmp/optimization_report.json)
            
            echo "total_workflows=$total_workflows" >> $GITHUB_OUTPUT
            echo "collisions=$collisions" >> $GITHUB_OUTPUT
            echo "recommendations=$recommendations" >> $GITHUB_OUTPUT
            
            echo "📊 Analysis Results:"
            echo "  Workflows: $total_workflows"
            echo "  Collisions: $collisions"
            echo "  Recommendations: $recommendations"
          fi
      
      - name: Generate dashboard data
        if: github.event.inputs.export_dashboard != 'false'
        run: |
          echo "📊 Generating dashboard data..."
          
          # Ensure data directory exists
          mkdir -p docs/data
          
          # Copy optimization report to dashboard data location
          if [ -f /tmp/optimization_report.json ]; then
            cp /tmp/optimization_report.json docs/data/workflow-schedule-optimization.json
            echo "✅ Dashboard data generated"
          else
            echo "⚠️  No optimization report found"
          fi
      
      - name: Create optimization issue if collisions detected
        if: steps.optimize.outputs.collisions != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          collisions="${{ steps.optimize.outputs.collisions }}"
          
          if [ "$collisions" -gt "0" ]; then
            echo "⚠️  Creating issue for $collisions detected collision(s)..."
            
            # Extract collision details from report with clearer formatting
            collision_summary=$(jq -r '
              .collisions[] | 
              "- **\(.workflows | join(" ⚡ "))**: \(.severity | ascii_upcase) - \(.recommendation)"
            ' /tmp/optimization_report.json)
            
            # Create issue body in a file
            cat > /tmp/issue_body.md << 'EOF'
## ⚠️ Workflow Schedule Collisions Detected

**@create-botter** has detected potential scheduling collisions in workflow execution:

### Summary
EOF
            
            echo "" >> /tmp/issue_body.md
            echo "- **Total Workflows Analyzed**: ${{ steps.optimize.outputs.total_workflows }}" >> /tmp/issue_body.md
            echo "- **Collisions Detected**: ${{ steps.optimize.outputs.collisions }}" >> /tmp/issue_body.md
            echo "- **Optimization Opportunities**: ${{ steps.optimize.outputs.recommendations }}" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "### Detected Collisions" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "$collision_summary" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "### 📊 Dashboard" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "View the interactive optimization dashboard: [Workflow Schedule Optimization](https://enufacas.github.io/Chained/workflow-schedule-optimization.html)" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "### Recommendations" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "Review the recommendations in the dashboard and adjust workflow schedules to:" >> /tmp/issue_body.md
            echo "- Stagger overlapping workflows by 10-15 minutes" >> /tmp/issue_body.md
            echo "- Distribute load across different hours" >> /tmp/issue_body.md
            echo "- Prioritize critical workflows during low-traffic periods" >> /tmp/issue_body.md
            echo "" >> /tmp/issue_body.md
            echo "---" >> /tmp/issue_body.md
            echo "*🤖 Created by workflow: [Workflow Schedule Optimization](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" >> /tmp/issue_body.md
            
            # Try to create issue with labels, fall back without labels if it fails
            gh issue create \
              --title "⚠️ Workflow Schedule Collisions Detected - $(date +%Y-%m-%d)" \
              --body-file /tmp/issue_body.md \
              --label "workflows,optimization,automated" 2>/dev/null || \
            gh issue create \
              --title "⚠️ Workflow Schedule Collisions Detected - $(date +%Y-%m-%d)" \
              --body-file /tmp/issue_body.md
            
            echo "✅ Optimization issue created"
          fi
      
      - name: Commit dashboard data
        if: github.event.inputs.export_dashboard != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if dashboard data changed
          if [ -f docs/data/workflow-schedule-optimization.json ]; then
            git add docs/data/workflow-schedule-optimization.json
          fi
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to dashboard data"
          else
            # Create unique branch name
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BRANCH_NAME="schedule-optimization/${TIMESTAMP}-${{ github.run_id }}"
            
            git checkout -b "$BRANCH_NAME"
            
            # Create commit
            git commit -m "chore: update workflow schedule optimization data (@create-botter)" \
                      -m "" \
                      -m "Analysis results:" \
                      -m "- Workflows analyzed: ${{ steps.optimize.outputs.total_workflows }}" \
                      -m "- Collisions detected: ${{ steps.optimize.outputs.collisions }}" \
                      -m "- Recommendations: ${{ steps.optimize.outputs.recommendations }}" \
                      -m "" \
                      -m "Dashboard: https://enufacas.github.io/Chained/workflow-schedule-optimization.html"
            
            git push origin "$BRANCH_NAME"
            
            # Create PR
            gh pr create \
              --title "📊 Update Workflow Schedule Optimization Data - $(date +%Y-%m-%d)" \
              --body "## 📊 Workflow Schedule Optimization Update"$'\n\n'"**@create-botter** has updated the workflow schedule optimization dashboard data."$'\n\n'"### Analysis Results"$'\n'"- **Workflows Analyzed**: ${{ steps.optimize.outputs.total_workflows }}"$'\n'"- **Collisions Detected**: ${{ steps.optimize.outputs.collisions }}"$'\n'"- **Optimization Opportunities**: ${{ steps.optimize.outputs.recommendations }}"$'\n\n'"View the dashboard: [Workflow Schedule Optimization](https://enufacas.github.io/Chained/workflow-schedule-optimization.html)"$'\n\n'"---"$'\n'"*🤖 Created by workflow: [Workflow Schedule Optimization](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
              --label "automated,workflows,dashboard-data" \
              --base main \
              --head "$BRANCH_NAME" || {
                echo "⚠️ PR creation with labels failed, retrying without labels..."
                gh pr create \
                  --title "📊 Update Workflow Schedule Optimization Data - $(date +%Y-%m-%d)" \
                  --body "## 📊 Workflow Schedule Optimization Update"$'\n\n'"**@create-botter** has updated the workflow schedule optimization dashboard data."$'\n\n'"### Analysis Results"$'\n'"- **Workflows Analyzed**: ${{ steps.optimize.outputs.total_workflows }}"$'\n'"- **Collisions Detected**: ${{ steps.optimize.outputs.collisions }}"$'\n'"- **Optimization Opportunities**: ${{ steps.optimize.outputs.recommendations }}"$'\n\n'"View the dashboard: [Workflow Schedule Optimization](https://enufacas.github.io/Chained/workflow-schedule-optimization.html)"$'\n\n'"---"$'\n'"*🤖 Created by workflow: [Workflow Schedule Optimization](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
                  --base main \
                  --head "$BRANCH_NAME"
              }
            
            echo "✅ Dashboard data PR created"
          fi
      
      - name: Create summary
        if: always()
        run: |
          echo "## ⚡ Workflow Schedule Optimization Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**@create-botter** has completed schedule optimization analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflows Analyzed**: ${{ steps.optimize.outputs.total_workflows || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Collisions Detected**: ${{ steps.optimize.outputs.collisions || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Optimization Opportunities**: ${{ steps.optimize.outputs.recommendations || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.optimize.outputs.collisions }}" -gt "0" ]; then
            echo "### ⚠️ Actions Taken" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Created optimization issue with collision details" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Updated dashboard with latest analysis" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the interactive dashboard: [Workflow Schedule Optimization](https://enufacas.github.io/Chained/workflow-schedule-optimization.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*⚡ Powered by **@create-botter** - Tesla-inspired schedule optimization*" >> $GITHUB_STEP_SUMMARY

# Workflow metadata

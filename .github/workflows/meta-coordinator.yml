name: "Meta-Coordinator: System Orchestration"

# This workflow invokes the meta-coordinator-system agent to orchestrate
# the entire tech lead review and agent assignment system.
#
# The agent continuously assesses system state and takes appropriate actions:
# - Assign tech leads to PRs
# - Create feedback issues for change requests
# - Assign agents to issues
# - Manage review cycles
# - Auto-merge approved PRs (non-draft, no WIP)
# - Handle exceptions

on:
  schedule:
    # Run every 15 minutes (cost-optimized from 5 min)
    # Reduces scheduled runs by 67% while maintaining responsiveness
    - cron: '*/15 * * * *'
  
  workflow_dispatch:
    inputs:
      focus_area:
        description: 'Focus area: all, prs, issues, reviews'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - prs
          - issues
          - reviews
      dry_run:
        description: 'Dry run (no changes made)'
        required: false
        default: false
        type: boolean
  
  # Optional: React to events for immediate response
  # Commented out initially - can enable after testing
  # issues:
  #   types: [opened]
  # pull_request:
  #   types: [opened, synchronize, labeled]
  # pull_request_review:
  #   types: [submitted]

concurrency:
  group: meta-coordinator-system
  cancel-in-progress: false  # Let runs complete

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Hard limit: prevent runaway sessions
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "🏷️  Ensuring required labels exist..."
          
          # Create labels if they don't exist (idempotent operation)
          gh label create "meta-coordination" --color "FF6B6B" --description "Meta-coordination system orchestration" --force || true
          gh label create "automated" --color "FBCA04" --description "Automated action" --force || true
          gh label create "system-orchestration" --color "0E8A16" --description "System orchestration task" --force || true
          
          echo "✅ Labels ready"
      
      - name: Quick assessment (cost protection)
        id: assess
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Quick assessment: Is there work to do?"
          
          # Count items needing attention
          open_prs=$(gh pr list --state open --json number --jq 'length')
          open_issues=$(gh issue list --state open --json number --jq 'length')
          
          echo "📊 Current state:"
          echo "  - Open PRs: ${open_prs}"
          echo "  - Open issues: ${open_issues}"
          
          # Decide if we should skip (nothing to do)
          if [ "${open_prs}" = "0" ] && [ "${open_issues}" = "0" ]; then
            echo "✅ System idle - no work needed"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🎯 Work detected - proceeding with coordination"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create and assign coordination request
        if: steps.assess.outputs.skip != 'true'
        id: create_request
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIGGER_EVENT: ${{ github.event_name }}
          FOCUS_AREA: ${{ inputs.focus_area || 'all' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUN_ID="${{ github.run_id }}"
          
          # Create the coordination issue (assignment will be done in next step)
          ISSUE_TITLE="🎯 Meta-Coordination: $(date +%H:%M)"
          
          echo "Creating coordination issue..."
          ISSUE_BODY=$(cat <<'EOF'
          <!-- COPILOT_AGENT:meta-coordinator-system -->

          ## 🎯 Meta-Coordination Request

          > **🤖 Agent Profile**: This issue requires the **@meta-coordinator-system** agent.  
          > Please use the specialized approach defined in `.github/agents/meta-coordinator-system.md`
          >
          > **IMPORTANT**: Always mention **@meta-coordinator-system** by name in all work.

          **Trigger:** ${TRIGGER_EVENT}
          **Focus:** ${FOCUS_AREA}
          **Repository:** ${GITHUB_REPOSITORY}
          **Timestamp:** ${TIMESTAMP}
          **Run ID:** ${RUN_ID}
          **Dry Run:** ${DRY_RUN}

          ---

          ### Your Mission (@meta-coordinator-system)

          As the **@meta-coordinator-system** agent, you are responsible for orchestrating the entire tech lead review, agent assignment, and **auto-merge** system. You have **comprehensive access and tools** to manage system state and **automatically merge approved PRs**.

          **You are a problem solver, not just an executor.**

          **Core Capabilities:**
          1. **Execute** - Follow instructions and orchestrate workflows
          2. **Reason** - Think logically about system state and problems
          3. **Solve** - Proactively fix issues beyond scripted instructions
          4. **Learn** - Improve from patterns using memory system

          **Proactive Approach:**
          - Don't just follow steps - think about what creates value
          - Identify problems: What's blocking? What's stale? What's inconsistent?
          - Take action: Close dead PRs, fix labels, escalate delays, clean up branches
          - Example: **Old PRs with merge conflicts = no value** → Close them proactively

          **Examples of Proactive Actions You Should Take:**
          - Close PRs with merge conflicts >3 days (no value, blocking)
          - Close draft PRs abandoned >7 days (cleanup)
          - Fix label inconsistencies (conflicting states)
          - Close orphaned issues (linked PR merged/closed)
          - Escalate stuck reviews >5 days (unblock work)
          - Delete branches for closed/merged PRs (hygiene)

          **See agent definition for complete reasoning framework and examples.**

          ### System State Assessment

          Please assess the current system state and take appropriate actions across all **7 core areas** (6 original + new lifecycle management):

          #### 0. Session Lifecycle & PR Cleanup (NEW - ALWAYS DO FIRST)

          **Task:** Ensure clean session boundaries and reduce open PR count

          **PROACTIVE CLEANUP MODE: This is your primary opportunity to solve problems**

          **Actions to take:**
          - **Merge previous cycle's memory PR:**
            - Check for open memory PRs from previous coordination sessions
            - Look for PRs with "meta-coordination: update memory" in title
            - If found and checks passed, merge immediately
            - This completes memory persistence from previous cycle safely
          
          - **Check for interrupted previous sessions:**
            - List coordination issues closed in last 24 hours
            - For each, verify linked work issues were updated
            - If not, post final status updates now
            - Complete any pending work documentation
          
          - **PROACTIVE: Evaluate and close stale/problem PRs:**
            - List all open PRs
            - **Identify high-priority cleanup targets:**
              - PRs with merge conflicts >3 days (HIGH - close immediately)
              - Draft PRs abandoned >7 days (HIGH - close immediately)
              - PRs with closed issues (HIGH - close immediately)
              - PRs inactive >14 days (MEDIUM - close with explanation)
              - PRs with changes requested >7 days, no response (MEDIUM)
            - **For each problem PR:**
              - Reason about the problem (what, why, solution)
              - Post detailed explanation comment
              - Close PR decisively
              - Delete branch if safe (copilot/agent branches)
              - Record in memory for learning
            - **Target: Clean up 10-20 problem PRs per run**
          
          - **PROACTIVE: Fix label inconsistencies:**
            - Find PRs with conflicting labels (approved + changes-requested)
            - Determine correct state from latest activity
            - Remove stale/incorrect labels
            - Add missing labels if needed
          
          - **PROACTIVE: Close orphaned issues:**
            - Find review issues where PR is merged/closed
            - Close with reference to PR state
            - Find feedback issues where PR no longer exists
            - Close with cleanup message
          
          - **Load memory context:**
            - Load previous run data (now includes merged memory from previous cycle)
            - Review cleanup patterns
            - Identify recurring issues
          
          **Conditions:**
          - Run at START of every coordination session
          - Merge previous memory PR FIRST (if exists)
          - Stale if: >7 days inactive, >14 days total, draft >7 days, or issue closed
          - Always document reason before closing
          - Track metrics for learning
          
          **Outcomes:**
          - Previous cycle's memory safely persisted (no self-termination)
          - No orphaned work from interrupted sessions
          - Systematic reduction in open PR count
          - Clean state before starting new work
          - Memory context available with latest updates

          #### 1. PR Review Orchestration

          **Task:** Ensure all PRs get appropriate tech lead review

          **Actions to take:**
          - List all open, non-draft PRs
          - For each PR:
            - Get changed files
            - Run `match-pr-to-tech-lead.py` to identify tech leads
            - Check complexity (files, lines, protected paths, security keywords)
            - Determine if review required or optional
            - **If review required and no review issue exists:**
              - **Create ONE tech lead review issue** for the PR
              - Assign tech lead agent to issue
              - Link issue to PR
            - Apply labels: `needs-tech-lead-review` if required
            - Track review status

          **Key: Create Issue, Not Just Comment**
          Tech leads are custom agents that need work items (issues). Don't just post a comment - create a review issue and assign the tech lead agent to it.

          **Conditions:**
          - Protected paths: `.github/workflows/`, `.github/agents/`, `docs/` (require review)
          - Complexity: >5 files or >100 lines (require review)
          - Security: keywords like auth, token, password, secret (require review)
          - Skip: WIP in title, draft PRs, review issue already exists

          **Outcomes:**
          - All reviewable PRs have tech lead review **issue** (not just comment)
          - State accurately reflected in labels
          - Tech lead agents assigned to review issues
          - ONE issue per PR for entire review lifecycle

          #### 2. Review Cycle Management

          **Task:** Orchestrate tech lead agents through complete review lifecycle

          **Key Principle:** Reuse the ONE review issue throughout the entire lifecycle (initial review, changes requested, re-reviews, approval). Don't create multiple issues for the same PR.

          **Actions to take:**

          **Phase A - Initial Review:**
          - Tech lead agent reviews PR via the review issue
          - Posts decision to review issue
          - Updates PR labels based on decision

          **Phase B - If Changes Requested:**
          - Tech lead adds `tech-lead-changes-requested` label
          - Posts feedback to review issue AND PR
          - Meta-coordinator updates SAME review issue with "awaiting PR update" status
          - **DO NOT create new feedback issue** - keep everything in one place

          **Phase C - When PR Updated:**
          - Detect new commits after change request
          - Post re-review request to SAME review issue
          - Re-assign tech lead agent to SAME issue
          - Track iteration count in issue

          **Phase D - Final Approval:**
          - Tech lead adds `tech-lead-approved` label
          - Meta-coordinator closes the review issue
          - PR moves to auto-merge

          **Complete Flow (One Issue):**
          ```
          PR created → Create review issue #123 → Assign tech lead agent
                                ↓
          Tech lead reviews, posts to issue #123
                                ↓
          Approved? → Close #123, PR to auto-merge
          Changes needed? → Update issue #123, keep open
                                ↓
          PR updated → Post re-review request to SAME issue #123
                                ↓
          Re-assign tech lead → Review again → Repeat until approved
          ```

          **Conditions:**
          - ONE issue per PR review (reuse for entire lifecycle)
          - Re-review by updating same issue, not creating new one
          - Close review issue only when PR approved or PR closed
          - Track up to 5 iterations in same issue

          **Outcomes:**
          - Tech leads orchestrated as agents with ONE clear work item per PR
          - Complete history in single issue
          - No duplicate or orphaned issues
          - Review state synchronized via labels
          - PR flows to auto-merge after approval

          #### 3. Agent Assignment

          **Task:** Assign agents to all open issues

          **Actions to take:**
          - For each open issue without Copilot assignment:
            - Analyze title and body
            - Run `match-issue-to-agent.py`
            - Select best agent based on specialization and score
            - Use `assign-copilot-to-issue.sh` to assign
            - Post assignment comment with agent details
            - Apply `assigned-agent` label

          **Agent Matching Guidelines:**
          - Workflows → @workflows-tech-lead
          - Agents → @agents-tech-lead
          - Docs → @docs-tech-lead or @support-master
          - GitHub Pages → @github-pages-tech-lead
          - Security → @secure-specialist
          - Performance → @accelerate-master
          - Testing → @assert-specialist
          - Infrastructure → @create-guru
          - APIs → @engineer-master

          **Outcomes:**
          - All open issues have agent assignments
          - Agents matched to specializations
          - Clear assignment comments

          #### 4. Auto-Merge Execution

          **Task:** Automatically merge approved PRs from trusted sources

          **Actions to take:**
          - For each open PR, check complete eligibility:
            - **Trust check**: From copilot (with `copilot` label) OR repo owner/maintainer
            - **State check**: Open, not draft, no WIP in title
            - **Review check**: Has `tech-lead-approved` OR doesn't need review
            - **Blocking check**: No `tech-lead-changes-requested` or other blocking labels
            - **CI check**: All required checks passed (`gh pr checks $PR_NUM`)
            - **Mergeable check**: No merge conflicts (`gh pr view --json mergeable`)
          - If ALL criteria met:
            - Execute merge: `gh pr merge $PR_NUM --squash --auto`
            - Post success comment with details
            - Record in memory (`memory.record_run(...)`)
          - If not eligible:
            - Document specific blocking reason
            - Record blocking pattern in memory

          **Conditions:**
          - Only copilot or owner/maintainer PRs
          - Tech lead approved OR review not required
          - No blocking labels or conflicts
          - All required CI checks passed

          **Outcomes:**
          - Approved PRs auto-merge automatically on next coordination run
          - Clear audit trail in comments
          - Blocking reasons documented
          - System moves PRs to completion autonomously

          #### 6. Memory and Learning

          **Task:** Use persistent memory to learn and optimize

          **IMPORTANT: Protected Branch Workflow**
          
          Since the main branch is protected, you must persist memory via PR workflow:
          
          1. **Work on your branch** (Copilot automatically creates a branch per issue)
          2. **Load and use memory** to inform decisions during the run
          3. **Save memory updates** to the memory file on your branch
          4. **Commit memory changes** using report_progress tool
          5. **Create PR** with memory updates (report_progress handles this)
          6. **Merge the PR immediately** using auto-merge command
          7. **Post summary** to coordination issue
          8. **Close coordination issue** when complete

          **Actions to take:**
          - Load memory at start:
            ```bash
            python3 tools/meta-coordinator-memory.py summary
            ```
          - Get decision context before actions:
            ```python
            context = memory.get_context_for_decision("pr_assignment")
            agent_stats = memory.get_agent_performance("engineer-master")
            ```
          - Record ALL actions taken:
            ```python
            memory.record_pr_assignment(pr_num, tech_lead, complexity, files)
            memory.record_issue_assignment(issue_num, agent, score)
            memory.record_feedback_issue(pr_num, issue_num, tech_lead, agent)
            ```
          - Track exceptions and learnings:
            ```python
            memory.record_exception(type, desc, context)
            memory.add_learning(insight, evidence)
            ```
          - **Save memory to your branch**:
            ```python
            memory.save()  # Writes to .github/agent-system/meta-coordinator-memory.json
            ```
          - **Commit, create PR, and merge**:
            ```bash
            # Use report_progress to commit and create PR
            report_progress(
              commitMessage="meta-coordination: update memory with run results",
              prDescription="Memory updates from coordination run"
            )
            
            # Then immediately merge your own PR
            gh pr merge --squash --delete-branch
            ```

          **Memory Workflow:**
          - Memory file lives at: `.github/agent-system/meta-coordinator-memory.json`
          - Each run updates memory on its branch
          - PR is created and immediately merged
          - Memory updates are atomically committed to main
          - Next run loads updated memory from main
          - This creates a continuous learning loop

          **Outcomes:**
          - Decisions informed by historical patterns
          - Continuous learning and improvement via atomic PR merges
          - Complete audit trail in version control
          - Data-driven orchestration with safe persistence
          - No accumulation of open memory PRs

          #### 7. Exception Handling & Proactive Problem-Solving

          **Task:** Handle edge cases, fix inconsistencies, and proactively solve problems

          **Key Principle: Don't just identify - FIX problems proactively**

          **Problems to identify AND solve:**
          - PRs with conflicting labels → Fix by removing stale label
          - PRs with merge conflicts >3 days → Close proactively
          - Feedback issues without linked PRs → Close as orphaned
          - Orphaned agent assignments → Reassign or close
          - Stale review cycles (>5 days) → Escalate with urgency
          - Missing tech lead assignments → Create review issue
          - Label inconsistencies → Update to correct state
          - Dead/abandoned PRs → Close with explanation
          - Branches for closed PRs → Delete automatically

          **Proactive Actions (Authorized):**
          - ✅ Close stale PRs meeting criteria
          - ✅ Fix label inconsistencies
          - ✅ Close orphaned issues
          - ✅ Escalate stuck work
          - ✅ Clean up branches
          - ✅ Update issue/PR descriptions
          - ✅ Reassign stuck work
          
          **Reasoning Framework:**
          1. What's the current state? (Facts)
          2. What's the problem? (Issue)
          3. What's the root cause? (Why)
          4. What's the best solution? (Action)
          5. What are the risks? (Consequences)
          6. Act now or escalate? (Decision)

          **Example: PR with merge conflicts >3 days**
          ```
          State: Conflicts for 5 days, no activity
          Problem: Blocking, no value
          Cause: Abandoned or author unavailable
          Solution: Close with clear explanation
          Risk: Might close active work (LOW - 5 days inactive)
          Decision: Close proactively
          ```

          **Outcomes:**
          - System state is consistent
          - No stuck items
          - Problems solved proactively
          - Complex cases escalated
          - Value created through cleanup

          ---

          ### Execution Instructions

          1. **Phase 0 - Cleanup Previous Session** (CRITICAL - Always do this first):
             - **Merge previous cycle's memory PR** (if exists) - prevents self-termination
             - Check recent coordination issues for incomplete work
             - Complete any pending issue updates from interrupted sessions
             - Evaluate and close stale PRs (>7 days old, inactive, or completed)
             - Load memory from previous runs for context
             - Document cleanup actions taken
          2. **Assess**: Analyze current state across all 7 areas
          3. **Prioritize**: Identify most critical actions needed (auto-merge eligible PRs should be high priority)
          4. **Execute**: Take actions using available tools
             - Auto-merge approved PRs without WIP or draft status
             - Assign tech leads to new PRs
             - Create feedback issues for change requests
             - Assign agents to open issues
          5. **Post Updates FIRST** (CRITICAL - Before any closing actions):
             - Post summary to coordination issue
             - Update all linked work issues with status
             - Post PR merge confirmations
             - **DO NOT close anything yet**
          6. **Persist Memory**: Save memory updates and commit to your branch
             - `memory.save()` writes to `.github/agent-system/meta-coordinator-memory.json`
             - Use `report_progress` to commit memory and create PR
             - **DO NOT merge the memory PR** - let next cycle handle it
          7. **Close Coordination Issue**: Now safe to close (all updates posted, memory PR created)
             - `gh issue close $COORDINATION_ISSUE_NUM`
          
          **CRITICAL LIFECYCLE RULES:**
          - **NEVER merge/close PRs before posting issue updates**
          - **NEVER merge your own memory PR** - let next cycle merge it in Phase 0
          - **NEVER close coordination issue before memory PR is created**
          - **ALWAYS complete Phase 0 cleanup to handle interrupted sessions**
          - **ALWAYS evaluate and close stale PRs to reduce open PR count**
          
          **Note on Memory Persistence:** Memory PR is created but NOT merged by current session. Next coordination cycle will merge it in Phase 0, preventing self-termination issues.
          
          **Note:** Steps 5-7 must happen in exact order to prevent data loss from session termination.

          ### Focus Area

          **Current focus:** ${FOCUS_AREA}
          - `all`: Process all 7 areas
          - `prs`: Focus on PR review orchestration + feedback issues + auto-merge
          - `issues`: Focus on agent assignment
          - `reviews`: Focus on review cycles + exceptions

          ### Dry Run Mode

          **Dry run:** ${DRY_RUN}
          - `true`: Assess and report what would be done, but don't make changes
          - `false`: Execute all actions

          ### Tools Available

          You have access to:
          - `gh` CLI for all GitHub operations (PRs, issues, merges, labels, reviews)
          - `tools/match-issue-to-agent.py` for agent matching
          - `tools/match-pr-to-tech-lead.py` for tech lead matching
          - `tools/assign-copilot-to-issue.sh` for assignment
          - `tools/meta-coordinator-memory.py` for persistent memory
          - GitHub API for complex queries
          - All repository files

          ### 🔑 Token and Permissions Configuration

          **CRITICAL FOR OPERATIONS:**

          When executing in the Copilot agent environment, configure the GH_TOKEN properly:

          ```bash
          # Use COPILOT_PAT if available (provides wide access)
          # Otherwise fall back to GITHUB_TOKEN (limited permissions)
          # Note: Variables escaped (\$) for execution in Copilot environment
          export GH_TOKEN="\${COPILOT_PAT:-\${GITHUB_TOKEN}}"
          ```

          **Token Availability Check:**
          ```bash
          # Note: Variables are escaped (\$VAR) because this code will be
          # executed by Copilot agent, not by this workflow
          if [ -n "\$COPILOT_PAT" ]; then
            export GH_TOKEN="\$COPILOT_PAT"
            echo "✅ Using COPILOT_PAT for wide access"
          else
            export GH_TOKEN="\$GITHUB_TOKEN"
            echo "⚠️  Using GITHUB_TOKEN (limited permissions)"
            echo "⚠️  Some operations may fail - see docs/COPILOT_ENVIRONMENT_SETUP.md"
          fi
          ```

          **Permissions Required:**
          - `contents: write` - Create branches, push changes
          - `issues: write` - Create, edit, label issues
          - `pull-requests: write` - Manage PRs, merge, labels
          - `actions: read` - Read workflow run status

          **Setup Instructions:**
          If COPILOT_PAT is not available, the repository needs configuration:
          1. See `docs/COPILOT_ENVIRONMENT_SETUP.md` for complete setup guide
          2. Add COPILOT_PAT secret to the 'copilot' environment in repository settings
          3. PAT must have 'repo' and 'workflow' scopes

          **Graceful Degradation:**
          If wide permissions unavailable:
          - Continue with read operations (list, view, analyze)
          - Skip write operations that fail
          - Document skipped actions in summary
          - Create follow-up issues for actions needing elevation
          - Focus on assessment and recommendations

          ### Expected Output Format

          Post a summary comment with:
          - **System State**: Current counts
          - **Actions Taken**: Numbered list with ✅ indicators
          - **Metrics**: Counts of operations
          - **System Health**: Overall status
          - **Next Run**: When next coordination will occur

          ### Cost Efficiency

          **Cost efficiency guidelines:**
          - Quick assessment first: Is there work to do?
          - If nothing to do → close issue immediately, skip work
          - Focus on highest priority items first
          - Batch API calls where possible
          - Work efficiently and prioritize high-value actions
          - Concise reporting (not verbose)

          Focus on progress, not perfection. Next run is in 15 minutes.

          ---

          **Remember:** You have wide, permissive access to perform all necessary functions. Your goal is to move the system toward its desired state by orchestrating tech lead reviews and agent assignments.

          *This is a coordination request - complete your assessment, take actions, report results, and close this issue.*
          EOF
          )
          
          # Substitute variables in the issue body
          ISSUE_BODY="${ISSUE_BODY//\$\{TRIGGER_EVENT\}/${TRIGGER_EVENT}}"
          ISSUE_BODY="${ISSUE_BODY//\$\{FOCUS_AREA\}/${FOCUS_AREA}}"
          ISSUE_BODY="${ISSUE_BODY//\$\{GITHUB_REPOSITORY\}/${GITHUB_REPOSITORY}}"
          ISSUE_BODY="${ISSUE_BODY//\$\{TIMESTAMP\}/${TIMESTAMP}}"
          ISSUE_BODY="${ISSUE_BODY//\$\{RUN_ID\}/${RUN_ID}}"
          ISSUE_BODY="${ISSUE_BODY//\$\{DRY_RUN\}/${DRY_RUN}}"
          
          # Write issue body to file to handle large content reliably
          echo "$ISSUE_BODY" > /tmp/issue_body.md
          
          # Create the coordination issue (without assignee - will assign via GraphQL after)
          echo "Creating coordination issue..."
          
          issue_url=$(gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${ISSUE_TITLE}" \
            --body-file /tmp/issue_body.md \
            --label "meta-coordination,automated,system-orchestration" 2>&1)
          
          if [ $? -ne 0 ] || [ -z "${issue_url}" ]; then
            echo "❌ Failed to create coordination issue"
            echo "Error output: ${issue_url}"
            exit 1
          fi
          
          # Extract issue number from URL
          issue_number=$(echo "${issue_url}" | grep -oP '/issues/\K\d+' | head -1)
          
          if [ -z "${issue_number}" ]; then
            echo "❌ Could not extract issue number from: ${issue_url}"
            exit 1
          fi
          
          echo "✅ Created coordination issue #${issue_number}"
          echo "   URL: ${issue_url}"
          echo "issue_number=${issue_number}" >> $GITHUB_OUTPUT
          echo "issue_url=${issue_url}" >> $GITHUB_OUTPUT
      
      - name: Assign Copilot to coordination issue using proven GraphQL method
        if: steps.assess.outputs.skip != 'true' && steps.create_request.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ steps.create_request.outputs.issue_number }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Assigning Copilot via GraphQL API"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Using proven assignment script: tools/assign-copilot-to-issue.sh"
          echo "Issue #${ISSUE_NUMBER}"
          echo "Agent: @meta-coordinator-system"
          echo ""
          
          # Use the proven assignment script that handles:
          # - Agent directive injection into issue body
          # - Custom agent actor ID discovery

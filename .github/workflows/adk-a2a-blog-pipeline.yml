# =============================================================================
# ADK A2A Blog Pipeline - Scheduled Workflow
# =============================================================================
# This workflow runs the ADK-based A2A agents pipeline every 6 hours to:
# 1. Discover research topics (academic-research agent)
# 2. Analyze Google Trends for SEO (google-trends agent)
# 3. Write and publish blog posts (blog-writer agent)
#
# Architecture Reference:
# - ADK Samples: https://github.com/google/adk-samples
# - A2A Protocol: https://a2a-protocol.org/
# - Cloud Run Deployment: https://google.github.io/adk-docs/deploy/cloud-run/
#
# Observability:
# - ADK Dev UI available at deployed Cloud Run services
# - Pipeline runs tracked in GitHub issue with label "adk-pipeline"
# - Each run posts a comment with timestamp, mode, and results
# - Metrics collected in Cloud Monitoring
# =============================================================================

name: "A2A: ADK Blog Pipeline"

on:

  workflow_dispatch:

env:
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Agent Cloud Run URLs (populated after deployment)
  ACADEMIC_RESEARCH_URL: ""
  BLOG_WRITER_URL: ""
  GOOGLE_TRENDS_URL: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ===========================================================================
  # Pre-Flight Checks
  # ===========================================================================
  preflight:
    name: "Pre-flight Checks"
    runs-on: ubuntu-latest
    outputs:
      agents_ready: ${{ steps.check.outputs.agents_ready }}
      run_mode: ${{ steps.check.outputs.run_mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check configuration
        id: check
        run: |
          echo "🔍 Checking ADK A2A pipeline configuration..."

          # Determine run mode
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "run_mode=dry_run" >> $GITHUB_OUTPUT
            else
              echo "run_mode=manual" >> $GITHUB_OUTPUT
            fi
          else
            echo "run_mode=scheduled" >> $GITHUB_OUTPUT
          fi

          # Check GCP configuration
          if [[ -n "${{ secrets.GCP_PROJECT_ID }}" ]]; then
            echo "✅ GCP_PROJECT_ID configured"
            echo "agents_ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ GCP_PROJECT_ID not configured - running in simulation mode"
            echo "agents_ready=simulation" >> $GITHUB_OUTPUT
          fi

          echo ""
          echo "📋 Pipeline Configuration:"
          echo "   Run mode: $(cat $GITHUB_OUTPUT | grep run_mode | cut -d= -f2)"
          echo "   Agents: $(cat $GITHUB_OUTPUT | grep agents_ready | cut -d= -f2)"
          echo "   Trigger: ${{ github.event_name }}"

  # ===========================================================================
  # Run A2A Pipeline (Simulation Mode)
  # ===========================================================================
  pipeline-simulation:
    name: "A2A Pipeline (Simulation)"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.agents_ready == 'simulation'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic

      - name: Start simulated agents
        id: agents
        run: |
          echo "🚀 Starting simulated A2A agents..."

          cd infrastructure/docker/adk-agents

          # Start agents in background
          python academic-research/agent.py &
          sleep 2
          python google-trends/agent.py &
          sleep 2
          python blog-writer/agent.py &
          sleep 3

          # Verify agents are running
          echo ""
          echo "🔍 Verifying agent health..."

          for port in 8081 8082 8083; do
            if curl -s "http://localhost:$port/health" | grep -q "healthy"; then
              echo "✅ Agent on port $port: healthy"
            else
              echo "❌ Agent on port $port: not responding"
            fi
          done

          # Set agent URLs
          echo "ACADEMIC_RESEARCH_URL=http://localhost:8081" >> $GITHUB_ENV
          echo "BLOG_WRITER_URL=http://localhost:8082" >> $GITHUB_ENV
          echo "GOOGLE_TRENDS_URL=http://localhost:8083" >> $GITHUB_ENV

      - name: Run A2A orchestrator
        id: orchestrator
        env:
          TOPIC_QUERY: ${{ inputs.topic_query }}
          OUTPUT_FILE: pipeline_result.json
        run: |
          cd infrastructure/docker/adk-agents

          echo "🔄 Running A2A blog pipeline..."
          echo ""

          if [[ -n "$TOPIC_QUERY" ]]; then
            python orchestrator.py "$TOPIC_QUERY"
          else
            python orchestrator.py
          fi

          # Check result
          if [[ -f pipeline_result.json ]]; then
            echo ""
            echo "📄 Pipeline Result:"
            cat pipeline_result.json | python -m json.tool

            # Extract key info for summary
            SUCCESS=$(cat pipeline_result.json | python -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
            CONTEXT_ID=$(cat pipeline_result.json | python -c "import sys,json; print(json.load(sys.stdin).get('context_id', 'N/A'))" 2>/dev/null || echo "N/A")

            echo "success=$SUCCESS" >> $GITHUB_OUTPUT
            echo "context_id=$CONTEXT_ID" >> $GITHUB_OUTPUT
          fi

      - name: Generate summary
        if: always()
        env:
          SUCCESS: ${{ steps.orchestrator.outputs.success }}
          CONTEXT_ID: ${{ steps.orchestrator.outputs.context_id }}
          RUN_MODE: ${{ needs.preflight.outputs.run_mode }}
        run: |
          echo "## 🤖 ADK A2A Blog Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Mode | ${RUN_MODE} (Simulation) |" >> $GITHUB_STEP_SUMMARY
          echo "| Context ID | \`${CONTEXT_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Success | ${SUCCESS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Pipeline Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Academic Research Agent - Discovered topics" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Google Trends Agent - Analyzed SEO trends" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Blog Writer Agent - Generated blog post" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Resources" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [ADK Samples](https://github.com/google/adk-samples)" >> $GITHUB_STEP_SUMMARY
          echo "- [A2A Protocol](https://a2a-protocol.org/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Cloud Run Deployment](https://google.github.io/adk-docs/deploy/cloud-run/)" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results-${{ github.run_id }}
          path: |
            infrastructure/docker/adk-agents/pipeline_result.json
          retention-days: 7

  # ===========================================================================
  # Run A2A Pipeline (Cloud Run Mode)
  # ===========================================================================
  pipeline-cloudrun:
    name: "A2A Pipeline (Cloud Run)"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.agents_ready == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Get Cloud Run service URLs
        id: services
        run: |
          echo "🔍 Getting Cloud Run service URLs..."

          # Get each agent URL
          RESEARCH_URL=$(gcloud run services describe chained-academic-research \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' 2>/dev/null || echo "")

          TRENDS_URL=$(gcloud run services describe chained-google-trends \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' 2>/dev/null || echo "")

          WRITER_URL=$(gcloud run services describe chained-blog-writer \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)' 2>/dev/null || echo "")

          if [[ -n "$RESEARCH_URL" && -n "$TRENDS_URL" && -n "$WRITER_URL" ]]; then
            echo "✅ All agents deployed"
            echo "   Research: $RESEARCH_URL"
            echo "   Trends: $TRENDS_URL"
            echo "   Writer: $WRITER_URL"

            echo "ACADEMIC_RESEARCH_URL=$RESEARCH_URL" >> $GITHUB_ENV
            echo "BLOG_WRITER_URL=$WRITER_URL" >> $GITHUB_ENV
            echo "GOOGLE_TRENDS_URL=$TRENDS_URL" >> $GITHUB_ENV
            echo "agents_deployed=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Some agents not deployed"
            echo "agents_deployed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install httpx pydantic

      - name: Run A2A orchestrator
        if: steps.services.outputs.agents_deployed == 'true'
        id: orchestrator
        env:
          TOPIC_QUERY: ${{ inputs.topic_query }}
          OUTPUT_FILE: pipeline_result.json
        run: |
          cd infrastructure/docker/adk-agents

          echo "🔄 Running A2A blog pipeline against Cloud Run..."

          if [[ -n "$TOPIC_QUERY" ]]; then
            python orchestrator.py "$TOPIC_QUERY"
          else
            python orchestrator.py
          fi

          if [[ -f pipeline_result.json ]]; then
            SUCCESS=$(cat pipeline_result.json | python -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
            echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## 🚀 ADK A2A Blog Pipeline (Cloud Run)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Cloud Run |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ env.GCP_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Success | ${{ steps.orchestrator.outputs.success }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Report Results
  # ===========================================================================
  # This job creates/updates a tracking issue with label "adk-pipeline".
  # Each run posts a comment with timestamp, mode, and summary.
  # Find the tracking issue by searching for label "adk-pipeline".
  report:
    name: "Report Results"
    runs-on: ubuntu-latest
    needs: [preflight, pipeline-simulation, pipeline-cloudrun]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create pipeline report issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_MODE: ${{ needs.preflight.outputs.run_mode }}
          AGENTS_READY: ${{ needs.preflight.outputs.agents_ready }}
        run: |
          # Find existing pipeline status issue or create one
          ISSUE_NUMBER=$(gh issue list --label "adk-pipeline" --state open --limit 1 --json number --jq '.[0].number' || echo "")
          NEW_ISSUE=false

          if [[ -z "$ISSUE_NUMBER" ]]; then
            # Create new issue and extract issue number from URL
            ISSUE_URL=$(gh issue create \
              --title "🤖 ADK A2A Blog Pipeline Status" \
              --label "adk-pipeline,automated" \
              --body "Tracking issue for ADK A2A blog pipeline runs. See comments for run history.") || {
              echo "❌ Failed to create tracking issue"
              exit 1
            }
            # Extract issue number from URL (format: https://github.com/owner/repo/issues/123)
            ISSUE_NUMBER=$(echo "$ISSUE_URL" | sed 's|.*/issues/||' | grep -o '[0-9]*')
            if [[ -z "$ISSUE_NUMBER" ]]; then
              echo "❌ Failed to extract issue number from URL: $ISSUE_URL"
              exit 1
            fi
            echo "📋 Created tracking issue #$ISSUE_NUMBER"
            NEW_ISSUE=true
          fi

          # Initialize new tracking issue with welcome comment
          if [[ "$NEW_ISSUE" == "true" ]]; then
            echo "🎉 Initializing tracking issue with welcome comment..."
            
            # Check if welcome comment exists (match the exact marker from welcome template)
            WELCOME_MARKER="ADK A2A Blog Pipeline Tracking System - Initialized"
            HAS_WELCOME=$(gh issue view "$ISSUE_NUMBER" --json comments --jq "[.comments[].body | select(contains(\"$WELCOME_MARKER\"))] | length")
            
            if [[ "$HAS_WELCOME" -eq 0 ]]; then
              # Post welcome comment directly (don't call initialize script which creates its own issue)
              echo "📝 Posting welcome comment..."
              
              WELCOME_FILE="docs/issue-comments/ADK_PIPELINE_TRACKING_WELCOME.md"
              if [[ -f "$WELCOME_FILE" ]]; then
                INIT_DATE=$(date -u +%Y-%m-%d)
                WELCOME_CONTENT=$(cat "$WELCOME_FILE")
                WELCOME_CONTENT="${WELCOME_CONTENT//2025-12-26/$INIT_DATE}"
                
                if gh issue comment "$ISSUE_NUMBER" --body "$WELCOME_CONTENT"; then
                  echo "✅ Welcome comment posted successfully"
                else
                  echo "⚠️ Welcome comment posting failed, continuing..."
                fi
              else
                echo "⚠️ Welcome template not found: $WELCOME_FILE"
              fi
            else
              echo "✅ Welcome comment already exists"
            fi
          fi

          # Add run summary as comment
          gh issue comment "$ISSUE_NUMBER" --body "## Pipeline Run: $(date -u +%Y-%m-%d' '%H:%M:%S) UTC

          | Property | Value |
          |----------|-------|
          | Trigger | ${{ github.event_name }} |
          | Mode | ${AGENTS_READY} |
          | Workflow Run | [#${{ github.run_number }}]($RUN_URL) |

          ### Summary

          Pipeline executed successfully in ${AGENTS_READY} mode.

          - 🔬 Academic Research: Topics discovered
          - 📈 Google Trends: SEO analysis complete
          - ✍️ Blog Writer: Content generated

          ---
          *🤖 Created by [ADK A2A Blog Pipeline]($RUN_URL)*"

          echo "📝 Updated issue #$ISSUE_NUMBER with run results"

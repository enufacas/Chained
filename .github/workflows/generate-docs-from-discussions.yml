name: "Self-Documenting AI: Generate Documentation from Learnings"

on:
  # Run after discussions are processed
  workflow_run:
    workflows: ["Learning: Self-Documenting AI Discussions"]
    types: [completed]
  
  # Run daily to keep docs fresh
  schedule:
    - cron: '0 12 * * *'  # Daily at 12 PM UTC
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regeneration even if no changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for discussion updates
        id: check_updates
        run: |
          # Check if discussions have been updated in the last 24 hours
          LAST_UPDATE=$(find learnings/discussions -name "discussion_issue_*.json" -mtime -1 | wc -l)
          echo "recent_updates=$LAST_UPDATE" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event.inputs.force_regenerate }}" == "true" ]; then
            echo "Force regenerate requested"
            echo "should_generate=true" >> $GITHUB_OUTPUT
          elif [ "$LAST_UPDATE" -gt "0" ]; then
            echo "Found $LAST_UPDATE recent discussion updates"
            echo "should_generate=true" >> $GITHUB_OUTPUT
          else
            echo "No recent discussion updates"
            echo "should_generate=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate documentation from discussions
        if: steps.check_updates.outputs.should_generate == 'true'
        run: |
          echo "🚀 Generating self-documenting AI learnings..."
          python3 tools/auto-doc-from-discussions.py \
            --discussions-dir learnings/discussions \
            --output-dir docs/learnings
          
          echo "✅ Documentation generation complete"

      - name: Check for changes
        if: steps.check_updates.outputs.should_generate == 'true'
        id: check_changes
        run: |
          git add docs/learnings/
          
          if git diff --staged --quiet; then
            echo "No changes to documentation"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Documentation has been updated"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Get stats
            FILES_CHANGED=$(git diff --staged --name-only | wc -l)
            echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create unique branch name
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="self-documenting-ai/${TIMESTAMP}-${{ github.run_id }}"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create branch and commit
          git checkout -b "$BRANCH_NAME"
          git commit -m "docs: Auto-generate documentation from discussions

Self-documenting AI generated updated documentation from recent discussions.

Generated by: @create-botter (Self-Documenting AI)
Files updated: ${{ steps.check_changes.outputs.files_changed }}
Recent discussion updates: ${{ steps.check_updates.outputs.recent_updates }}

---

*🤖 Created by workflow: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          
          # Push branch
          git push origin "$BRANCH_NAME"
          
          # Create PR
          PR_BODY="## 📚 Self-Documenting AI Update

**@create-botter** has automatically generated updated documentation from recent discussions.

### 📊 Changes Summary

- **Files Updated**: ${{ steps.check_changes.outputs.files_changed }}
- **Recent Discussions**: ${{ steps.check_updates.outputs.recent_updates }}
- **Generated**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

### 🎯 What This Includes

This PR contains auto-generated documentation from AI discussion insights:

1. **Topic Documentation** - Categorized insights by type
2. **Pattern Analysis** - Common terms and themes
3. **Decision Logs** - Technical decisions from discussions
4. **Master Index** - Navigation for all generated docs

### 🔍 Generated Documentation

The following files were generated/updated:

\`\`\`
$(git diff --staged --name-only | sed 's/^/- /')
\`\`\`

### ✅ Quality Checks

- [x] Generated from validated knowledge graph
- [x] Categorized by insight type
- [x] Includes source attribution
- [x] Master index updated
- [x] Cross-references added

### 🤖 About Self-Documenting AI

This documentation is automatically generated by the self-documenting AI system. It:

- Extracts insights from GitHub issue discussions
- Categorizes learnings by topic
- Generates structured markdown documentation
- Updates continuously as discussions evolve

**Documentation Location**: \`docs/learnings/\`

---

*🤖 Created by workflow: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          
          gh pr create \
            --title "docs: Self-documenting AI - Update from discussions" \
            --body "$PR_BODY" \
            --label "documentation,automated,self-documenting-ai" \
            --base main \
            --head "$BRANCH_NAME"
          
          echo "✅ PR created successfully"

      - name: Summary
        if: always()
        run: |
          echo "## Self-Documenting AI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_updates.outputs.should_generate }}" == "true" ]; then
            echo "✅ Documentation generation executed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Recent Updates**: ${{ steps.check_updates.outputs.recent_updates }}" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
              echo "- **Files Changed**: ${{ steps.check_changes.outputs.files_changed }}" >> $GITHUB_STEP_SUMMARY
              echo "- **PR Created**: Yes" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Changes**: None (documentation is up to date)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⏭️ Skipped - No recent discussion updates" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📍 Documentation Location" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`docs/learnings/README.md\`" >> $GITHUB_STEP_SUMMARY

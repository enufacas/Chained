name: "Demo: A2A Multi-Agent Collaboration"

on:
  push:
    branches:
      - 'copilot/implement-agent-orchestration'
    paths:
      - 'tools/a2a/**'
      - 'examples/a2a_*.py'
      - '.github/workflows/a2a-test-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-agent-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run multi-agent collaboration example
        run: |
          echo "=== Running Multi-Agent Collaboration Demo ==="
          echo ""
          echo "Scenario: Design secure REST API with 3 agents"
          echo "  • @engineer-master - Designs API endpoints"
          echo "  • @secure-specialist - Reviews security"
          echo "  • @organize-guru - Structures code layout"
          echo ""
          python3 examples/a2a_multi_agent_collaboration.py
      
      - name: Demo summary
        if: success()
        run: |
          echo ""
          echo "🎉 Multi-Agent Collaboration Demo Complete!"
          echo ""
          echo "✅ 3 agents coordinated successfully"
          echo "✅ Task delegation patterns validated"
          echo "✅ Result aggregation working"
          echo ""
          echo "Multi-agent collaboration patterns validated."

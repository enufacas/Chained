name: "Data: Update Context Summaries"

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2:00 AM UTC
  workflow_dispatch:
  push:
    paths:
      - 'learnings/discussions/*.json'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Generate summaries
        run: python3 tools/generate-context-summaries.py --update-all
      
      - name: Create PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pr_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          BRANCH="context-update/$(date +%Y%m%d-%H%M%S)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: Update context summaries"
          git push origin "$BRANCH"
          
          PR_URL=$(gh pr create --title "chore: Update context summaries" \
            --body "Auto-updated by @investigate-champion
          
          ---
          
          *🤖 Created by workflow: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*" \
            --label "automated,documentation,auto-merge,copilot" \
            --base main --head "$BRANCH")
          
          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_created=true" >> $GITHUB_OUTPUT
          echo "✅ Created PR #$PR_NUMBER"
      
      - name: Auto-merge PR
        if: steps.create_pr.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
          echo "🔄 Auto-merging Context Summaries PR #$PR_NUMBER..."
          
          # Wait a few seconds for PR to be ready
          echo "⏳ Waiting 5 seconds for PR to be ready..."
          sleep 5
          
          # Check PR mergeable state
          PR_DATA=$(gh pr view "$PR_NUMBER" --json mergeable,mergeStateStatus,state)
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          
          echo "📊 PR Status:"
          echo "   State: $PR_STATE"
          echo "   Mergeable: $MERGEABLE"
          echo "   Merge State: $MERGE_STATE"
          
          # Check if already merged
          if [ "$PR_STATE" = "MERGED" ]; then
            echo "✅ PR #$PR_NUMBER is already merged!"
            exit 0
          fi
          
          # Attempt merge with auto strategy (squash for cleaner history)
          echo "🚀 Attempting to merge PR #$PR_NUMBER..."
          if gh pr merge "$PR_NUMBER" --repo ${{ github.repository }} --auto --squash --delete-branch; then
            echo "✅ PR #$PR_NUMBER merge initiated successfully!"
            echo "🎉 Context summaries PR merged"
            
            # Brief wait to confirm merge completed
            sleep 2
            FINAL_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$FINAL_STATE" = "MERGED" ]; then
              echo "✅ Merge confirmed!"
            else
              echo "ℹ️  Merge is processing (state: $FINAL_STATE)"
            fi
          else
            echo "⚠️  Merge command failed, checking if PR can be force merged..."
            
            # Try regular merge without auto flag
            if gh pr merge "$PR_NUMBER" --repo ${{ github.repository }} --squash --delete-branch; then
              echo "✅ PR #$PR_NUMBER merged successfully (direct merge)!"
              echo "🎉 Context summaries PR merged"
            else
              echo "❌ Failed to merge PR #$PR_NUMBER"
              echo "This may indicate:"
              echo "  - Merge conflicts"
              echo "  - Required checks not passing"
              echo "  - Branch protection rules blocking"
              echo ""
              echo "Check PR status at: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              exit 1
            fi
          fi
